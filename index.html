/* ============================================================================
   부팅 · 전역 이벤트 · 단축키
   ============================================================================ */
document.addEventListener('DOMContentLoaded',()=>{
  try{
    UI.boot();
    Pal.build();
    document.getElementById('st-std').innerHTML='권고판본 <span class="mono">'+K.std+'</span>';
    document.getElementById('st-data').innerHTML='핵종데이터 <span class="mono">'+NUC.ver+'</span>';
  }catch(e){
    document.getElementById('main').innerHTML=
      '<div style="padding:24px"><h3 style="color:#f85149">초기화 오류</h3><pre>'+
      (e.stack||e.message)+'</pre></div>';
    console.error(e);}
});
/* 팔레트 입력 */
document.addEventListener('input',e=>{if(e.target.id==='palq')Pal.render(e.target.value);});
/* 전역 단축키 */
document.addEventListener('keydown',e=>{
  const inField=/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''));
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();Pal.open();return;}
  if(e.key==='Escape'){
    if(document.getElementById('pal').style.display==='block'){Pal.close();return;}
    if(document.getElementById('zoom').style.display==='block'){UI.unzoom();return;}}
  if(document.getElementById('pal').style.display==='block'){
    const items=document.querySelectorAll('#pall .it');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      items.forEach(i=>i.classList.remove('sel'));
      Pal.sel=U.clamp(Pal.sel+(e.key==='ArrowDown'?1:-1),0,items.length-1);
      if(items[Pal.sel]){items[Pal.sel].classList.add('sel');items[Pal.sel].scrollIntoView({block:'nearest'});}
      return;}
    if(e.key==='Enter'){e.preventDefault();if(items[Pal.sel])items[Pal.sel].click();return;}}
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
    e.preventDefault();
    const m=MODS.find(x=>x.id===UI.cur);
    if(m){const pane=document.getElementById('sbl-'+m.id+'-'+m._sub);
      const b=pane&&pane.querySelector('.btn:not(.sec)');if(b)b.click();}
    return;}
  if(inField)return;
  if(e.key==='?'){UI.help();return;}
  if(/^[1-9]$/.test(e.key)){const m=MODS[+e.key-1];if(m)UI.go(m.id);return;}
  if(e.key.toLowerCase()==='t'){UI.theme();return;}
});
/* 창 크기 변경 시 차트 재계산 */
let _rz;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>UI.redrawAll(),220);});
/* 확대 오버레이 배경 클릭 */
document.getElementById('zoom').addEventListener('click',e=>{if(e.target.id==='zoom')UI.unzoom();});
document.getElementById('pal').addEventListener('click',e=>{if(e.target.id==='pal')Pal.close();});
</script>

<script>
/* ============================================================================
   Mobile controller — presentation/navigation only.
   ============================================================================ */
(function(){
  'use strict';
  const Mobile={
    _ready:false,_tipOpen:null,
    init(){
      if(this._ready)return;this._ready=true;
      this.buildModules();
      this.bindSheets();
      this.bindTips();
      this.bindViewport();
      this.bindAuthToggle();
      this.patchNavigation();
      this.sync();
      this.updateThemeColor();
    },
    buildModules(){
      const box=document.getElementById('mobileModuleList');if(!box||typeof MODS==='undefined')return;
      box.innerHTML='';
      MODS.forEach(m=>{
        const b=document.createElement('button');b.type='button';b.dataset.mid=m.id;
        b.innerHTML='<span class="mic">'+m.icon+'</span><span>'+U.esc(m.name)+'</span>';
        b.addEventListener('click',()=>{UI.go(m.id);this.closeSheets();this.toTop();});
        box.appendChild(b);
      });
    },
    patchNavigation(){
      if(!window.UI||UI._mobilePatched)return;
      UI._mobilePatched=true;
      const oldGo=UI.go.bind(UI);
      UI.go=(id)=>{oldGo(id);this.sync();setTimeout(()=>this.centerActiveTab(),0);};
      const oldSub=UI.sub.bind(UI);
      UI.sub=(mid,sid)=>{oldSub(mid,sid);setTimeout(()=>this.toTop(false),0);};
      const oldTheme=UI.theme.bind(UI);
      UI.theme=()=>{oldTheme();setTimeout(()=>this.updateThemeColor(),80);};
    },
    sync(){
      document.querySelectorAll('#mobileModuleList button').forEach(b=>b.classList.toggle('on',b.dataset.mid===UI.cur));
      document.querySelectorAll('[data-mlv]').forEach(b=>b.classList.toggle('on',+b.dataset.mlv===UI.lv));
      const m=typeof MODS!=='undefined'?MODS.find(x=>x.id===UI.cur):null;
      const cur=document.getElementById('mobileCurrent');
      if(cur&&m){const s=m.subs.find(x=>x.id===m._sub)||m.subs[0];cur.textContent='현재: '+m.name+(s?' · '+s.name:'');}
    },
    level(n){UI.level(n);this.sync();},
    centerActiveTab(){
      const b=document.getElementById('tb-'+UI.cur);if(b&&b.scrollIntoView){try{b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}catch(e){b.scrollIntoView();}}
    },
    currentScroller(){return UI.cur?document.getElementById('md-'+UI.cur):null;},
    toTop(smooth=true){
      const sc=this.currentScroller();if(sc)sc.scrollTo({top:0,behavior:smooth?'smooth':'auto'});
    },
    openSheet(id){
      this.closeSheets();const s=document.getElementById(id);if(!s)return;
      s.classList.add('on');s.setAttribute('aria-hidden','false');
      const c=s.querySelector('.sheet-close');if(c)setTimeout(()=>c.focus(),0);
    },
    closeSheets(){
      document.querySelectorAll('.mobile-sheet.on').forEach(s=>{s.classList.remove('on');s.setAttribute('aria-hidden','true');});
    },
    bindSheets(){
      document.querySelectorAll('.mobile-sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)this.closeSheets();}));
      document.addEventListener('keydown',e=>{if(e.key==='Escape')this.closeSheets();});
    },
    bindTips(){
      document.addEventListener('click',e=>{
        const t=e.target.closest&&e.target.closest('.tip');
        const box=document.getElementById('tipbox');
        if(t){
          e.preventDefault();e.stopPropagation();
          if(typeof t.onmouseenter==='function')t.onmouseenter({currentTarget:t,target:t});
          this._tipOpen=t;return;
        }
        if(box&&box.style.display==='block'&&!e.target.closest('#tipbox')){box.style.display='none';this._tipOpen=null;}
      },true);
    },
    bindViewport(){
      const set=()=>{
        const vv=window.visualViewport;
        if(vv)document.documentElement.style.setProperty('--visual-h',vv.height+'px');
      };
      set();window.addEventListener('resize',set);if(window.visualViewport)visualViewport.addEventListener('resize',set);
    },
    bindAuthToggle(){
      const t=document.getElementById('authToggle'),p=document.getElementById('authPassword');if(!t||!p)return;
      t.addEventListener('click',()=>{const show=p.type==='password';p.type=show?'text':'password';t.textContent=show?'숨김':'보기';t.setAttribute('aria-label',show?'비밀번호 숨기기':'비밀번호 표시');p.focus();});
    },
    lock(){
      try{sessionStorage.removeItem('kstatbench-auth-v1.1');}catch(e){}
      location.reload();
    },
    updateThemeColor(){
      const c=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#0d1117';
      const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',c);
    }
  };
  window.Mobile=Mobile;
  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>Mobile.init(),0));
})();
</script>
