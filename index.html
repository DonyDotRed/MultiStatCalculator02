<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="K-STATBENCH">
<meta name="format-detection" content="telephone=no">
<title>K-STATBENCH Mobile v1.1 — 통합 계산 워크벤치</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2430; --line:#2d3745; --line2:#3d4a5c;
  --fg:#e6edf3; --fg2:#9aa8b8; --fg3:#6b7a8d;
  --acc:#4da3ff; --acc2:#2b7fd4; --ok:#3fb950; --warn:#e3b341; --bad:#f85149;
  --rad:#ff9d4d; --elec:#7ee787; --stat:#79c0ff; --unit:#d2a8ff; --fin:#ffa198;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --fs:14px; --r:8px;
}
html[data-theme="light"]{
  --bg:#f6f8fa; --bg2:#fff; --bg3:#eef2f6; --line:#d0d7de; --line2:#b6c0cc;
  --fg:#1f2328; --fg2:#57606a; --fg3:#8c959f; --acc:#0969da; --acc2:#0550ae;
  --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e;
  --rad:#bc4c00; --elec:#1a7f37; --stat:#0969da; --unit:#8250df; --fin:#cf222e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/1.55 var(--sans);overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 상단 바 ---------- */
#top{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;background:var(--bg2);
  border-bottom:1px solid var(--line);flex-shrink:0}
#brand{font-weight:700;letter-spacing:.4px;white-space:nowrap}
#brand small{color:var(--fg3);font-weight:400;margin-left:6px}
.tbtn{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:5px 10px;
  cursor:pointer;white-space:nowrap;transition:.12s}
.tbtn:hover{border-color:var(--acc);color:var(--acc)}
.tbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
#top .sp{flex:1}
#lvlsel{display:flex;background:var(--bg3);border:1px solid var(--line);border-radius:6px;overflow:hidden}
#lvlsel button{background:none;border:0;padding:5px 10px;cursor:pointer;color:var(--fg2);font-size:12px}
#lvlsel button.on{background:var(--acc);color:#fff}

/* ---------- 모듈 탭 ---------- */
#tabs{display:flex;gap:2px;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--line);
  flex-shrink:0;overflow-x:auto}
#tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;
  cursor:pointer;color:var(--fg2);white-space:nowrap;font-size:13px;display:flex;gap:6px;align-items:center}
#tabs button:hover{color:var(--fg);background:var(--bg3)}
#tabs button.on{color:var(--fg);border-bottom-color:var(--tc,var(--acc));font-weight:600}
#tabs button .ic{font-size:15px}

/* ---------- 본문 ---------- */
#main{position:absolute;top:80px;bottom:26px;left:0;right:0;overflow:hidden}
.mod{display:none;height:100%;overflow:hidden}
.mod.on{display:block}
.split{display:grid;grid-template-columns:340px 1fr;height:100%}
.split.wide{grid-template-columns:390px 1fr}
.pane{overflow:auto;padding:12px}
.pane.left{background:var(--bg2);border-right:1px solid var(--line)}
@media(max-width:900px){.split,.split.wide{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

/* ---------- 서브탭 ---------- */
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;position:sticky;top:-12px;
  background:var(--bg2);padding:8px 0;z-index:5;border-bottom:1px solid var(--line)}
.subtabs button{background:var(--bg3);border:1px solid var(--line);border-radius:14px;
  padding:4px 11px;font-size:12px;cursor:pointer;color:var(--fg2)}
.subtabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.sub{display:none}.sub.on{display:block}

/* ---------- 카드 ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.card>h3{margin:0;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:var(--r) var(--r) 0 0}
.card>h3 .sp{flex:1}
.card>.bd{padding:12px}
.card.pad0>.bd{padding:0}
.zbtn{background:none;border:1px solid var(--line);border-radius:5px;color:var(--fg3);
  cursor:pointer;padding:1px 7px;font-size:11px}
.zbtn:hover{color:var(--acc);border-color:var(--acc)}

/* ---------- 폼 ---------- */
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>label{flex:0 0 130px;color:var(--fg2);font-size:12.5px;display:flex;align-items:center;gap:4px}
.row>label.w{flex:0 0 165px}
.row>input,.row>select,.row>textarea{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px}
.row>input:focus,.row>select:focus,.row>textarea:focus{outline:0;border-color:var(--acc);
  box-shadow:0 0 0 2px rgba(77,163,255,.18)}
input[type=range]{padding:0;accent-color:var(--acc)}
textarea{font-family:var(--mono);font-size:12px;resize:vertical}
.btn{background:var(--acc);border:0;border-radius:6px;padding:7px 14px;cursor:pointer;
  color:#fff;font-weight:600}
.btn:hover{background:var(--acc2)}
.btn.sec{background:var(--bg3);border:1px solid var(--line);color:var(--fg);font-weight:500}
.btn.sec:hover{border-color:var(--acc);color:var(--acc)}
.btn.sm{padding:4px 9px;font-size:12px;font-weight:500}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
fieldset{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:0 0 10px}
legend{color:var(--fg2);font-size:11.5px;padding:0 5px}

/* ---------- 결과 ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv b{color:var(--fg2);font-weight:500}
.kv span{font-family:var(--mono);text-align:right}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{border:1px solid var(--line);padding:4px 7px;text-align:right}
table.t th{background:var(--bg3);color:var(--fg2);font-weight:600;text-align:center;position:sticky;top:0}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t tbody tr:hover{background:var(--bg3)}
table.t td.num{font-family:var(--mono)}
.big{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--acc)}
.unit{font-size:13px;color:var(--fg2);font-weight:400;margin-left:3px}
.concl{background:var(--bg3);border-left:3px solid var(--acc);padding:9px 12px;border-radius:0 6px 6px 0;
  margin-bottom:10px;font-size:13.5px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:11px;padding:1px 9px;
  font-size:11px;font-weight:600;border:1px solid}
.badge.ok{color:var(--ok);border-color:var(--ok);background:rgba(63,185,80,.1)}
.badge.warn{color:var(--warn);border-color:var(--warn);background:rgba(227,179,65,.1)}
.badge.bad{color:var(--bad);border-color:var(--bad);background:rgba(248,81,73,.1)}
.badge.info{color:var(--acc);border-color:var(--acc);background:rgba(77,163,255,.1)}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.note{font-size:11.5px;color:var(--fg3);line-height:1.5;margin-top:6px}
.warnbox{background:rgba(227,179,65,.1);border:1px solid var(--warn);border-radius:6px;
  padding:8px 10px;font-size:12px;color:var(--warn);margin:8px 0}
.errbox{background:rgba(248,81,73,.1);border:1px solid var(--bad);border-radius:6px;
  padding:8px 10px;font-size:12px;color:var(--bad);margin:8px 0}

/* ---------- 접기 (계산과정) ---------- */
details.steps{border:1px solid var(--line);border-radius:6px;margin-top:10px;background:var(--bg3)}
details.steps>summary{cursor:pointer;padding:7px 11px;font-size:12.5px;color:var(--fg2);
  user-select:none;list-style:none;display:flex;align-items:center;gap:6px}
details.steps>summary::-webkit-details-marker{display:none}
details.steps>summary:before{content:"▸";color:var(--acc);transition:.15s}
details.steps[open]>summary:before{transform:rotate(90deg)}
details.steps .in{padding:0 12px 11px;font-size:12.5px}
.step{border-left:2px solid var(--line2);padding:5px 0 5px 11px;margin-left:4px}
.step .lb{color:var(--acc);font-size:11.5px;font-weight:600}
.step .fm{font-family:var(--mono);color:var(--fg2);font-size:12px;word-break:break-all}
.step .rs{font-family:var(--mono);color:var(--fg)}

/* ---------- 말풍선 ---------- */
.tip{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
  border-radius:50%;background:var(--line2);color:var(--bg);font-size:10px;font-weight:700;
  cursor:help;flex-shrink:0}
.tip:hover{background:var(--acc)}
#tipbox{position:fixed;z-index:9999;max-width:340px;background:var(--bg2);border:1px solid var(--acc);
  border-radius:8px;padding:10px 12px;font-size:12.3px;line-height:1.6;box-shadow:0 8px 28px rgba(0,0,0,.5);
  display:none;pointer-events:none}
#tipbox .h{color:var(--acc);font-weight:700;margin-bottom:4px;font-size:12.5px}
#tipbox .lv{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
#tipbox .lv b{color:var(--warn);font-size:11px}

/* ---------- 차트 ---------- */
.chart{position:relative;width:100%;background:var(--bg);border-radius:6px}
.chart canvas{display:block;width:100%;border-radius:6px}
.chart .hov{position:absolute;background:var(--bg2);border:1px solid var(--acc);border-radius:5px;
  padding:4px 8px;font-size:11.5px;font-family:var(--mono);pointer-events:none;display:none;z-index:3;
  white-space:pre}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;padding:6px 10px;color:var(--fg2)}
.legend i{display:inline-block;width:11px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
svg.dia{width:100%;display:block;background:var(--bg);border-radius:6px}
svg.dia text{font-family:var(--sans);font-size:11px;fill:var(--fg2)}
svg.dia .lb{fill:var(--fg);font-weight:600}

/* ---------- 확대 오버레이 ---------- */
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:900;display:none;padding:24px}
#zoom .box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;height:100%;
  display:flex;flex-direction:column}
#zoom .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#zoom .bd{flex:1;overflow:auto;padding:14px}

/* ---------- 커맨드 팔레트 ---------- */
#pal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:950;display:none;padding-top:9vh}
#pal .box{max-width:620px;margin:0 auto;background:var(--bg2);border:1px solid var(--acc);
  border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#pal input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 16px;font-size:15px}
#pal input:focus{outline:0}
#pal .list{max-height:52vh;overflow:auto}
#pal .it{padding:8px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px}
#pal .it:hover,#pal .it.sel{background:var(--bg3)}
#pal .it .tag{font-size:10px;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--fg3)}
#pal .it .d{color:var(--fg3);font-size:11.5px;margin-left:auto}

/* ---------- 하단 상태바 ---------- */
#status{position:absolute;bottom:0;left:0;right:0;height:26px;background:var(--bg2);
  border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;
  font-size:11.5px;color:var(--fg3)}
#status .d{display:flex;align-items:center;gap:5px}
#status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---------- 기타 ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:1200px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.mono{font-family:var(--mono)}
.sc{overflow:auto;max-height:420px}
.chip{display:inline-block;background:var(--bg3);border:1px solid var(--line);border-radius:12px;
  padding:2px 9px;font-size:11.5px;margin:2px 3px 2px 0;cursor:pointer}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
h4{margin:12px 0 6px;font-size:12.5px;color:var(--fg2);border-bottom:1px dashed var(--line);padding-bottom:3px}
.prov{font-size:10.5px;color:var(--fg3);font-family:var(--mono);margin-top:8px;padding-top:6px;
  border-top:1px dashed var(--line)}
.hl{color:var(--acc);font-weight:600}
.ttl{font-size:15px;font-weight:700;margin:0 0 3px}
.sub-desc{color:var(--fg3);font-size:12px;margin-bottom:12px}


/* ---------- 사용자 확인 게이트 (GitHub Pages) ---------- */
body.auth-locked > #top,
body.auth-locked > #tabs,
body.auth-locked > #main,
body.auth-locked > #status,
body.auth-locked > #tipbox,
body.auth-locked > #zoom,
body.auth-locked > #pal{visibility:hidden}
#authGate{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;
  padding:24px;background:var(--bg);color:var(--fg)}
#authGate[hidden]{display:none!important}
#authGate .auth-card{width:min(430px,100%);background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.38);overflow:hidden}
#authGate .auth-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);background:var(--bg3)}
#authGate .auth-brand{font-size:12px;color:var(--fg3);letter-spacing:.4px;margin-bottom:5px}
#authGate h1{font-size:21px;line-height:1.3;margin:0;font-weight:750}
#authGate .auth-body{padding:20px}
#authGate .auth-desc{margin:0 0 15px;color:var(--fg2);font-size:13px;line-height:1.65}
#authGate label{display:block;color:var(--fg2);font-size:12px;margin-bottom:6px}
#authGate .auth-row{display:flex;gap:8px}
#authGate input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:9px 11px;color:var(--fg);outline:none}
#authGate input:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(77,163,255,.18)}
#authGate button{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:9px 16px;
  font-weight:700;cursor:pointer;white-space:nowrap}
#authGate button:hover{background:var(--acc2)}
#authGate .auth-msg{min-height:20px;margin-top:8px;font-size:12px;color:var(--bad)}
#authGate .auth-foot{padding:10px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--fg3);
  text-align:center;background:var(--bg3)}
#authGate .auth-card.shake{animation:authShake .25s linear 1}
@keyframes authShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}


/* ============================================================================
   K-STATBENCH Mobile UX Layer v1.1
   Mobile-first dedicated layout; calculation kernel remains unchanged.
   ============================================================================ */
:root{
  --mobile-top:54px;
  --mobile-tabs:46px;
  --mobile-bar:62px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
html,body{height:100%;min-height:100dvh;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{touch-action:manipulation;overflow:hidden;padding:0;background:var(--bg)}
button,.btn,.tbtn,.chip,.subtabs button,#tabs button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--acc);outline-offset:2px
}
/* Compact app header */
#top{
  position:fixed;z-index:120;top:0;left:0;right:0;
  height:calc(var(--mobile-top) + var(--safe-t));
  padding:var(--safe-t) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l));
  gap:8px;box-shadow:0 1px 8px rgba(0,0,0,.18)
}
#brand{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis}
#brand small{display:none}
#brand::after{content:' · MOBILE';font-size:10px;color:var(--acc);font-weight:700;letter-spacing:.7px}
#top>.tbtn,#top>#lvlsel{display:none!important}
/* Module tab rail */
#tabs{
  position:fixed;z-index:115;top:calc(var(--mobile-top) + var(--safe-t));left:0;right:0;
  height:var(--mobile-tabs);padding:0 calc(8px + var(--safe-r)) 0 calc(8px + var(--safe-l));
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;box-shadow:0 1px 0 var(--line)
}
#tabs::-webkit-scrollbar{display:none}
#tabs button{min-height:44px;padding:8px 12px;font-size:12.5px;scroll-snap-align:start}
#tabs button .ic{font-size:16px}
/* Main content: one continuous vertical flow, input then result */
#main{
  position:fixed;top:calc(var(--mobile-top) + var(--mobile-tabs) + var(--safe-t));
  bottom:calc(var(--mobile-bar) + var(--safe-b));left:0;right:0;overflow:hidden
}
.mod{height:100%;overflow:hidden}
.mod.on{display:block;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scroll-behavior:smooth}
.split,.split.wide{display:block;height:auto;min-height:100%}
.pane{overflow:visible!important;padding:10px 10px 4px}
.pane.left{border-right:0;border-bottom:1px solid var(--line);background:var(--bg2)}
.pane.right{padding-top:12px;padding-bottom:28px}
.subtabs{
  position:sticky;top:0;z-index:20;margin:0 -10px 10px;padding:7px 10px 8px;
  flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;min-height:38px;padding:6px 12px;font-size:12.5px;border-radius:18px}
/* Forms: thumb-friendly and iOS zoom-safe */
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;align-items:stretch;margin-bottom:12px}
.row>label,.row>label.w{flex:none;font-size:12.5px;line-height:1.35;margin:0;color:var(--fg2)}
.row>input,.row>select,.row>textarea{width:100%;min-width:0;min-height:46px;padding:10px 11px;font-size:16px;border-radius:8px}
.row>textarea,textarea{min-height:112px;line-height:1.45}
input,select,textarea{font-size:16px}
input[type=range]{min-height:36px;padding:0}
fieldset{padding:10px;margin-bottom:12px}
legend{font-size:12px}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.btn,.tbtn{min-height:44px;padding:9px 12px;border-radius:8px}
.btn.sm{min-height:40px;padding:7px 10px;font-size:12.5px}
.btns>.btn:only-child{grid-column:1/-1}
/* Cards/results */
.card{border-radius:10px;margin-bottom:10px}
.card>h3{min-height:42px;padding:9px 11px;font-size:13px;border-radius:10px 10px 0 0}
.card>.bd{padding:11px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.card.pad0>.bd{padding:0}
.big{font-size:21px;overflow-wrap:anywhere}
.kv{grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;font-size:13px}
.kv span{max-width:58vw;overflow-wrap:anywhere}
.concl{font-size:13px;padding:10px 11px}
.note,.prov{overflow-wrap:anywhere}
.grid2,.grid3{grid-template-columns:1fr!important;gap:8px}
/* Tables and charts */
.sc{max-height:none;overflow:auto;-webkit-overflow-scrolling:touch}
table.t{width:max-content;min-width:100%;font-size:12px}
table.t th,table.t td{padding:6px 8px;white-space:nowrap}
table.t th{position:sticky;top:0;z-index:2}
.chart{min-height:180px;overflow:hidden}
.chart canvas{max-width:100%;height:auto}
svg.dia{min-width:100%;height:auto}
/* Touch-friendly details and tips */
details.steps>summary{min-height:44px;padding:10px 11px;font-size:13px}
.tip{width:24px;height:24px;font-size:12px;cursor:pointer}
#tipbox{
  left:12px!important;right:12px!important;top:auto!important;
  bottom:calc(var(--mobile-bar) + var(--safe-b) + 10px)!important;
  max-width:none;max-height:44dvh;overflow:auto;padding:13px 14px;font-size:13px;
  pointer-events:auto;box-shadow:0 14px 40px rgba(0,0,0,.45)
}
/* Full-screen mobile overlays */
#zoom{padding:0;background:var(--bg);z-index:1400}
#zoom .box{height:100dvh;border:0;border-radius:0;padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
#zoom .hd{position:sticky;top:0;z-index:2;min-height:52px;padding:8px 10px;background:var(--bg2)}
#zoom .bd{padding:10px;overflow:auto;-webkit-overflow-scrolling:touch}
#pal{z-index:1500;padding:var(--safe-t) 0 var(--safe-b);background:var(--bg)}
#pal .box{max-width:none;width:100%;height:100%;margin:0;border:0;border-radius:0;display:flex;flex-direction:column}
#pal input{flex:0 0 auto;min-height:54px;padding:12px 14px;font-size:16px}
#pal .list{flex:1;max-height:none;overflow:auto;-webkit-overflow-scrolling:touch}
#pal .it{min-height:48px;padding:10px 14px;font-size:13px}
/* Desktop status bar is replaced by the mobile toolbar. */
#status{display:none!important}
/* Mobile bottom navigation */
#mobileBar{
  position:fixed;z-index:130;left:0;right:0;bottom:0;
  height:calc(var(--mobile-bar) + var(--safe-b));
  padding:4px calc(5px + var(--safe-r)) var(--safe-b) calc(5px + var(--safe-l));
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;
  background:var(--bg2);background:color-mix(in srgb,var(--bg2) 94%,transparent);border-top:1px solid var(--line);
  box-shadow:0 -5px 20px rgba(0,0,0,.18);backdrop-filter:blur(12px)
}
#mobileBar button{
  border:0;background:none;color:var(--fg2);border-radius:9px;min-width:0;min-height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;font-weight:600;padding:3px;cursor:pointer
}
#mobileBar button:active,#mobileBar button.on{background:var(--bg3);color:var(--acc)}
#mobileBar .mi{font-size:20px;line-height:1}
/* Bottom sheets */
.mobile-sheet{position:fixed;inset:0;z-index:1450;display:none;background:rgba(0,0,0,.5);padding-top:var(--safe-t)}
.mobile-sheet.on{display:block}
.mobile-sheet .sheet-box{
  position:absolute;left:0;right:0;bottom:0;max-height:min(78dvh,720px);overflow:hidden;
  background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
  padding-bottom:var(--safe-b);box-shadow:0 -18px 50px rgba(0,0,0,.35)
}
.mobile-sheet .sheet-hd{display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg3)}
.mobile-sheet .sheet-hd b{font-size:14px}.mobile-sheet .sheet-hd .sp{flex:1}
.mobile-sheet .sheet-close{width:40px;height:40px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);border-radius:9px;font-size:18px}
.mobile-sheet .sheet-bd{padding:10px 12px 14px;overflow:auto;max-height:calc(min(78dvh,720px) - 52px);-webkit-overflow-scrolling:touch}
#mobileModuleList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#mobileModuleList button{
  min-height:58px;text-align:left;background:var(--bg3);border:1px solid var(--line);color:var(--fg);
  border-radius:10px;padding:9px 10px;font-size:12.5px;display:flex;align-items:center;gap:8px
}
#mobileModuleList button.on{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc);color:var(--acc)}
#mobileModuleList .mic{font-size:19px;flex:0 0 auto}
.mobile-tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mobile-tool-grid button{min-height:50px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);border-radius:9px;padding:8px;font-weight:600}
.mobile-level{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.mobile-level button{min-height:44px;border:1px solid var(--line);background:var(--bg3);color:var(--fg2);border-radius:8px}
.mobile-level button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#mobileCurrent{font-size:11.5px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px}
/* Auth gate optimized for soft keyboard and one-thumb use */
body.auth-locked > #mobileBar,
body.auth-locked > .mobile-sheet{visibility:hidden}
#authGate{padding:calc(16px + var(--safe-t)) calc(14px + var(--safe-r)) calc(16px + var(--safe-b)) calc(14px + var(--safe-l));align-items:center}
#authGate .auth-card{width:100%;max-width:460px;border-radius:14px}
#authGate .auth-head{padding:18px 16px 14px}
#authGate h1{font-size:22px}
#authGate .auth-body{padding:18px 16px}
#authGate .auth-desc{font-size:13.5px}
#authGate .auth-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
#authGate input{grid-column:1/-1;min-height:50px;padding:11px 64px 11px 12px;font-size:16px}
#authGate button{min-height:46px;font-size:14px}
#authGate #authSubmit{grid-column:1/-1}
#authGate .auth-toggle{position:absolute;right:6px;top:4px;margin:0;min-height:42px!important;padding:6px 9px!important;background:transparent!important;color:var(--fg2)!important;border:0!important}
#authGate .auth-foot{padding-bottom:calc(10px + var(--safe-b))}
/* Landscape phones: preserve content space. */
@media (orientation:landscape) and (max-height:560px){
  :root{--mobile-top:46px;--mobile-tabs:42px;--mobile-bar:54px}
  #top{height:calc(var(--mobile-top) + var(--safe-t))}
  #tabs button{min-height:40px;padding-top:5px;padding-bottom:5px}
  #mobileBar button{min-height:46px}.mobile-sheet .sheet-box{max-height:90dvh}
}
@media (min-width:760px){
  .pane{padding-left:max(16px,calc((100vw - 760px)/2));padding-right:max(16px,calc((100vw - 760px)/2))}
  .subtabs{margin-left:calc(-1 * max(16px,calc((100vw - 760px)/2)));margin-right:calc(-1 * max(16px,calc((100vw - 760px)/2)));
    padding-left:max(16px,calc((100vw - 760px)/2));padding-right:max(16px,calc((100vw - 760px)/2))}
  #mobileModuleList{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<div id="authGate" role="dialog" aria-modal="true" aria-labelledby="authTitle">

      <label for="authPassword">비밀번호</label>
      <div class="auth-row">
        <input id="authPassword" type="password" autocomplete="current-password" inputmode="text" aria-describedby="authMsg" enterkeyhint="go" autocapitalize="none" spellcheck="false">
        <button id="authToggle" class="auth-toggle" type="button" aria-label="비밀번호 표시">보기</button>
        <button id="authSubmit" type="button">확인</button>
      </div>
      <div class="auth-msg" id="authMsg" aria-live="polite"></div>
    </div>
    <div class="auth-foot">GitHub Pages · K-STATBENCH Mobile v1.1</div>
  </div>
</div>
<script>
/* 사용자 확인: 현재 탭(sessionStorage)에만 인증 상태 유지 */
(function(){
  'use strict';
  const AUTH_KEY='kstatbench-auth-v1.1';
  const AUTH_TOKEN='09090c74379eedfd5cb1abf8fbcf40f0933937fd4e1a9d5f63982f43a18f304f';
  const gate=document.getElementById('authGate');
  const input=document.getElementById('authPassword');
  const submit=document.getElementById('authSubmit');
  const msg=document.getElementById('authMsg');
  const card=document.getElementById('authCard');

  function storageGet(){try{return sessionStorage.getItem(AUTH_KEY);}catch(e){return null;}}
  function storageSet(v){try{sessionStorage.setItem(AUTH_KEY,v);}catch(e){}}
  function unlock(){
    storageSet(AUTH_TOKEN);
    document.body.classList.remove('auth-locked');
    gate.hidden=true;
    msg.textContent='';
  }
  function fail(){
    msg.textContent='비밀번호가 올바르지 않습니다.';
    input.value=''; input.focus();
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }
  async function sha256(s){
    if(window.crypto && crypto.subtle){
      const data=new TextEncoder().encode(s);
      const hash=await crypto.subtle.digest('SHA-256',data);
      return Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');
    }
    /* 오래된/비보안 로컬 환경용 호환 폴백. GitHub Pages(HTTPS)에서는 위 SHA-256 경로 사용. */
    return s==='red'+'pass' ? AUTH_TOKEN : '';
  }
  async function verify(){
    const pw=input.value;
    if(!pw){msg.textContent='비밀번호를 입력하세요.';input.focus();return;}
    submit.disabled=true;
    try{(await sha256(pw))===AUTH_TOKEN ? unlock() : fail();}
    catch(e){fail();}
    finally{submit.disabled=false;}
  }

  if(storageGet()===AUTH_TOKEN){unlock();}
  else{setTimeout(()=>input.focus(),0);}
  submit.addEventListener('click',verify);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();verify();}});
  document.addEventListener('keydown',e=>{
    if(document.body.classList.contains('auth-locked')){
      if(e.target!==input){e.preventDefault();input.focus();}
      e.stopImmediatePropagation();
    }
  },false);
})();
</script>

<script>
"use strict";
/* ============================================================================
   K-STATBENCH 커널 — Layer 1 : core / PRNG / 특수함수 / 분포 / 통계
   설계서 §3.3 커널 계약, §4 통계, §13.2 허용오차 정책 준수
   ============================================================================ */
const K={ver:"1.1.0",std:"ICRP-103",dataVer:"EDU-2026.1"};

/* ---------- 유틸 ---------- */
const U={
  n(v,d){const x=parseFloat(v);return isFinite(x)?x:(d===undefined?NaN:d);},
  fmt(x,s){ // 유효숫자 s 기반 표시 (계산 정밀도와 표시 정밀도 분리, 설계서 §5.4)
    if(x===null||x===undefined||(typeof x==='number'&&!isFinite(x)))return '—';
    if(typeof x!=='number')return String(x);
    s=s||6; if(x===0)return '0';
    const a=Math.abs(x);
    if(a>=1e6||a<1e-4)return x.toExponential(Math.max(0,s-1)).replace(/e([+-])(\d)$/,'e$10$2');
    const d=Math.max(0,s-1-Math.floor(Math.log10(a)));
    return x.toFixed(Math.min(12,d)).replace(/\.?0+$/,'')||'0';
  },
  sci(x,s){if(!isFinite(x))return '—';if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x))),m=x/Math.pow(10,e);
    return m.toFixed(s||3)+'×10'+U.sup(e);},
  sup(n){const m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
    return String(n).split('').map(c=>m[c]||c).join('');},
  p(v){ // p-값 관례 표기 (APA)
    if(!isFinite(v))return '—';
    if(v<0.001)return '< .001';
    return (v<1?String(v.toFixed(3)).replace(/^0/,''):v.toFixed(3));},
  parseNums(t){return (t||'').split(/[\s,;\t\n]+/).map(s=>parseFloat(s)).filter(v=>isFinite(v));},
  esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));},
  clamp(v,a,b){return Math.max(a,Math.min(b,v));},
  sum(a){let s=0,c=0;for(const x of a){const t=s+x;c+=Math.abs(s)>=Math.abs(x)?(s-t)+x:(x-t)+s;s=t;}return s+c;}, // Neumaier 보정합
  seq(a,b,n){const o=[],h=(b-a)/(n-1);for(let i=0;i<n;i++)o.push(a+h*i);return o;},
  lerp(x,xs,ys){ // log-log 보간 (감쇠계수 등)
    if(x<=xs[0])return ys[0]; if(x>=xs[xs.length-1])return ys[ys.length-1];
    let i=0;while(xs[i+1]<x)i++;
    const t=(Math.log(x)-Math.log(xs[i]))/(Math.log(xs[i+1])-Math.log(xs[i]));
    return Math.exp(Math.log(ys[i])+t*(Math.log(ys[i+1])-Math.log(ys[i])));},
  now(){return new Date().toISOString().replace('T',' ').slice(0,19);}
};

/* ---------- 시드 PRNG (설계서 §3.5 결정론) ---------- */
function PRNG(seed){
  let h=1779033703^String(seed).length;
  for(let i=0;i<String(seed).length;i++){h=Math.imul(h^String(seed).charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  let a=h>>>0;
  const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};
  f.norm=(m,s)=>{const u=1-f(),v=f();return (m||0)+(s===undefined?1:s)*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  f.pois=l=>{if(l<30){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=f();}while(p>L);return k-1;}
    return Math.max(0,Math.round(f.norm(l,Math.sqrt(l))));};
  f.exp=l=>-Math.log(1-f())/l;
  return f;
}

/* ---------- 특수함수 ---------- */
const SF={
  lgamma(x){ // Lanczos
    const g=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,
      12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
    if(x<0.5)return Math.log(Math.PI/Math.sin(Math.PI*x))-SF.lgamma(1-x);
    x-=1;let a=0.99999999999980993,t=x+7.5;
    for(let i=0;i<8;i++)a+=g[i]/(x+i+1);
    return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);},
  gamma(x){return x<0.5?Math.PI/(Math.sin(Math.PI*x)*SF.gamma(1-x)):Math.exp(SF.lgamma(x));},
  lbeta(a,b){return SF.lgamma(a)+SF.lgamma(b)-SF.lgamma(a+b);},
  lchoose(n,k){return SF.lgamma(n+1)-SF.lgamma(k+1)-SF.lgamma(n-k+1);},
  erf(x){const s=x<0?-1:1;x=Math.abs(x);
    const t=1/(1+0.3275911*x);
    const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
    return s*y;},
  erfc(x){return x<0?2-SF.erfc(-x):(x<0.5?1-SF.erf(x):SF._erfcCF(x));},
  _erfcCF(x){ // 큰 x에서 꼬리 정확도 유지 (설계서 §4.3.2)
    let t=1/(1+0.5*x);
    const y=t*Math.exp(-x*x-1.26551223+t*(1.00002368+t*(0.37409196+t*(0.09678418+
      t*(-0.18628806+t*(0.27886807+t*(-1.13520398+t*(1.48851587+t*(-0.82215223+t*0.17087277)))))))));
    return y;},
  erfinv(y){ // Acklam 근사 + Newton 정련
    if(y<=-1)return -Infinity; if(y>=1)return Infinity;

const EX={
  consts:{pi:Math.PI,e:Math.E,PI:Math.PI,
    c:299792458,h:6.62607015e-34,hbar:1.054571817e-34,k_B:1.380649e-23,

  },
  tokenize(s){
    const t=[];let i=0;
    while(i<s.length){
      const c=s[i];
      if(/\s/.test(c)){i++;continue;}
      if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
        if(s[j]==='e'||s[j]==='E'){let k=j+1;if(s[k]==='+'||s[k]==='-')k++;
          if(/[0-9]/.test(s[k])){j=k;while(j<s.length&&/[0-9]/.test(s[j]))j++;}}
        t.push({t:'num',v:parseFloat(s.slice(i,j))});i=j;continue;}
      if(/[a-zA-Z_µΩ°]/.test(c)){let j=i;while(j<s.length&&/[a-zA-Z0-9_µΩ°]/.test(s[j]))j++;
        t.push({t:'id',v:s.slice(i,j)});i=j;continue;}
      if('+-*/^%(),<>=!&|'.includes(c)){
        const two=s.slice(i,i+2);
        if(['<=','>=','==','!=','&&','||'].includes(two)){t.push({t:'op',v:two});i+=2;continue;}
        t.push({t:'op',v:c});i++;continue;}
      throw new Error('알 수 없는 문자: '+c+' (위치 '+i+')');}
    return t;},
  parse(src){
    const t=EX.tokenize(src);let p=0;
    const eat=v=>{if(t[p]&&t[p].v===v){p++;return true;}return false;};
    // 이항 연산자 우선순위 (^ 는 powf에서 우결합 처리, 암시적 곱은 5)
    const prec={'||':1,'&&':2,'<':3,'>':3,'<=':3,'>=':3,'==':3,'!=':3,
      '+':4,'-':4,'*':5,'/':5,'%':5};
    const startsPrimary=()=>{const tk=t[p];
      return !!tk&&(tk.t==='num'||tk.t==='id'||tk.v==='(');};
    function prim(){
      const tk=t[p];
      if(!tk)throw new Error('수식이 완결되지 않았습니다');
      if(tk.t==='num'){p++;return {k:'num',v:tk.v};}
      if(tk.t==='id'){p++;
        if(eat('(')){const args=[];
          if(!eat(')')){do{args.push(expr(0));}while(eat(','));
            if(!eat(')'))throw new Error("')' 가 닫히지 않았습니다");}
          return {k:'call',n:tk.v,args};}
        return {k:'var',n:tk.v};}
      if(tk.v==='('){p++;const e=expr(0);
        if(!eat(')'))throw new Error("')' 가 닫히지 않았습니다");return e;}
      throw new Error('예상치 못한 토큰: '+tk.v);}
    function post(){ // 후위 계승 5!
      let n=prim();
      while(t[p]&&t[p].v==='!'&&(!t[p+1]||t[p+1].v!=='=')){p++;n={k:'call',n:'fact',args:[n]};}
      return n;}
    function powf(){ // ^ 는 우결합이며 단항 −보다 강하게 결합 (−2^2 = −4)
      const b=post();
      if(t[p]&&t[p].v==='^'){p++;const e=un();return {k:'bin',o:'^',a:b,b:e};}
      return b;}
    function un(){
      const tk=t[p];
      if(tk&&tk.t==='op'&&tk.v==='-'){p++;return {k:'neg',a:un()};}
      if(tk&&tk.t==='op'&&tk.v==='+'){p++;return un();}
      if(tk&&tk.t==='op'&&tk.v==='!'){p++;return {k:'not',a:un()};}
      return powf();}
    function expr(mp){
      let l=un();
      for(;;){
        // 암시적 곱: 2x, 3(4+5), 2sin(x) — 우선순위 5 (^ 보다 약함)
        if(mp<=5&&startsPrimary()){l={k:'bin',o:'*',a:l,b:un()};continue;}
        const tk=t[p];
        if(tk&&tk.t==='op'&&prec[tk.v]!==undefined&&prec[tk.v]>=mp){
          const o=tk.v;p++;const r=expr(prec[o]+1);l={k:'bin',o,a:l,b:r};continue;}
        break;}
      return l;}
    const ast=expr(0);
    if(p<t.length)throw new Error('해석되지 않은 토큰: '+t[p].v);
    return ast;},
  evalAst(n,sc){
    sc=sc||{};
    switch(n.k){
      case 'num':return n.v;
      case 'neg':return -EX.evalAst(n.a,sc);
      case 'not':return EX.evalAst(n.a,sc)?0:1;
      case 'var':
        if(n.n in sc)return sc[n.n];
        if(n.n in EX.consts)return EX.consts[n.n];
        throw new Error('정의되지 않은 변수: '+n.n);
      case 'call':{
        const f=EX.fns[n.n]||(sc.__fn&&sc.__fn[n.n]);
        if(!f)throw new Error('정의되지 않은 함수: '+n.n);
        return f(...n.args.map(a=>EX.evalAst(a,sc)));}
      case 'bin':{
        const a=EX.evalAst(n.a,sc),b=EX.evalAst(n.b,sc);
        switch(n.o){case '+':return a+b;case '-':return a-b;case '*':return a*b;
          case '/':{if(b===0)throw new Error('0으로 나눌 수 없습니다');return a/b;}
          case '%':return ((a%b)+b)%b;case '^':return Math.pow(a,b);
          case '<':return a<b?1:0;case '>':return a>b?1:0;case '<=':return a<=b?1:0;
          case '>=':return a>=b?1:0;case '==':return a===b?1:0;case '!=':return a!==b?1:0;
          case '&&':return (a&&b)?1:0;case '||':return (a||b)?1:0;}}
    }
    throw new Error('평가 실패');},
  eval(src,sc){return EX.evalAst(EX.parse(src),sc);},
  /* 자동미분(전방모드) — GUM 불확도 전파용 (§5.5) */
  deriv(ast,v,sc){
    const h=1e-6,x0=sc[v];
    const s1={...sc},s2={...sc};
    const step=Math.abs(x0)>1e-8?Math.abs(x0)*1e-6:1e-8;
    s1[v]=x0+step;s2[v]=x0-step;
    return (EX.evalAst(ast,s1)-EX.evalAst(ast,s2))/(2*step);},
  gum(src,inputs,k,corr){
    const ast=EX.parse(src);
    const sc={};inputs.forEach(i=>sc[i.name]=i.value);
    const y=EX.evalAst(ast,sc);
    const terms=inputs.map(i=>{
      const c=EX.deriv(ast,i.name,sc);
      return {name:i.name,value:i.value,u:i.u,c,contrib:c*i.u,contrib2:Math.pow(c*i.u,2),dist:i.dist||'정규',dof:i.dof||Infinity};});
    let uc2=U.sum(terms.map(t=>t.contrib2));
    if(corr)corr.forEach(([i,j,r])=>{uc2+=2*terms[i].contrib*terms[j].contrib*r;});
    const uc=Math.sqrt(uc2);
    terms.forEach(t=>t.pct=t.contrib2/uc2*100);
    // Welch–Satterthwaite 유효자유도
    const den=U.sum(terms.filter(t=>isFinite(t.dof)).map(t=>Math.pow(t.contrib,4)/t.dof));
    const veff=den>0?Math.pow(uc,4)/den:Infinity;
    const kk=k||2;
    return {y,uc,terms,U:kk*uc,k:kk,veff,rel:uc/Math.abs(y)*100};}
};

/* ============================================================================
   금융 커널 (§7.4) — 십진 반올림은 표시 단계에서 적용
   ============================================================================ */
const FIN={
  tvm(solve,a){ // pv,fv,pmt,n,rate ; type 0=기말,1=기초
    const {pv,fv,pmt,n,rate,type}=a,i=rate,t=type?1:0;
    const f=(ii)=>{
      if(Math.abs(ii)<1e-12)return pv+pmt*n+fv;
      const p=Math.pow(1+ii,n);
      return pv*p+pmt*(1+ii*t)*(p-1)/ii+fv;};
    if(solve==='fv'){const p=Math.pow(1+i,n);
      return -(pv*p+pmt*(1+i*t)*(p-1)/(i||1e-12));}
    if(solve==='pv'){const p=Math.pow(1+i,n);
      return -(fv+pmt*(1+i*t)*(p-1)/(i||1e-12))/p;}
    if(solve==='pmt'){const p=Math.pow(1+i,n);
      return -(pv*p+fv)/((1+i*t)*(p-1)/(i||1e-12));}
    if(solve==='n'){
      let lo=1e-6,hi=2000;
      const g=nn=>{const p=Math.pow(1+i,nn);return pv*p+pmt*(1+i*t)*(p-1)/(i||1e-12)+fv;};
      for(let k=0;k<200;k++){const m=(lo+hi)/2;(g(lo)*g(m)<=0?hi=m:lo=m);}
      return (lo+hi)/2;}
    if(solve==='rate'){
      let lo=-0.9999,hi=10;
      const g=ii=>{if(Math.abs(ii)<1e-12)return pv+pmt*n+fv;
        const p=Math.pow(1+ii,n);return pv*p+pmt*(1+ii*t)*(p-1)/ii+fv;};
      for(let k=0;k<300;k++){const m=(lo+hi)/2;(g(lo)*g(m)<=0?hi=m:lo=m);}
      return (lo+hi)/2;}
    return NaN;},
  npv(rate,cf){return U.sum(cf.map((c,i)=>c/Math.pow(1+rate,i)));},
  irr(cf,guess){
    let lo=-0.999,hi=10;
    const f=r=>FIN.npv(r,cf);
    if(f(lo)*f(hi)>0)return NaN;
    for(let i=0;i<300;i++){const m=(lo+hi)/2;(f(lo)*f(m)<=0?hi=m:lo=m);}
    return (lo+hi)/2;},
  mirr(cf,fr,rr){
    const n=cf.length-1;
    const neg=U.sum(cf.map((c,i)=>c<0?c/Math.pow(1+fr,i):0));
    const pos=U.sum(cf.map((c,i)=>c>0?c*Math.pow(1+rr,n-i):0));
    return Math.pow(pos/-neg,1/n)-1;},
  amort(P,rate,n,method){
    const rows=[];let bal=P,ti=0;
    const pmt=P*rate/(1-Math.pow(1+rate,-n));
    for(let k=1;k<=n;k++){
      const int=bal*rate;
      let pr;
      if(method==='equalPrincipal'){pr=P/n;}
      else{pr=pmt-int;}
      const pay=int+pr;bal-=pr;ti+=int;
      rows.push({k,pay,int,pr,bal:Math.max(0,bal)});}
    return {rows,pmt,totalInterest:ti,total:ti+P};},
  depreciation(cost,salvage,life,method,rate){
    const rows=[];let bv=cost,acc=0;
    const syd=life*(life+1)/2;
    for(let k=1;k<=life;k++){
      let d;
      if(method==='sl')d=(cost-salvage)/life;
      else if(method==='db'){d=bv*(rate||2/life);if(bv-d<salvage)d=Math.max(0,bv-salvage);}
      else if(method==='syd')d=(cost-salvage)*(life-k+1)/syd;
      else d=(cost-salvage)/life;
      acc+=d;bv-=d;rows.push({k,dep:d,acc,bv:Math.max(salvage,bv)});}
    return rows;},
  bond(face,coupon,ytm,n,freq){
    freq=freq||2;const c=face*coupon/freq,r=ytm/freq,N=n*freq;
    let price=0,dur=0;
    for(let k=1;k<=N;k++){const cf=k===N?c+face:c,pv=cf/Math.pow(1+r,k);
      price+=pv;dur+=k*pv;}
    const mac=dur/price/freq,mod=mac/(1+r);
    let conv=0;
    for(let k=1;k<=N;k++){const cf=k===N?c+face:c;conv+=k*(k+1)*cf/Math.pow(1+r,k+2);}
    return {price,current:face*coupon/price,macaulay:mac,modified:mod,convexity:conv/price/(freq*freq)};},
  ear(nom,m){return m===Infinity?Math.exp(nom)-1:Math.pow(1+nom/m,m)-1;},
  var_(returns,conf,method,value){
    const d=S.desc(returns);
    if(method==='hist'){const s=[...returns].sort((a,b)=>a-b);
      return -S.q(s,1-conf,7)*value;}
    return -(d.mean+zq(1-conf)*d.sd)*value;},
  bep(fixed,price,varCost){
    const cm=price-varCost;
    return {qty:fixed/cm,sales:fixed/cm*price,cm,cmRatio:cm/price};}
};

/* ============================================================================
   환율 (§7.1) — Frankfurter v2 어댑터 + 캐시 + 고정환율 + 오프라인
   ============================================================================ */
const FX={
  base:'https://api.frankfurter.dev/v2',
  cache:{},fixed:null,provider:'',lastErr:'',
  minor:{JPY:0,KRW:0,VND:0,CLP:0,ISK:0,BHD:3,KWD:3,OMR:3,TND:3,JOD:3,IQD:3},
  round(v,cur){const d=FX.minor[cur]===undefined?2:FX.minor[cur];
    return Math.round(v*Math.pow(10,d))/Math.pow(10,d);},
  async rates(base,date,provider){
    const key=[base,date||'latest',provider||''].join('|');
    if(FX.cache[key]&&Date.now()-FX.cache[key].at<6*3600e3)
      return {...FX.cache[key].d,stale:false,cached:true};
    let url=FX.base+'/rates?base='+encodeURIComponent(base);
    if(date)url+='&date='+date;
    if(provider)url+='&providers='+provider;
    try{
      const r=await fetch(url);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      const d={base:j.base||base,date:j.date,rates:j.rates,blended:!provider,provider:provider||'blended'};
      FX.cache[key]={d,at:Date.now()};
      FX.lastErr='';
      return {...d,stale:false,cached:false};
    }catch(e){
      FX.lastErr=e.message;
      if(FX.cache[key])return {...FX.cache[key].d,stale:true,cached:true};
      const any=Object.keys(FX.cache).find(k=>k.startsWith(base+'|'));
      if(any)return {...FX.cache[any].d,stale:true,cached:true};
      throw e;}},
  convert(amount,from,to,rates){
    if(from===to)return {value:amount,rate:1};
    let rate;
    if(rates.base===from)rate=rates.rates[to];
    else if(rates.base===to)rate=1/rates.rates[from];
    else rate=rates.rates[to]/rates.rates[from];   // 교차환율
    if(!isFinite(rate))return {error:'환율 없음: '+from+'→'+to};
    return {value:amount*rate,rate};}
};

const RAD={
  /* --- 붕괴 --- */
  decay(A0,T,t){const l=Math.LN2/T;return A0*Math.exp(-l*t);},
  decayFull(id,A0,t,unitA){
    const n=NUC.get(id),l=Math.LN2/n.T;
    const A=A0*Math.exp(-l*t);
    const N=A/l,mass=N/6.02214076e23*n.M;
    const sa=l*6.02214076e23/n.M;   // Bq/g
    return {A,l,tau:1/l,N,mass,sa,halfLives:t/n.T,T:n.T,
      steps:[
        {lb:'① 붕괴상수',fm:'λ = ln2 / T½ = 0.693147 / '+U.fmt(n.T,6)+' s',rs:'λ = '+U.sci(l,4)+' s⁻¹'},
        {lb:'② 경과 반감기 수',fm:'t / T½ = '+U.fmt(t,6)+' / '+U.fmt(n.T,6),rs:U.fmt(t/n.T,5)+' 반감기'},
        {lb:'③ 잔존 방사능',fm:'A = A₀·e^(−λt) = '+U.sci(A0,4)+' × e^(−'+U.fmt(l*t,6)+')',rs:U.sci(A,5)+' Bq'},
        {lb:'④ 원자수',fm:'N = A/λ',rs:U.sci(N,5)+' 개'},
        {lb:'⑤ 질량',fm:'m = N/N_A × M = '+U.sci(N,4)+'/6.022e23 × '+n.M,rs:U.sci(mass,5)+' g'},
        {lb:'⑥ 비방사능',fm:'a = λ·N_A/M',rs:U.sci(sa,5)+' Bq/g'}
      ]};},
  /* Bateman — 해석해 + 근접 λ 시 행렬지수 폴백 (설계서 §8.3 · T-014) */
  chain(ids,lams,N0,ts){
    const n=ids.length;
    let close=false;
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)
      if(Math.abs(lams[i]-lams[j])/Math.max(...lams)<1e-6)close=true;
    const method=close?'matrix-exponential':'analytic';
    const out=ts.map(t=>{
      if(!close){
        const N=[];
        for(let k=0;k<n;k++){
          let s=0;
          for(let i=0;i<=k;i++){
            let prod=1;
            for(let j=i;j<k;j++)prod*=lams[j];
            let den=1;
            for(let j=i;j<=k;j++)if(j!==i||true){}
            let term=0;
            for(let m=i;m<=k;m++){
              let d=1;
              for(let j=i;j<=k;j++)if(j!==m)d*=(lams[j]-lams[m]);
              term+=Math.exp(-lams[m]*t)/d;}
            s+=N0[i]*prod*term;}
          N.push(s);}
        return {t,N,A:N.map((v,i)=>v*lams[i])};}
      // 행렬지수 (scaling & squaring, 강성 회피)
      const A=[];for(let i=0;i<n;i++){A.push([]);for(let j=0;j<n;j++)
        A[i].push(i===j?-lams[i]:(i===j+1?lams[j]:0));}
      const M=RAD.expm(A.map(r=>r.map(v=>v*t)));
      const N=M.map(r=>U.sum(r.map((v,j)=>v*N0[j])));
      return {t,N,A:N.map((v,i)=>v*lams[i])};});
    return {series:out,method,warn:close?['반감기 근접 → 해석해 상쇄오차 회피를 위해 행렬지수 경로로 자동 전환됨']:[]};},
  expm(A){
    const n=A.length;let nrm=0;
    A.forEach(r=>r.forEach(v=>nrm=Math.max(nrm,Math.abs(v))));
    const s=Math.max(0,Math.ceil(Math.log2(Math.max(1,nrm))) + 4);
    const B=A.map(r=>r.map(v=>v/Math.pow(2,s)));
    let R=[],T=[];
    for(let i=0;i<n;i++){R.push([]);T.push([]);for(let j=0;j<n;j++){R[i].push(i===j?1:0);T[i].push(i===j?1:0);}}
    for(let k=1;k<=18;k++){
      const N2=[];for(let i=0;i<n;i++){N2.push([]);for(let j=0;j<n;j++){
        let s2=0;for(let m=0;m<n;m++)s2+=T[i][m]*B[m][j];N2[i].push(s2/k);}}
      T=N2;for(let i=0;i<n;i++)for(let j=0;j<n;j++)R[i][j]+=T[i][j];}
    for(let q=0;q<s;q++){
      const N2=[];for(let i=0;i<n;i++){N2.push([]);for(let j=0;j<n;j++){
        let s2=0;for(let m=0;m<n;m++)s2+=R[i][m]*R[m][j];N2[i].push(s2);}}
      R=N2;}
    return R;},
  activation(flux,sigma_b,Ntgt,T,tIrr,tCool){
    const l=Math.LN2/T,sig=sigma_b*1e-24,R=flux*sig*Ntgt;
    const Asat=R,A=R*(1-Math.exp(-l*tIrr))*Math.exp(-l*tCool);
    return {A,Asat,R,sat:1-Math.exp(-l*tIrr),l,
      steps:[
        {lb:'① 생성률',fm:'R = φ·σ·N = '+U.sci(flux,3)+' × '+U.sci(sig,3)+' × '+U.sci(Ntgt,3),rs:U.sci(R,4)+' /s'},
        {lb:'② 포화계수',fm:'1 − e^(−λ·t_irr), λ='+U.sci(l,3),rs:U.fmt((1-Math.exp(-l*tIrr))*100,4)+' %'},
        {lb:'③ 냉각 감쇠',fm:'e^(−λ·t_cool)',rs:U.fmt(Math.exp(-l*tCool),5)},
        {lb:'④ 최종 방사능',fm:'A = R·(포화)·(냉각)',rs:U.sci(A,5)+' Bq'}]};},
  effHalf(Tp,Tb){return 1/(1/Tp+1/Tb);},
  /* --- 계수통계 --- */
  counting(Ns,ts,Nb,tb){
    const rs=Ns/ts,rb=Nb/tb,rn=rs-rb;
    const urs=Math.sqrt(Ns)/ts,urb=Math.sqrt(Nb)/tb,urn=Math.sqrt(Ns/(ts*ts)+Nb/(tb*tb));
    const opt=Math.sqrt(rs/rb);
    return {rs,rb,rn,urs,urb,urn,rel:urn/rn*100,optRatio:opt,
      fom:rn*rn/rb,
      steps:[
        {lb:'① 총 계수율',fm:'r_s = N_s/t_s = '+Ns+'/'+ts,rs:U.fmt(rs,6)+' cps'},
        {lb:'② 배경 계수율',fm:'r_b = N_b/t_b = '+Nb+'/'+tb,rs:U.fmt(rb,6)+' cps'},
        {lb:'③ 순계수율',fm:'r_n = r_s − r_b',rs:U.fmt(rn,6)+' cps'},
        {lb:'④ 순계수율 불확도',fm:'u(r_n) = √(N_s/t_s² + N_b/t_b²)',rs:'± '+U.fmt(urn,4)+' cps ('+U.fmt(urn/rn*100,3)+' %)'},
        {lb:'⑤ 최적 시간분배',fm:'t_s/t_b = √(r_s/r_b)',rs:U.fmt(opt,4)+' : 1'}]};},
  deadtime(m,tau,model){
    if(model==='paralyzable'){
      // m = n·e^(−nτ) 를 n에 대해 Newton으로 역산
      let n=m;for(let i=0;i<200;i++){
        const f=n*Math.exp(-n*tau)-m,df=Math.exp(-n*tau)*(1-n*tau);
        if(Math.abs(df)<1e-15)break;const nn=n-f/df;
        if(!isFinite(nn)||nn<0)break;if(Math.abs(nn-n)<1e-12){n=nn;break;}n=nn;}
      const max=1/(Math.E*tau);
      return {n,loss:(n-m)/n*100,model:'마비형',max,
        warn:m>max*0.999?['관측 계수율이 마비형 모형의 최대치를 초과 — 해가 불안정합니다']:[]};}
    const n=m/(1-m*tau);
    return {n,loss:(n-m)/n*100,model:'비마비형',
      warn:m*tau>=0.9?['m·τ ≥ 0.9 : 보정계수가 발산 영역에 근접했습니다']:[]};},
  /* --- 검출한계: Currie & ISO 11929 병렬 (§8.4.2) --- */
  detectionLimits(Nb,tb,ts,eff,br,mass,alpha,beta,decayCorr){
    const ka=zq(1-(alpha||0.05)),kb=zq(1-(beta||0.05));
    const rb=Nb/tb;
    // Currie (계수 영역, 동일시간 근사)
    const B=rb*ts;
    const Lc=ka*Math.sqrt(2*B),Ld=ka*ka+2*Lc;   // 잘 알려진 배경 가정
    const LcC=2.33*Math.sqrt(B),LdC=2.71+4.65*Math.sqrt(B); // 관용식 (α=β=0.05)
    // ISO 11929 (계수율 영역, 반복 해)
    const u0=Math.sqrt(rb/ts+rb/tb);
    const yStar=ka*u0;
    let yHash=2*yStar;
    for(let i=0;i<100;i++){
      const uy=Math.sqrt((yHash+rb)/ts+rb/tb);
      const nv=yStar+kb*uy;
      if(Math.abs(nv-yHash)<1e-12){yHash=nv;break;}yHash=nv;}
    const den=(eff)*(br)*(mass||1)*(decayCorr||1);
    return {
      currie:{Lc:LcC,Ld:LdC,B,mdaRate:LdC/ts,mda:LdC/ts/den},
      currieGen:{Lc,Ld,mda:Ld/ts/den},
      iso:{yStar,yHash,u0,dtRate:yStar,dlRate:yHash,dt:yStar/den,dl:yHash/den},
      rb,ka,kb,den,
      steps:[
        {lb:'① 배경 계수율',fm:'r_b = '+Nb+'/'+tb,rs:U.fmt(rb,6)+' cps'},
        {lb:'② [Currie] 시료시간 환산 배경',fm:'B = r_b·t_s = '+U.fmt(rb,5)+'×'+ts,rs:U.fmt(B,5)+' counts'},
        {lb:'③ [Currie] 결정한계 L_C',fm:'L_C ≈ 2.33√B',rs:U.fmt(LcC,5)+' counts'},
        {lb:'④ [Currie] 검출한계 L_D',fm:'L_D ≈ 2.71 + 4.65√B',rs:U.fmt(LdC,5)+' counts'},
        {lb:'⑤ [ISO 11929] u(0)',fm:'u(0) = √(r_b/t_s + r_b/t_b)',rs:U.fmt(u0,6)+' cps'},
        {lb:'⑥ [ISO] 결정임계값 y*',fm:'y* = k_{1−α}·u(0) = '+U.fmt(ka,4)+'×'+U.fmt(u0,5),rs:U.fmt(yStar,6)+' cps'},
        {lb:'⑦ [ISO] 검출한계 y#',fm:'y# = y* + k_{1−β}·u(y#)  (반복 해)',rs:U.fmt(yHash,6)+' cps'},
        {lb:'⑧ MDA 환산',fm:'MDA = 한계 / (ε·p_γ·m·f_decay)',rs:U.sci(LdC/ts/den,4)+' Bq/단위'}]};},
  activity(rn,eff,br,mass,fdec,fself,fcoin){
    const den=eff*br*(mass||1)*(fdec||1)*(fself||1)*(fcoin||1);
    return {A:rn/den,den};},
  effCurve(E,eff,order){ // ln ε = Σ a_i (ln E)^i
    const n=E.length,p=(order||3)+1;
    const X=E.map(e=>{const r=[],le=Math.log(e);for(let i=0;i<p;i++)r.push(Math.pow(le,i));return r;});
    const y=eff.map(Math.log);
    const f=S.ols(X,y,[]);
    f.predict=e=>{const le=Math.log(e);let s=0;for(let i=0;i<p;i++)s+=f.beta[i]*Math.pow(le,i);return Math.exp(s);};
    return f;},
  decayDuringCount(l,tc){return (1-Math.exp(-l*tc))/(l*tc);},
  /* --- 외부선량 --- */
  pointDose(A_MBq,gamma,d){return gamma*A_MBq/(d*d);},   // µSv/h
  shield(rate0,mat,EMeV,thick_cm,useBU){

      if(has('V')&&has('I')){o.R=o.V/o.I;o.P=o.V*o.I;}
      else if(has('V')&&has('R')){o.I=o.V/o.R;o.P=o.V*o.V/o.R;}
      else if(has('V')&&has('P')){o.I=o.P/o.V;o.R=o.V*o.V/o.P;}
      else if(has('I')&&has('R')){o.V=o.I*o.R;o.P=o.I*o.I*o.R;}

        coll:Math.pow(collFWHM_keV||0,2)/(tot*tot)*100}};},
  chargeSignal(E_keV,eps_eV,Cf){
    const n=E_keV*1000/eps_eV;
    const Q=n*1.602176634e-19;
    return {n,Q,V:Q/Cf};},
  pileup(rate,tau){return {prob:1-Math.exp(-rate*tau),throughput:rate*Math.exp(-rate*tau)};},
  friis(nfs,gains){ // dB 입력
    let F=Math.pow(10,nfs[0]/10),G=1;
    for(let i=1;i<nfs.length;i++){G*=Math.pow(10,gains[i-1]/10);
      F+=(Math.pow(10,nfs[i]/10)-1)/G;}
    return {nf:10*Math.log10(F),F,Te:290*(F-1)};},
  cableAtten(len,alpha_dB_per_100m){return len/100*alpha_dB_per_100m;}
};

/* ============================================================================
   Layer 5 : 시각화 엔진 (Canvas + SVG, 외부 의존 없음)
   ============================================================================ */
const V={
  css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();},
  colors(){return [V.css('--acc'),V.css('--rad'),V.css('--elec'),V.css('--unit'),
    V.css('--fin'),V.css('--warn'),V.css('--ok'),V.css('--bad')];},
  /* 범용 2D 플롯 */
  plot(el,cfg){
    if(typeof el==='string')el=document.getElementById(el);
    if(!el)return;
    el.innerHTML='';el.className='chart';
    const cv=document.createElement('canvas');
    const hov=document.createElement('div');hov.className='hov';
    el.appendChild(cv);el.appendChild(hov);
    const W=el.clientWidth||600,H=cfg.h||280,dpr=window.devicePixelRatio||1;
    cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
    const g=cv.getContext('2d');g.scale(dpr,dpr);
    const P={l:cfg.padL||58,r:16,t:cfg.padT||14,b:cfg.padB||36};
    const pw=W-P.l-P.r,ph=H-P.t-P.b;
    const S1=cfg.series.filter(s=>s.data&&s.data.length);
    if(!S1.length){g.fillStyle=V.css('--fg3');g.font='12px sans-serif';
      g.fillText('데이터 없음',P.l,H/2);return;}
    let x0=cfg.xmin,x1=cfg.xmax,y0=cfg.ymin,y1=cfg.ymax;
    if(x0===undefined)x0=Math.min(...S1.flatMap(s=>s.data.map(p=>p[0])));
    if(x1===undefined)x1=Math.max(...S1.flatMap(s=>s.data.map(p=>p[0])));
    if(y0===undefined)y0=Math.min(...S1.flatMap(s=>s.data.map(p=>p[1])));
    if(y1===undefined)y1=Math.max(...S1.flatMap(s=>s.data.map(p=>p[1])));
    if(cfg.ylog){y0=Math.max(y0,Math.min(...S1.flatMap(s=>s.data.filter(p=>p[1]>0).map(p=>p[1])))||1e-9);}
    if(y1===y0){y1=y0+1;y0-=1;}
    if(x1===x0){x1=x0+1;}
    if(!cfg.ylog&&!cfg.tight){const pad=(y1-y0)*0.06;y0-=pad;y1+=pad;}
    const X=v=>cfg.xlog?P.l+(Math.log10(Math.max(v,1e-12))-Math.log10(Math.max(x0,1e-12)))/(Math.log10(x1)-Math.log10(Math.max(x0,1e-12)))*pw
      :P.l+(v-x0)/(x1-x0)*pw;
    const Y=v=>cfg.ylog?P.t+ph-(Math.log10(Math.max(v,1e-300))-Math.log10(y0))/(Math.log10(y1)-Math.log10(y0))*ph
      :P.t+ph-(v-y0)/(y1-y0)*ph;
    // 그리드
    g.strokeStyle=V.css('--line');g.lineWidth=1;g.font='10.5px sans-serif';
    g.fillStyle=V.css('--fg3');
    const nyt=5;
    for(let i=0;i<=nyt;i++){
      const v=cfg.ylog?Math.pow(10,Math.log10(y0)+(Math.log10(y1)-Math.log10(y0))*i/nyt):y0+(y1-y0)*i/nyt;
      const yy=Y(v);g.beginPath();g.moveTo(P.l,yy);g.lineTo(P.l+pw,yy);g.stroke();
      g.textAlign='right';g.fillText(cfg.yfmt?cfg.yfmt(v):U.fmt(v,3),P.l-6,yy+3.5);}
    const nxt=cfg.nxt||6;
    for(let i=0;i<=nxt;i++){
      const v=cfg.xlog?Math.pow(10,Math.log10(Math.max(x0,1e-12))+(Math.log10(x1)-Math.log10(Math.max(x0,1e-12)))*i/nxt):x0+(x1-x0)*i/nxt;
      const xx=X(v);g.beginPath();g.moveTo(xx,P.t);g.lineTo(xx,P.t+ph);g.stroke();
      g.textAlign='center';g.fillText(cfg.xfmt?cfg.xfmt(v):U.fmt(v,3),xx,P.t+ph+15);}
    // 축 라벨
    g.fillStyle=V.css('--fg2');g.font='11px sans-serif';
    if(cfg.xlabel){g.textAlign='center';g.fillText(cfg.xlabel,P.l+pw/2,H-4);}
    if(cfg.ylabel){g.save();g.translate(11,P.t+ph/2);g.rotate(-Math.PI/2);
      g.textAlign='center';g.fillText(cfg.ylabel,0,0);g.restore();}
    // 참조선
    (cfg.vlines||[]).forEach(l=>{g.strokeStyle=l.c||V.css('--warn');g.setLineDash([4,3]);
      g.beginPath();g.moveTo(X(l.x),P.t);g.lineTo(X(l.x),P.t+ph);g.stroke();g.setLineDash([]);
      if(l.label){g.fillStyle=l.c||V.css('--warn');g.font='10px sans-serif';g.textAlign='left';
        g.fillText(l.label,X(l.x)+3,P.t+11);}});
    (cfg.hlines||[]).forEach(l=>{g.strokeStyle=l.c||V.css('--warn');g.setLineDash([4,3]);
      g.beginPath();g.moveTo(P.l,Y(l.y));g.lineTo(P.l+pw,Y(l.y));g.stroke();g.setLineDash([]);
      if(l.label){g.fillStyle=l.c||V.css('--warn');g.font='10px sans-serif';g.textAlign='left';
        g.fillText(l.label,P.l+3,Y(l.y)-3);}});
    // 시리즈
    const cols=V.colors();
    S1.forEach((s,si)=>{
      const c=s.color||cols[si%cols.length];
      if(s.type==='area'){
        g.fillStyle=c+'33';g.beginPath();
        s.data.forEach((p,i)=>i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));
        for(let i=s.data.length-1;i>=0;i--)g.lineTo(X(s.data[i][0]),Y(s.band?s.band[i]:y0));
        g.closePath();g.fill();}
      if(s.type==='bar'){
        const bw=Math.max(1,pw/s.data.length*0.8);
        g.fillStyle=c+'cc';
        s.data.forEach(p=>{const h2=Y(y0<0?0:y0)-Y(p[1]);
          g.fillRect(X(p[0])-bw/2,Y(p[1]),bw,Math.max(1,h2));});}
      else if(s.type==='scatter'){
        g.fillStyle=c;
        s.data.forEach(p=>{g.beginPath();g.arc(X(p[0]),Y(p[1]),s.r||2.6,0,7);g.fill();});}
      else if(s.type==='step'){
        g.strokeStyle=c;g.lineWidth=s.w||2;g.beginPath();
        s.data.forEach((p,i)=>{if(!i)g.moveTo(X(p[0]),Y(p[1]));
          else{g.lineTo(X(p[0]),Y(s.data[i-1][1]));g.lineTo(X(p[0]),Y(p[1]));}});g.stroke();}
      else if(s.type!=='bar'){
        g.strokeStyle=c;g.lineWidth=s.w||2;
        if(s.dash)g.setLineDash(s.dash);
        g.beginPath();
        s.data.forEach((p,i)=>{const xx=X(p[0]),yy=Y(p[1]);
          if(!isFinite(yy)||!isFinite(xx))return;i?g.lineTo(xx,yy):g.moveTo(xx,yy);});
        g.stroke();g.setLineDash([]);}
    });
    // 테두리
    g.strokeStyle=V.css('--line2');g.strokeRect(P.l,P.t,pw,ph);
    // 범례
    if(cfg.legend!==false&&S1.length>1||cfg.forceLegend){
      const lg=document.createElement('div');lg.className='legend';
      lg.innerHTML=S1.map((s,i)=>`<span><i style="background:${s.color||cols[i%cols.length]}"></i>${U.esc(s.name||'S'+i)}</span>`).join('');
      el.appendChild(lg);}
    // 호버
    cv.onmousemove=e=>{
      const r=cv.getBoundingClientRect(),mx=e.clientX-r.left;
      if(mx<P.l||mx>P.l+pw){hov.style.display='none';return;}
      const vx=cfg.xlog?Math.pow(10,Math.log10(Math.max(x0,1e-12))+(mx-P.l)/pw*(Math.log10(x1)-Math.log10(Math.max(x0,1e-12)))):x0+(mx-P.l)/pw*(x1-x0);
      let txt=(cfg.xlabel||'x')+' = '+U.fmt(vx,5);
      S1.forEach(s=>{let best=null,bd=1e300;
        s.data.forEach(p=>{const d=Math.abs(p[0]-vx);if(d<bd){bd=d;best=p;}});
        if(best)txt+='\n'+(s.name||'')+' : '+U.fmt(best[1],5);});
      hov.textContent=txt;hov.style.display='block';
      hov.style.left=Math.min(mx+12,el.clientWidth-160)+'px';hov.style.top='8px';};
    cv.onmouseleave=()=>hov.style.display='none';
    el._cfg=cfg;
  },
  hist(el,data,bins,cfg){
    cfg=cfg||{};
    const d=S.desc(data);
    let k=bins;
    if(!k||k==='auto'){
      const fd=2*d.iqr/Math.cbrt(d.n);
      k=fd>0?Math.ceil((d.max-d.min)/fd):Math.ceil(Math.log2(d.n)+1);
      k=U.clamp(k,3,60);}
    const w=(d.max-d.min)/k||1,cnt=new Array(k).fill(0);
    data.forEach(v=>{let i=Math.floor((v-d.min)/w);if(i>=k)i=k-1;if(i<0)i=0;cnt[i]++;});
    const pts=cnt.map((c,i)=>[d.min+w*(i+0.5),cfg.density?c/(d.n*w):c]);
    const ser=[{name:'빈도',type:'bar',data:pts,color:cfg.color}];
    if(cfg.normal){
      const xs=U.seq(d.min-w,d.max+w,160);
      ser.push({name:'정규분포 적합',data:xs.map(x=>[x,D.norm.pdf(x,d.mean,d.sd)*(cfg.density?1:d.n*w)]),
        color:V.css('--bad'),w:2});}
    if(cfg.kde){
      const h=1.06*d.sd*Math.pow(d.n,-0.2);
      const xs=U.seq(d.min-2*h,d.max+2*h,160);
      ser.push({name:'KDE',data:xs.map(x=>[x,U.sum(data.map(v=>D.norm.pdf(x,v,h)))/d.n*(cfg.density?1:d.n*w)]),
        color:V.css('--ok'),w:2,dash:[5,3]});}
    V.plot(el,{series:ser,h:cfg.h||250,ymin:0,tight:true,
      xlabel:cfg.xlabel||'값',ylabel:cfg.density?'밀도':'빈도',
      vlines:cfg.vlines||[{x:d.mean,c:V.css('--acc'),label:'평균'}],forceLegend:ser.length>1});
    return {bins:k,width:w,counts:cnt};},
  box(el,groups,names,cfg){
    if(typeof el==='string')el=document.getElementById(el);
    el.innerHTML='';el.className='chart';
    const W=el.clientWidth||600,H=(cfg&&cfg.h)||240,dpr=window.devicePixelRatio||1;
    const cv=document.createElement('canvas');el.appendChild(cv);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
    const g=cv.getContext('2d');g.scale(dpr,dpr);
    const P={l:56,r:16,t:14,b:30},pw=W-P.l-P.r,ph=H-P.t-P.b;
    const all=[].concat(...groups);
    let y0=Math.min(...all),y1=Math.max(...all);const pad=(y1-y0)*0.1||1;y0-=pad;y1+=pad;
    const Y=v=>P.t+ph-(v-y0)/(y1-y0)*ph;
    g.strokeStyle=V.css('--line');g.fillStyle=V.css('--fg3');g.font='10.5px sans-serif';
    for(let i=0;i<=5;i++){const v=y0+(y1-y0)*i/5,yy=Y(v);
      g.beginPath();g.moveTo(P.l,yy);g.lineTo(P.l+pw,yy);g.stroke();
      g.textAlign='right';g.fillText(U.fmt(v,3),P.l-6,yy+3.5);}
    const cols=V.colors(),bw=Math.min(60,pw/groups.length*0.5);
    groups.forEach((gr,i)=>{
      const s=[...gr].sort((a,b)=>a-b),d=S.desc(gr);
      const cx=P.l+pw*(i+0.5)/groups.length,c=cols[i%cols.length];
      const lo=d.q1-1.5*d.iqr,hi=d.q3+1.5*d.iqr;
      const wl=Math.min(...s.filter(v=>v>=lo)),wh=Math.max(...s.filter(v=>v<=hi));
      g.strokeStyle=c;g.lineWidth=1.5;
      g.beginPath();g.moveTo(cx,Y(wl));g.lineTo(cx,Y(wh));g.stroke();
      g.beginPath();g.moveTo(cx-bw/4,Y(wl));g.lineTo(cx+bw/4,Y(wl));
      g.moveTo(cx-bw/4,Y(wh));g.lineTo(cx+bw/4,Y(wh));g.stroke();
      g.fillStyle=c+'44';g.fillRect(cx-bw/2,Y(d.q3),bw,Y(d.q1)-Y(d.q3));
      g.strokeRect(cx-bw/2,Y(d.q3),bw,Y(d.q1)-Y(d.q3));
      g.lineWidth=2.5;g.beginPath();g.moveTo(cx-bw/2,Y(d.median));g.lineTo(cx+bw/2,Y(d.median));g.stroke();
      g.fillStyle=V.css('--bad');
      s.filter(v=>v<lo||v>hi).forEach(v=>{g.beginPath();g.arc(cx,Y(v),2.5,0,7);g.fill();});
      g.fillStyle=V.css('--acc');g.beginPath();g.arc(cx,Y(d.mean),3,0,7);g.fill();
      g.fillStyle=V.css('--fg2');g.font='11px sans-serif';g.textAlign='center';
      g.fillText(names[i]||('G'+(i+1)),cx,H-8);});
    g.strokeStyle=V.css('--line2');g.strokeRect(P.l,P.t,pw,ph);},
  heat(el,grid,cfg){
    if(typeof el==='string')el=document.getElementById(el);
    el.innerHTML='';el.className='chart';
    const W=el.clientWidth||600,H=(cfg&&cfg.h)||300,dpr=window.devicePixelRatio||1;
    const cv=document.createElement('canvas');el.appendChild(cv);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
    const g=cv.getContext('2d');g.scale(dpr,dpr);
    const P={l:56,r:60,t:12,b:34},pw=W-P.l-P.r,ph=H-P.t-P.b;
    const R=grid.length,Cc=grid[0].length;
    const vals=grid.flat().filter(v=>isFinite(v)&&v>0);
    const lg=cfg.log!==false;
    let mn=Math.min(...vals),mx=Math.max(...vals);
    if(mn===mx)mx=mn*10+1e-12;
    const norm=v=>{if(!isFinite(v)||v<=0)return 0;
      return lg?(Math.log10(v)-Math.log10(mn))/(Math.log10(mx)-Math.log10(mn)):(v-mn)/(mx-mn);};
    const col=t=>{t=U.clamp(t,0,1);
      const st=[[8,12,30],[30,60,140],[20,140,160],[240,200,60],[250,90,40]];
      const i=U.clamp(Math.floor(t*4),0,3),f=t*4-i;
      const a=st[i],b=st[i+1];
      return `rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`;};
    const cw=pw/Cc,chh=ph/R;
    for(let i=0;i<R;i++)for(let j=0;j<Cc;j++){
      g.fillStyle=col(norm(grid[i][j]));
      g.fillRect(P.l+j*cw,P.t+i*chh,Math.ceil(cw)+0.5,Math.ceil(chh)+0.5);}
    // 컬러바
    for(let i=0;i<100;i++){g.fillStyle=col(1-i/100);
      g.fillRect(W-P.r+14,P.t+ph*i/100,16,ph/100+1);}
    g.fillStyle=V.css('--fg3');g.font='10px sans-serif';g.textAlign='left';
    g.fillText(U.sci(mx,2),W-P.r+8,P.t-2);g.fillText(U.sci(mn,2),W-P.r+8,P.t+ph+11);
    g.fillStyle=V.css('--fg2');g.font='11px sans-serif';g.textAlign='center';
    if(cfg.xlabel)g.fillText(cfg.xlabel,P.l+pw/2,H-4);
    if(cfg.xticks)cfg.xticks.forEach(t=>{g.fillStyle=V.css('--fg3');g.font='10px sans-serif';
      g.fillText(t.l,P.l+t.p*pw,P.t+ph+14);});
    if(cfg.yticks)cfg.yticks.forEach(t=>{g.fillStyle=V.css('--fg3');g.textAlign='right';g.font='10px sans-serif';
      g.fillText(t.l,P.l-5,P.t+t.p*ph+3);});
    g.strokeStyle=V.css('--line2');g.strokeRect(P.l,P.t,pw,ph);},
  phasor(el,vecs,cfg){
    if(typeof el==='string')el=document.getElementById(el);
    el.innerHTML='';el.className='chart';
    const W=el.clientWidth||400,H=(cfg&&cfg.h)||280,dpr=window.devicePixelRatio||1;
    const cv=document.createElement('canvas');el.appendChild(cv);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
    const g=cv.getContext('2d');g.scale(dpr,dpr);
    const cx=W/2,cy=H/2,R=Math.min(W,H)/2-24;
    const mx=Math.max(...vecs.map(v=>Math.hypot(v.re,v.im)))||1;
    g.strokeStyle=V.css('--line');
    [0.25,0.5,0.75,1].forEach(f=>{g.beginPath();g.arc(cx,cy,R*f,0,7);g.stroke();});
    g.beginPath();g.moveTo(cx-R,cy);g.lineTo(cx+R,cy);g.moveTo(cx,cy-R);g.lineTo(cx,cy+R);g.stroke();
    const cols=V.colors();
    vecs.forEach((v,i)=>{
      const c=v.color||cols[i%cols.length];
      const x=cx+v.re/mx*R,y=cy-v.im/mx*R;
      g.strokeStyle=c;g.lineWidth=2.2;g.beginPath();g.moveTo(cx,cy);g.lineTo(x,y);g.stroke();
      const a=Math.atan2(-(y-cy),x-cx);
      g.fillStyle=c;g.beginPath();
      g.moveTo(x,y);g.lineTo(x-9*Math.cos(a-0.35),y+9*Math.sin(a-0.35));
      g.lineTo(x-9*Math.cos(a+0.35),y+9*Math.sin(a+0.35));g.closePath();g.fill();
      g.font='11px sans-serif';g.textAlign='center';
      g.fillText(v.name,x+(x>cx?16:-16),y+(y>cy?12:-6));});
    g.fillStyle=V.css('--fg3');g.font='10px sans-serif';g.textAlign='left';
    g.fillText('Re →',cx+R-24,cy-5);g.fillText('Im ↑',cx+4,cy-R+10);},
  svg(el,content,vb){
    if(typeof el==='string')el=document.getElementById(el);
    el.innerHTML=`<svg class="dia" viewBox="${vb||'0 0 600 220'}" preserveAspectRatio="xMidYMid meet">${content}</svg>`;}
};
/* ============================================================================
   Layer 5 : UI 프레임워크 · 말풍선(3단계 설명) · 커맨드 팔레트 · 세션
   ============================================================================ */

const UI={
  lv:2,fsz:14,cur:null,
  add(m){MODS.push(m);},

      d.innerHTML=`<div class="split ${m.wide?'wide':''}">

          <div class="subtabs">${m.subs.map((s,j)=>
            `<button id="stb-${m.id}-${s.id}" onclick="UI.sub('${m.id}','${s.id}')">${s.name}</button>`).join('')}</div>
          ${m.subs.map(s=>`<div class="sub" id="sbl-${m.id}-${s.id}">${s.left||''}</div>`).join('')}

  },
  go(id){
    MODS.forEach(m=>{
      document.getElementById('md-'+m.id).classList.toggle('on',m.id===id);
      document.getElementById('tb-'+m.id).classList.toggle('on',m.id===id);});
    UI.cur=id;
    const m=MODS.find(x=>x.id===id);
    if(!m._init){m._init=1;UI.sub(id,m.subs[0].id);}
    else UI.sub(id,m._sub||m.subs[0].id);},
  sub(mid,sid){
    const m=MODS.find(x=>x.id===mid);m._sub=sid;
    m.subs.forEach(s=>{
      const on=s.id===sid;
      document.getElementById('stb-'+mid+'-'+s.id).classList.toggle('on',on);
      document.getElementById('sbl-'+mid+'-'+s.id).classList.toggle('on',on);
      document.getElementById('sbr-'+mid+'-'+s.id).classList.toggle('on',on);
      if(on&&s.init&&!s._done){s._done=1;try{s.init();}catch(e){console.error(e);}}
      if(on&&s.redraw)setTimeout(()=>{try{s.redraw();}catch(e){}},30);});

const F={
  num(id,lb,v,tip,unit,step,w){
    return `<div class="row"><label class="${w?'w':''}" for="${id}">${lb}${tip?` <span class="tip" data-k="${tip}">?</span>`:''}</label>
      <input type="number" id="${id}" value="${v}" step="${step||'any'}" oninput="UI.live&&UI.live()">${unit?`<span style="color:var(--fg3);font-size:11.5px;min-width:42px">${unit}</span>`:''}</div>`;},
  txt(id,lb,v,tip,ph){
    return `<div class="row"><label for="${id}">${lb}${tip?` <span class="tip" data-k="${tip}">?</span>`:''}</label>
      <input type="text" id="${id}" value="${v||''}" placeholder="${ph||''}"></div>`;},
  sel(id,lb,opts,tip,onch){
    return `<div class="row"><label for="${id}">${lb}${tip?` <span class="tip" data-k="${tip}">?</span>`:''}</label>
      <select id="${id}" ${onch?`onchange="${onch}"`:''}>${opts.map(o=>
        typeof o==='string'?`<option value="${o}">${o}</option>`:`<option value="${o[0]}"${o[2]?' selected':''}>${o[1]}</option>`).join('')}</select></div>`;},
  ta(id,lb,v,rows,tip){
    return `<div style="margin-bottom:8px"><label style="display:block;color:var(--fg2);font-size:12.5px;margin-bottom:3px">${lb}${tip?` <span class="tip" data-k="${tip}">?</span>`:''}</label>
      <textarea id="${id}" rows="${rows||4}" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px">${v||''}</textarea></div>`;},
  rng(id,lb,v,mn,mx,st,tip){
    return `<div class="row"><label>${lb}${tip?` <span class="tip" data-k="${tip}">?</span>`:''}</label>
      <input type="range" id="${id}" value="${v}" min="${mn}" max="${mx}" step="${st}" oninput="document.getElementById('${id}_v').textContent=this.value;UI.live&&UI.live()">
      <span id="${id}_v" class="mono" style="min-width:52px;text-align:right;font-size:12px">${v}</span></div>`;},
  chk(id,lb,on,tip){
    return `<div class="row"><label>${lb}${tip?` <span class="tip" data-k="${tip}">?</span>`:''}</label>
      <input type="checkbox" id="${id}" ${on?'checked':''} style="flex:0 0 18px;height:18px" onchange="UI.live&&UI.live()"></div>`;},
  btn(lb,fn,cls){return `<button class="btn ${cls||''}" onclick="${fn}">${lb}</button>`;},
  card(title,body,id,zoom){
    return `<div class="card" ${id?`id="${id}"`:''}><h3>${title}<div class="sp"></div>
      ${zoom?`<button class="zbtn" onclick="UI.zoom('${id}','${title.replace(/'/g,'')}')">⛶ 확대</button>`:''}</h3>
      <div class="bd">${body}</div></div>`;},
  steps(arr,title){
    if(!arr||!arr.length)return '';
    return `<details class="steps"><summary>${title||'계산 과정 단계별 보기'} (${arr.length}단계)</summary><div class="in">`+
      arr.map(s=>`<div class="step"><div class="lb">${s.lb}</div><div class="fm">${s.fm}</div><div class="rs">= ${s.rs}</div></div>`).join('')+
      `</div></details>`;},
  kv(o){return '<div class="kv">'+Object.entries(o).map(([k,v])=>`<b>${k}</b><span>${v}</span>`).join('')+'</div>';},
  tbl(head,rows,cls){
    return `<div class="sc"><table class="t ${cls||''}"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'num':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;},
  badge(txt,type){return `<span class="badge ${type}">${txt}</span>`;},
  warn(t){return `<div class="warnbox">⚠ ${t}</div>`;},
  err(t){return `<div class="errbox">✕ ${t}</div>`;},
  concl(t){return `<div class="concl">${t}</div>`;},
  prov(t){return `<div class="prov">${t}</div>`;}
};

const Pal={
  items:[],sel:0,
  build(){
    Pal.items=[];
    MODS.forEach(m=>m.subs.forEach(s=>
      Pal.items.push({t:m.name+' › '+s.name,tag:'기능',d:s.desc||'',
        go:()=>{UI.go(m.id);UI.sub(m.id,s.id);}})));
    NUC.list().forEach(id=>{const n=NUC.get(id);
      Pal.items.push({t:id,tag:'핵종',d:'T½ '+Fmt.time(n.T)+' · '+(n.use||''),
        go:()=>{UI.go('rad');UI.sub('rad','nuc');
          const e=g('nucSearch');if(e){e.value=id;RadUI.nucSearch();}}});});
    Object.keys(UN.db).forEach(s=>{const u=UN.db[s];
      if(u.sym!==s)return;
      Pal.items.push({t:s,tag:'단위',d:u.name+' · '+u.cat,
        go:()=>{UI.go('unit');UI.sub('unit','gen');
          const e=g('uFrom');if(e){e.value=s;UnitUI.calc();}}});});
    Object.keys(EX.fns).forEach(f=>Pal.items.push({t:f+'()',tag:'함수',d:'공학 계산기 함수',
      go:()=>{UI.go('calc');UI.sub('calc','expr');
        const e=g('exprIn');if(e){e.value+=f+'(';e.focus();}}}));
    Object.keys(EX.consts).forEach(c=>Pal.items.push({t:c,tag:'상수',d:String(EX.consts[c]),
      go:()=>{UI.go('calc');UI.sub('calc','const');}}));
  },
  open(){
    if(!Pal.items.length)Pal.build();
    g('pal').style.display='block';g('palq').value='';g('palq').focus();Pal.render('');},
  close(){g('pal').style.display='none';},
  render(q){
    q=(q||'').toLowerCase();
    let list=Pal.items;
    if(q){
      // "=수식" 즉시 계산
      if(q.startsWith('=')){
        let r;try{r='= '+U.fmt(EX.eval(q.slice(1)),10);}catch(e){r='오류: '+e.message;}
        g('pall').innerHTML=`<div class="it"><span class="tag">즉시계산</span><b class="mono">${U.esc(r)}</b></div>`;
        return;}
      list=Pal.items.filter(i=>(i.t+' '+i.d+' '+i.tag).toLowerCase().includes(q));}
    Pal.sel=0;
    g('pall').innerHTML=list.slice(0,60).map((i,k)=>
      `<div class="it ${k===0?'sel':''}" onclick="Pal.run(${Pal.items.indexOf(i)})">
        <span class="tag">${i.tag}</span><b>${U.esc(i.t)}</b><span class="d">${U.esc(i.d).slice(0,60)}</span></div>`).join('')
      ||'<div class="it">결과 없음</div>';
    Pal._list=list;},
  run(i){Pal.close();const it=Pal.items[i];if(it&&it.go)it.go();}
};
const Fmt={
  time(s){
    if(!isFinite(s))return '—';
    const u=[[3.156e7*1e9,'십억년',3.156e7*1e9],[3.156e7,'년',3.156e7],[86400,'일',86400],
      [3600,'시간',3600],[60,'분',60],[1,'초',1],[1e-3,'ms',1e-3]];
    for(const [th,n,d] of u)if(s>=th)return U.fmt(s/d,4)+' '+n;
    return U.sci(s,3)+' s';},
  bq(v){
    if(v>=1e12)return U.fmt(v/1e12,4)+' TBq';
    if(v>=1e9)return U.fmt(v/1e9,4)+' GBq';
    if(v>=1e6)return U.fmt(v/1e6,4)+' MBq';
    if(v>=1e3)return U.fmt(v/1e3,4)+' kBq';
    return U.fmt(v,4)+' Bq';},
  sv(v){ // v in Sv
    if(v>=1)return U.fmt(v,4)+' Sv';
    if(v>=1e-3)return U.fmt(v*1e3,4)+' mSv';
    if(v>=1e-6)return U.fmt(v*1e6,4)+' µSv';
    return U.sci(v*1e9,3)+' nSv';}
};

const Session={
  log:[],
  rec(proc,inp,out){Session.log.push({t:U.now(),proc,inp,out});
    if(Session.log.length>500)Session.log.shift();},
  exportAll(){
    const man={app:'K-STATBENCH',version:K.ver,generated:U.now(),
      standard:K.std,nuclideData:NUC.ver,attenuationData:'NIST XCOM 계열 근사(EDU)',
      note:'설계서 §11.4 재현 매니페스트. 본 산출물은 공학적 추정이며 규제 제출 단독 근거로 사용 불가.',
      commands:Session.log};
    const b=new Blob([JSON.stringify(man,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='KSB_session_'+Date.now()+'.json';a.click();
    UI.msg('세션 매니페스트를 내보냈습니다 ('+Session.log.length+'건)');},
  csv(head,rows,name){
    const c=[head.join(',')].concat(rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n');
    const b=new Blob(['\ufeff'+c],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=(name||'ksb_export')+'.csv';a.click();UI.msg('CSV 내보내기 완료');},
  copy(id){
    const e=g(id);if(!e)return;
    navigator.clipboard.writeText(e.innerText).then(()=>UI.msg('클립보드에 복사되었습니다'));},
  png(id){
    const el=g(id);const cv=el&&el.querySelector('canvas');
    if(!cv){UI.msg('그래프를 찾을 수 없습니다');return;}
    const a=document.createElement('a');a.href=cv.toDataURL('image/png');
    a.download='ksb_chart.png';a.click();UI.msg('그래프 PNG 저장 완료');}
};

const HomeUI={
  quick(){
    const q=gv('qIn').trim();if(!q){set('qOut','');return;}
    let h='';
    // 1) 수식
    try{const v=EX.eval(q);h+=F.card('🧮 수식 계산',`<div class="big">${U.fmt(v,12)}</div>
      <div class="note">과학표기 ${U.sci(v,6)} · 공학표기 ${Fmt.eng(v)}</div>`);}catch(e){}
    // 2) 단위 변환 "12 ft to cm"
    const m=q.match(/^([\d.eE+-]+)\s*([^\s]+)\s*(?:to|→|in|>)\s*([^\s]+)$/i);
    if(m){const r=UN.convert(parseFloat(m[1]),m[2],m[3]);
      h+=F.card('📏 단위 변환',r.error?F.err(r.msg):
        `<div class="big">${U.fmt(r.value,10)}<span class="unit">${m[3]}</span></div>
        <div class="note">차원 [${r.dim}]</div>`+F.steps(r.steps));}
    // 3) 핵종
    if(NUC.get(q)){const n=NUC.get(q);
      h+=F.card('☢️ 핵종 '+q,F.kv({'반감기':Fmt.time(n.T),'붕괴형식':n.mode,
        '주요 감마선':(n.g||[]).map(x=>x[0]+' keV ('+x[1]+'%)').join(', ')||'없음',
        '선량률상수 Γ':n.G?U.fmt(n.G,4)+' µSv·m²/(MBq·h)':'—','용도':n.use||'—'}));}
    // 4) 검색 제안
    const hits=(Pal.items.length?Pal.items:(Pal.build(),Pal.items))
      .filter(i=>i.t.toLowerCase().includes(q.toLowerCase())).slice(0,6);
    if(hits.length)h+=F.card('🔎 관련 기능',hits.map((i,k)=>
      `<span class="chip" onclick="Pal.run(${Pal.items.indexOf(i)})">${U.esc(i.t)}</span>`).join(''));
    set('qOut',h||F.warn('해석할 수 없습니다. 수식(2+3*4), 단위변환(12 ft to cm), 핵종(Cs-137), 기능명을 입력해 보세요.'));}
};
Fmt.eng=v=>{if(!isFinite(v)||v===0)return '0';
  const e=Math.floor(Math.log10(Math.abs(v))/3)*3;
  return U.fmt(v/Math.pow(10,e),6)+(e?'×10'+U.sup(e):'');};

  /* --- 평균 비교 --- */
  ttest(){
    const mode=gv('ttMode');
    const x=StatUI.data('ttA'),y=StatUI.data('ttB');
    const alt=gv('ttAlt');
    let r,title,steps=[],hyp='';
    if(mode==='one'){
      const mu=gn('ttMu',0);
      if(x.length<2){set('ttOut',F.err('표본 A에 2개 이상 필요'));return;}
      r=S.ttest1(x,mu,alt);title='일표본 t-검정';
      hyp=`H₀: μ = ${mu}`;
      steps=[
        {lb:'① 표본통계',fm:'n, x̄, s',rs:`n=${r.n}, x̄=${U.fmt(r.mean,6)}, s=${U.fmt(r.sd,6)}`},
        {lb:'② 표준오차',fm:'SE = s/√n',rs:U.fmt(r.se,7)},
        {lb:'③ 검정통계량',fm:`t = (x̄ − μ₀)/SE = (${U.fmt(r.mean,6)} − ${mu})/${U.fmt(r.se,6)}`,rs:U.fmt(r.t,6)},
        {lb:'④ 자유도',fm:'df = n − 1',rs:r.df},
        {lb:'⑤ p-값',fm:`t 분포 ${alt==='two'?'양측':'단측'} 꼬리확률`,rs:U.p(r.p)},
        {lb:'⑥ 효과크기 Cohen d',fm:'(x̄ − μ₀)/s',rs:U.fmt(r.d,5)}];}
    else if(mode==='paired'){
      if(x.length!==y.length||x.length<2){set('ttOut',F.err('대응 표본은 길이가 같아야 합니다.'));return;}
      r=S.ttestP(x,y,alt);title='대응표본 t-검정';hyp='H₀: μ_d = 0';
      const dd=S.desc(r.diffs);
      steps=[
        {lb:'① 차이 계산',fm:'d_i = x_i − y_i',rs:'n='+dd.n+', d̄='+U.fmt(dd.mean,6)},
        {lb:'② 차이의 SD·SE',fm:'s_d, SE = s_d/√n',rs:U.fmt(dd.sd,6)+' , '+U.fmt(dd.se,6)},
        {lb:'③ 검정통계량',fm:'t = d̄ / SE',rs:U.fmt(r.t,6)},
        {lb:'④ p-값',fm:'df = n−1 = '+r.df,rs:U.p(r.p)},
        {lb:'⑤ 효과크기 d_z',fm:'d̄ / s_d',rs:U.fmt(r.dz,5)}];}
    else{
      if(x.length<2||y.length<2){set('ttOut',F.err('두 표본 모두 2개 이상 필요'));return;}
      const eq=gv('ttVar')==='equal';
      r=S.ttest2(x,y,eq,alt);title=eq?'독립표본 t-검정 (Student, 등분산 가정)':'독립표본 t-검정 (Welch, 기본값)';
      hyp='H₀: μ₁ = μ₂';
      steps=[
        {lb:'① 집단 통계',fm:'n, x̄, s',rs:`A: n=${r.a.n}, x̄=${U.fmt(r.a.mean,6)}, s=${U.fmt(r.a.sd,6)} / B: n=${r.b.n}, x̄=${U.fmt(r.b.mean,6)}, s=${U.fmt(r.b.sd,6)}`},
        {lb:'② 평균차',fm:'x̄₁ − x̄₂',rs:U.fmt(r.diff,6)},
        {lb:'③ 차이의 표준오차',fm:eq?'√(s_p²(1/n₁+1/n₂)), s_p='+U.fmt(r.sp,5):'√(s₁²/n₁ + s₂²/n₂)',rs:U.fmt(r.se,7)},
        {lb:'④ 자유도',fm:eq?'n₁+n₂−2':'Satterthwaite 근사',rs:U.fmt(r.df,5)},
        {lb:'⑤ 검정통계량',fm:'t = 평균차 / SE',rs:U.fmt(r.t,6)},
        {lb:'⑥ p-값',fm:'t 분포 꼬리확률',rs:U.p(r.p)},
        {lb:'⑦ 효과크기',fm:"Cohen d = 평균차/s_p ; Hedges g = d×J",rs:'d='+U.fmt(r.d,5)+', g='+U.fmt(r.g,5)}];}
    // 가정 점검
    const nA=x.length>=3?S.dagostino(x):null,nB=(y.length>=3&&mode!=='one')?S.dagostino(y):null;
    let lev=null;
