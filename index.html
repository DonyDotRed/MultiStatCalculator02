    else apa=`t(${U.fmt(r.df,3)}) = ${U.fmt(r.t,3)}, p ${U.p(r.p).startsWith('<')?U.p(r.p):'= '+U.p(r.p)}`;
    let alerts='';
    if(nA&&nA.p<0.05)alerts+=F.warn('표본 A의 정규성 가정이 의심됩니다 (D\'Agostino p='+U.p(nA.p)+'). 대안: ① Mann–Whitney/Wilcoxon 비모수 검정 ② 로그변환 후 t ③ 부트스트랩 평균차 CI');
    if(nB&&nB.p<0.05)alerts+=F.warn('표본 B의 정규성 가정이 의심됩니다 (p='+U.p(nB.p)+').');
    if(lev&&lev.p<0.05&&gv('ttVar')==='equal')alerts+=F.warn('등분산 가정 위배 (Levene p='+U.p(lev.p)+'). Welch 검정으로 전환하십시오.');
    set('ttOut',
      F.concl(`<b>${title}</b> — ${hyp}<br>${sig?'✔ 귀무가설 기각 (α=0.05)':'✖ 귀무가설을 기각할 근거 부족'}
        &nbsp; <b class="mono">t = ${U.fmt(r.t,5)}</b>, df = ${U.fmt(r.df,4)}, <b class="mono">p ${U.p(r.p)}</b>`)+
      `<div class="badges">
        ${F.badge('정규성 A p='+(nA?U.p(nA.p):'—'),!nA||nA.p>0.05?'ok':'bad')}
        ${nB?F.badge('정규성 B p='+U.p(nB.p),nB.p>0.05?'ok':'bad'):''}
        ${lev?F.badge('등분산 Levene p='+U.p(lev.p),lev.p>0.05?'ok':(gv('ttVar')==='equal'?'bad':'warn')):''}
        ${F.badge(sig?'유의함':'유의하지 않음',sig?'info':'warn')}</div>`+
      alerts+
      F.card('결과',F.kv(mode==='two'?{
        '검정통계량 t':U.fmt(r.t,6),'자유도 df':U.fmt(r.df,5),'p-값':U.p(r.p),
        '평균차 (A−B)':U.fmt(r.diff,6),'95% CI':`[${U.fmt(r.ci[0],5)}, ${U.fmt(r.ci[1],5)}]`,
        "Cohen's d":U.fmt(r.d,5),"Hedges' g":U.fmt(r.g,5),
        "g의 95% CI":`[${U.fmt(r.gci[0],4)}, ${U.fmt(r.gci[1],4)}]`,
        '검정력 (사전, |d| 기준)':U.fmt(S.power2t(Math.abs(r.d),r.a.n,r.b.n,0.05)*100,4)+' %'}:{
        '검정통계량 t':U.fmt(r.t,6),'자유도 df':r.df,'p-값':U.p(r.p),
        '평균':U.fmt(mode==='one'?r.mean:S.desc(r.diffs).mean,6),
        '95% CI':`[${U.fmt(r.ci[0],5)}, ${U.fmt(r.ci[1],5)}]`,
        '효과크기':U.fmt(mode==='one'?r.d:r.dz,5)})+F.steps(steps))+
      F.card('📝 보고 문장 (자동 생성)',`<div style="font-size:13px;line-height:1.7">${apa}</div>
        <div class="btns">${F.btn('복사','Session.copy(\'apaBox\')','sec sm')}</div>
        <div id="apaBox" style="display:none">${apa}</div>`)+
      F.card('시각화',`<div id="ttBox"></div><div id="ttDist" style="margin-top:8px"></div>`,'ttVis',true)+

  /* --- ANOVA --- */
  anova(){

    const a=S.anova(gs),lev=S.levene(gs,'median'),bar=S.bartlett(gs),kw=S.kruskal(gs);

      F.concl(`<b>일원배치 분산분석</b> — H₀: 모든 집단 평균이 같다<br>

        ${F.badge('η² = '+U.fmt(a.eta2,4),'info')}${F.badge('ω² = '+U.fmt(a.om2,4),'info')}</div>`+
      (eqOK?'':F.warn('등분산 가정 위배 — Welch ANOVA 또는 Games–Howell 사후검정, 혹은 비모수 Kruskal–Wallis 결과를 함께 보십시오.'))+
      F.card('분산분석표',F.tbl(['변동요인','SS','df','MS','F','p'],[

          {lb:'③ 집단내 제곱합',fm:'SSW = ΣΣ(x_ij − x̄_i)²',rs:U.fmt(a.ssw,7)},
          {lb:'④ 평균제곱',fm:'MSB=SSB/(k−1), MSE=SSW/(N−k)',rs:U.fmt(a.ms1,6)+' , '+U.fmt(a.ms2,6)},
          {lb:'⑤ F 통계량',fm:'F = MSB / MSE',rs:U.fmt(a.F,6)},

          {lb:'⑥ 수정 결정계수',fm:'1 − (1−R²)(n−1)/(n−p)',rs:U.fmt(f.ar2,6)},

          {lb:'⑧ 정보기준',fm:'AIC / BIC',rs:U.fmt(f.aic,6)+' / '+U.fmt(f.bic,6)}]))+
      F.card('모형 요약',F.kv({'R²':U.fmt(f.r2,6),'수정 R²':U.fmt(f.ar2,6),

    StatUI._rg={f,y,X};StatUI.drawReg();

  surv(){
    const rows=gv('svIn').trim().split('\n').filter(l=>l.trim()).map(l=>U.parseNums(l));
    if(rows.length<3){set('svOut',F.err('3행 이상. 각 행: 시간 사건(1/0) [그룹번호]'));return;}
    const t=rows.map(r=>r[0]),e=rows.map(r=>r[1]),grp=rows[0].length>2?rows.map(r=>r[2]):null;
    const km=S.km(t,e,grp);
    const lr=grp?S.logrank(t,e,grp):null;
    set('svOut',
      F.concl(`<b>Kaplan–Meier 생존분석</b> — 총 ${t.length}건, 사건 ${e.filter(v=>v).length}건, 중도절단 ${e.filter(v=>!v).length}건
        ${lr?`<br>Log-rank χ²(${lr.df}) = ${U.fmt(lr.X,4)}, p ${U.p(lr.p)} — ${lr.p<0.05?'✔ 군간 생존곡선 차이 유의':'✖ 차이 근거 부족'}`:''}`)+
      F.card('군별 요약',F.tbl(['군','n','사건 수','중도절단','중앙생존시간'],
        km.curves.map(c=>[grp?'그룹 '+c.group:'전체',c.n,c.events,c.n-c.events,
          c.median!==null?U.fmt(c.median,5):'미도달 (>50% 생존)'])))+
      (lr?F.card('Log-rank 검정',F.kv({'χ²':U.fmt(lr.X,5),'자유도':lr.df,'p-값':U.p(lr.p),
        '관측 사건 O':lr.O.map(v=>U.fmt(v,4)).join(' / '),
        '기대 사건 E':lr.E.map(v=>U.fmt(v,4)).join(' / '),
        '위험비 HR (근사, O/E 비)':lr.hr?U.fmt(lr.hr,4):'—'})+
        F.steps([
          {lb:'① 사건 시점별 위험집합',fm:'각 사건시점에서 군별 at-risk n_i, 사건 d_i 산출',rs:'사건시점 수 = '+[...new Set(t.filter((x,i)=>e[i]))].length},
          {lb:'② 기대 사건 수',fm:'E_k = Σ d·n_k/n',rs:lr.E.map(v=>U.fmt(v,4)).join(' / ')},
          {lb:'③ 검정통계량',fm:'χ² = (O₁−E₁)²/V  (2군) 또는 Σ(O−E)²/E',rs:U.fmt(lr.X,5)},
          {lb:'④ p-값',fm:'χ² 분포 df='+lr.df,rs:U.p(lr.p)}])):'')+
      F.card('생존 곡선',`<div id="svKM"></div>
        <div class="note">계단이 내려가는 지점이 사건 발생 시점입니다. 점선은 log-log 95% 신뢰대입니다.</div>`,'svVis',true)+
      F.card('생존표 (첫 군)',F.tbl(['시점','위험집합 n','사건 d','생존율 S(t)','95% CI'],
        km.curves[0].pts.slice(0,25).map(p=>[U.fmt(p.t,5),p.n,p.d||0,U.fmt(p.s,5),
          `[${U.fmt(p.lo,4)}, ${U.fmt(p.hi,4)}]`])))+
      F.prov('procedure=surv.km'+(lr?'+logrank':'')+' · CI=log-log · '+U.now()));
    const ser=[];
    km.curves.forEach((c,i)=>{
      ser.push({name:grp?'그룹 '+c.group:'생존율',type:'step',data:c.pts.map(p=>[p.t,p.s])});
      ser.push({name:'95% CI 하한',type:'step',data:c.pts.map(p=>[p.t,p.lo]),
        color:V.colors()[i%8],dash:[3,3],w:1});
      ser.push({name:'95% CI 상한',type:'step',data:c.pts.map(p=>[p.t,p.hi]),
        color:V.colors()[i%8],dash:[3,3],w:1});});
    V.plot('svKM',{h:280,series:ser,ymin:0,ymax:1,xlabel:'시간',ylabel:'생존확률 S(t)',
      hlines:[{y:0.5,c:V.css('--warn'),label:'중앙생존'}],forceLegend:true});},
  agree(){
    const rows=gv('agIn').trim().split('\n').filter(l=>l.trim()).map(l=>U.parseNums(l));
    if(rows.length<3||rows[0].length<2){set('agOut',F.err('3행 이상, 각 행에 평가자/방법별 값 2개 이상'));return;}
    const ic=S.icc(rows);
    const x=rows.map(r=>r[0]),y=rows.map(r=>r[1]);
    const ba=S.bland(x,y,gc('agLog')),pb=S.passingBablok(x,y),co=S.corr(x,y);
    const interp=v=>v<0.5?'나쁨':v<0.75?'보통':v<0.9?'좋음':'매우 좋음';
    set('agOut',
      F.concl(`<b>신뢰도·방법비교 분석</b> (n=${ic.n}, 평가자/방법 ${ic.k}개)<br>
        ICC(2,1) = <b>${U.fmt(ic.icc21,4)}</b> (${interp(ic.icc21)}) &nbsp;|&nbsp;
        Bland–Altman 편의 = ${U.fmt(ba.bias,5)}, 일치한계 [${U.fmt(ba.loa[0],5)}, ${U.fmt(ba.loa[1],5)}]`)+
      F.card('급내상관계수 ICC',F.tbl(['형태','값','해석','용도'],[
        ['ICC(1,1) 일원 랜덤',U.fmt(ic.icc11,5),interp(ic.icc11),'평가자가 매번 무작위로 다를 때'],
        ['ICC(2,1) 이원 랜덤',U.fmt(ic.icc21,5),interp(ic.icc21),'평가자를 모집단 표본으로 볼 때 (일반화 목적)'],
        ['ICC(3,1) 이원 혼합',U.fmt(ic.icc31,5),interp(ic.icc31),'이 평가자들만 관심일 때 (일치도)'],
        ['ICC(2,k) 평균',U.fmt(ic.icc2k,5),interp(ic.icc2k),'k명 평균값을 쓸 때'],
        ['ICC(3,k) 평균',U.fmt(ic.icc3k,5),interp(ic.icc3k),'k명 평균, 고정효과']])+
        F.steps([
          {lb:'① 분산분석 분해',fm:'SS를 대상간(B)·평가자간(C)·오차(E)로 분해',rs:`MSB=${U.fmt(ic.MSB,5)}, MSC=${U.fmt(ic.MSC,5)}, MSE=${U.fmt(ic.MSE,5)}`},
          {lb:'② ICC(2,1)',fm:'(MSB−MSE)/(MSB+(k−1)MSE+k(MSC−MSE)/n)',rs:U.fmt(ic.icc21,6)},
          {lb:'③ ICC(3,1)',fm:'(MSB−MSE)/(MSB+(k−1)MSE)',rs:U.fmt(ic.icc31,6)}])+
        `<div class="note">ICC 형태 선택이 결과를 크게 바꿉니다. 논문·보고서에는 <b>반드시 형태(1,1)/(2,1)/(3,1)와 단일/평균 여부를 명시</b>하십시오.</div>`)+
      F.card('Bland–Altman 분석 (방법 1 vs 2)',F.kv({
        '편의 (평균차)':U.fmt(ba.bias,6),'편의 95% CI':`[${U.fmt(ba.biasCI[0],5)}, ${U.fmt(ba.biasCI[1],5)}]`,
        '차이의 SD':U.fmt(ba.sd,6),
        '일치한계 하한 (−1.96SD)':U.fmt(ba.loa[0],6),
        '일치한계 상한 (+1.96SD)':U.fmt(ba.loa[1],6),
        'LoA 하한 95% CI':`[${U.fmt(ba.loaCI[0][0],4)}, ${U.fmt(ba.loaCI[0][1],4)}]`,
        '비례편의 (차이~평균 상관)':U.fmt(ba.propBias.r,4)+' (p '+U.p(ba.propBias.p)+')',
        '로그변환':ba.log?'적용':'미적용','n':ba.n})+
        (Math.abs(ba.propBias.r)>0.3&&ba.propBias.p<0.05?
          F.warn('차이가 측정값 크기에 따라 변합니다(비례편의). 로그변환 후 재분석을 권장합니다.'):''))+
      F.card('Passing–Bablok 회귀 (비모수 방법비교)',F.kv({
        '기울기':U.fmt(pb.slope,5),
        '기울기 95% CI':`[${U.fmt(pb.slopeCI[0],4)}, ${U.fmt(pb.slopeCI[1],4)}]`,
        '절편':U.fmt(pb.intercept,5),
        '비례오차 판정':(pb.slopeCI[0]<=1&&pb.slopeCI[1]>=1)?'없음 (CI가 1 포함)':'있음 (CI가 1 미포함)',
        'Pearson r':U.fmt(co.r,5)})+
        `<div class="note">Passing–Bablok은 두 방법 모두 오차를 갖는 상황에 적합하며 이상치에 강건합니다. 최소제곱회귀는 x축 오차를 무시하므로 방법비교에 부적절합니다.</div>`)+
      F.card('시각화',`<div class="grid2">
        <div><b class="note">Bland–Altman 플롯</b><div id="agBA"></div></div>
        <div><b class="note">산점도 + 회귀선</b><div id="agSC"></div></div></div>`,'agVis',true)+
      F.prov('procedure=agree.icc+bland+pb · '+U.now()));
    V.plot('agBA',{h:230,series:[{name:'차이',type:'scatter',data:ba.means.map((m,i)=>[m,ba.diffs[i]])}],
      xlabel:'두 방법의 평균',ylabel:'차이 (방법1 − 방법2)',
      hlines:[{y:ba.bias,c:V.css('--acc'),label:'편의'},
        {y:ba.loa[0],c:V.css('--bad'),label:'−1.96SD'},{y:ba.loa[1],c:V.css('--bad'),label:'+1.96SD'},
        {y:0,c:V.css('--fg3')}]});
    const mn=Math.min(...x),mx=Math.max(...x);
    V.plot('agSC',{h:230,series:[
      {name:'관측',type:'scatter',data:x.map((v,i)=>[v,y[i]])},
      {name:'Passing–Bablok',data:[[mn,pb.intercept+pb.slope*mn],[mx,pb.intercept+pb.slope*mx]],color:V.css('--ok')},
      {name:'y = x',data:[[mn,mn],[mx,mx]],color:V.css('--fg3'),dash:[5,3]}],
      xlabel:'방법 1',ylabel:'방법 2',forceLegend:true});},
  power(){
    const type=gv('pwType');
    let h='';
    if(type==='mean2'){
      const d=gn('pwD',0.5),pw=gn('pwPower',0.8),al=gn('pwAlpha',0.05),drop=gn('pwDrop',0)/100;
      const n=S.n2t(d,pw,al),nAdj=Math.ceil(n/(1-drop));
      const curve=U.seq(4,Math.max(60,n*2),80).map(nn=>[nn,S.power2t(d,Math.round(nn),Math.round(nn),al)*100]);
      h=F.concl(`효과크기 d = ${d}, 검정력 ${pw*100}%, α = ${al} 조건에서<br>
          <b>군당 ${n}명</b> (총 ${n*2}명) 필요${drop?` · 탈락률 ${drop*100}% 반영 시 군당 <b>${nAdj}명</b> (총 ${nAdj*2}명)`:''}`)+
        F.card('결과',F.kv({'군당 표본수':n,'총 표본수':n*2,
          '탈락 보정 군당':nAdj,'탈락 보정 총':nAdj*2,
          '실제 달성 검정력':U.fmt(S.power2t(d,n,n,al)*100,4)+' %',
          '검출가능 최소 효과크기 (해당 n)':U.fmt((()=>{let lo=0,hi=3;
            for(let i=0;i<80;i++){const m=(lo+hi)/2;S.power2t(m,n,n,al)<pw?lo=m:hi=m;}return (lo+hi)/2;})(),4)})+
          F.steps([
            {lb:'① 목표',fm:`검정력 ${pw}, 유의수준 ${al} (양측)`,rs:'—'},
            {lb:'② 근사식',fm:'n ≈ 2(z_{1−α/2}+z_{1−β})²/d² = 2('+U.fmt(zq(1-al/2),4)+'+'+U.fmt(zq(pw),4)+')²/'+d+'²',
             rs:U.fmt(2*Math.pow(zq(1-al/2)+zq(pw),2)/(d*d),4)},
            {lb:'③ 비중심 t 기반 정밀 탐색',fm:'n을 1씩 증가시키며 검정력 ≥ 목표가 되는 최소 n',rs:n+' (군당)'},
            {lb:'④ 탈락 보정',fm:'n/(1−탈락률)',rs:nAdj}]))+
        F.card('검정력 곡선',`<div id="pwCurve"></div>`,'pwVis',true);
      setTimeout(()=>V.plot('pwCurve',{h:250,series:[{name:'검정력 (%)',data:curve}],
        xlabel:'군당 표본수 n',ylabel:'검정력 (%)',ymin:0,ymax:100,
        hlines:[{y:pw*100,c:V.css('--warn'),label:'목표 '+(pw*100)+'%'}],
        vlines:[{x:n,c:V.css('--ok'),label:'n = '+n}]}),30);}
    else if(type==='prop'){
      const p1=gn('pwP1',0.3),p2=gn('pwP2',0.5),pw=gn('pwPower',0.8),al=gn('pwAlpha',0.05);
      const n=S.nProp(p1,p2,pw,al);
      h=F.concl(`비율 ${p1} vs ${p2} 비교 — <b>군당 ${n}명</b> (총 ${n*2}명) 필요`)+
        F.card('결과',F.kv({'군당 표본수':n,'총 표본수':n*2,
          '위험차 RD':U.fmt(p2-p1,4),'상대위험 RR':U.fmt(p2/p1,4),
          '오즈비 OR':U.fmt((p2/(1-p2))/(p1/(1-p1)),4),
          'Cohen h':U.fmt(2*Math.asin(Math.sqrt(p2))-2*Math.asin(Math.sqrt(p1)),4)})+
          F.steps([
            {lb:'① 평균비율',fm:'p̄ = (p₁+p₂)/2',rs:U.fmt((p1+p2)/2,5)},
            {lb:'② 표본수 공식',fm:'n = [z_{1−α/2}√(2p̄q̄) + z_{1−β}√(p₁q₁+p₂q₂)]² / (p₁−p₂)²',rs:n}]));}
    else{
      const d=gn('pwD',0.5),n1=gn('pwN1',30),n2=gn('pwN2',30),al=gn('pwAlpha',0.05);
      const pw=S.power2t(d,n1,n2,al);
      h=F.concl(`n₁=${n1}, n₂=${n2}, d=${d}, α=${al} 조건의 <b>사전 검정력 = ${U.fmt(pw*100,4)}%</b>`)+
        F.warn('<b>사후 검정력(post-hoc power) 주의</b> — 관측된 효과크기로 계산한 검정력은 p-값의 단조변환일 뿐 해석적 가치가 없습니다. 결과 해석에는 신뢰구간의 폭(정밀도)을 사용하십시오. (설계서 §4.12)')+
        F.card('결과',F.kv({'검정력':U.fmt(pw*100,4)+' %','제2종 오류 β':U.fmt((1-pw)*100,4)+' %',
          '총 표본수':n1+n2,'비중심 모수 λ':U.fmt(d*Math.sqrt(n1*n2/(n1+n2)),4)}));}
    set('pwOut',h+F.prov('procedure=power.'+type+' · '+U.now()));}

/* ============================================================================
   모듈 3 : 확률분포 탐색기
   ============================================================================ */
const DistUI={
  cur:'norm',
  pick(){
    const k=gv('dtDist');DistUI.cur=k;const d=D[k];
    let h='';
    d.par.forEach((p,i)=>{
      const v=d.def[i];
      h+=F.rng('dtP'+i,p,v,k==='binom'&&i===0?1:(v<=1?0.01:0.1),
        k==='binom'&&i===0?200:(p.includes('p')||p==='α'||p==='β'?(v<=1?1:50):Math.max(50,v*8)),
        (p.includes('p')&&v<=1)?0.01:(v<=1?0.01:0.1));});
    set('dtPars',h);DistUI.draw();},
  pars(){const d=D[DistUI.cur];return d.par.map((_,i)=>gn('dtP'+i,d.def[i]));},
  draw(){
    const k=DistUI.cur,d=D[k],p=DistUI.pars();
    const x=gn('dtX',0);
    const disc=!!d.disc;
    let lo,hi;
    const m=d.mean(...p),v=d.var_(...p),sd=Math.sqrt(v);
    if(isFinite(m)&&isFinite(sd)&&sd>0){lo=m-4.5*sd;hi=m+4.5*sd;}
    else{lo=d.rng[0];hi=d.rng[1];}
    if(k==='chi2'||k==='exp'||k==='gamma'||k==='lnorm'||k==='weibull'||k==='f'||disc)lo=Math.max(0,lo);
    if(k==='beta'){lo=0;hi=1;}
    const N=disc?Math.min(200,Math.ceil(hi-lo)+1):320;
    const xs=disc?Array.from({length:N},(_,i)=>Math.round(lo)+i):U.seq(lo,hi,N);
    const pdf=xs.map(t=>[t,d.pdf(t,...p)]);
    const cdf=xs.map(t=>[t,d.cdf(t,...p)]);
    const lower=d.cdf(x,...p),upper=1-lower;
    set('dtOut',
      F.concl(`<b>${d.n} 분포</b> ${d.par.map((q,i)=>q+'='+U.fmt(p[i],5)).join(', ')}<br>
        ${disc?'P(X = '+Math.round(x)+') = <b>'+U.fmt(d.pdf(x,...p),6)+'</b> · ':'f('+U.fmt(x,4)+') = <b>'+U.fmt(d.pdf(x,...p),6)+'</b> · '}
        P(X ≤ ${U.fmt(x,4)}) = <b>${U.fmt(lower,6)}</b> · P(X > ${U.fmt(x,4)}) = <b>${U.fmt(upper,6)}</b>`)+
      F.card('분포 특성',F.kv({
        '평균 E[X]':isFinite(m)?U.fmt(m,6):'정의되지 않음',
        '분산 Var[X]':isFinite(v)?U.fmt(v,6):'정의되지 않음',
        '표준편차':isFinite(sd)?U.fmt(sd,6):'—',
        [disc?'PMF f(x)':'PDF f(x)']:U.fmt(d.pdf(x,...p),8),
        'CDF F(x) = P(X≤x)':U.fmt(lower,8),
        '생존함수 S(x) = P(X>x)':U.fmt(upper,8),
        '5% 분위수':U.fmt(d.q(0.05,...p),6),
        '중앙값 (50%)':U.fmt(d.q(0.5,...p),6),
        '95% 분위수':U.fmt(d.q(0.95,...p),6),
        '97.5% 분위수':U.fmt(d.q(0.975,...p),6)})+
        F.steps([
          {lb:'① 밀도/질량함수',fm:DistUI.formula(k),rs:U.fmt(d.pdf(x,...p),8)},
          {lb:'② 누적분포',fm:'F(x) = P(X ≤ x)',rs:U.fmt(lower,8)},
          {lb:'③ 꼬리확률',fm:'S(x) = 1 − F(x)  [직접 계산으로 유효숫자 손실 방지]',rs:U.fmt(upper,8)},
          {lb:'④ 역함수(분위수)',fm:'F⁻¹(0.95)',rs:U.fmt(d.q(0.95,...p),6)}]))+
      F.card('분포 그래프 <span class="note" style="margin-left:8px">파란 영역 = P(X≤x)</span>',
        `<div id="dtPdf"></div><div id="dtCdf" style="margin-top:6px"></div>`,'dtVis',true)+
      F.card('난수 생성 (시드 재현)',
        `${F.num('dtN','표본 크기',500)}${F.txt('dtSeed','시드','ksb-dist','seed')}
         <div class="btns">${F.btn('생성 후 히스토그램','DistUI.rng()','sec')}</div>
         <div id="dtRng" style="margin-top:8px"></div>`)+
      F.prov(`distribution=${k} · params=[${p.map(q=>U.fmt(q,6)).join(', ')}] · ${U.now()}`));
    const shade=pdf.filter(q=>q[0]<=x);
    V.plot('dtPdf',{h:250,series:[
      {name:disc?'PMF':'PDF',data:pdf,type:disc?'bar':'line'},
      {name:'P(X ≤ x)',type:'area',data:shade,color:V.css('--acc')}],
      xlabel:'x',ylabel:disc?'P(X=x)':'밀도',ymin:0,tight:true,
      vlines:[{x:x,c:V.css('--ok'),label:'x = '+U.fmt(x,4)},
        ...(isFinite(m)?[{x:m,c:V.css('--warn'),label:'평균'}]:[])]});
    V.plot('dtCdf',{h:180,series:[{name:'CDF',data:cdf,color:V.css('--unit')}],
      xlabel:'x',ylabel:'F(x)',ymin:0,ymax:1,
      vlines:[{x:x,c:V.css('--ok')}],hlines:[{y:lower,c:V.css('--ok'),label:'F(x)='+U.fmt(lower,4)}]});},
  formula(k){return {
    norm:'f(x) = 1/(σ√(2π)) · exp(−(x−μ)²/(2σ²))',
    t:'f(x) = Γ((ν+1)/2)/(√(νπ)Γ(ν/2)) · (1+x²/ν)^(−(ν+1)/2)',
    chi2:'f(x) = x^(ν/2−1)e^(−x/2) / (2^(ν/2)Γ(ν/2))',
    f:'f(x) = [ (d₁x)^d₁ d₂^d₂ / (d₁x+d₂)^(d₁+d₂) ]^(1/2) / (x·B(d₁/2,d₂/2))',
    lnorm:'f(x) = 1/(xσ√(2π)) · exp(−(ln x−μ)²/(2σ²))',
    exp:'f(x) = λe^(−λx)',
    gamma:'f(x) = x^(k−1)e^(−x/θ) / (Γ(k)θ^k)',
    beta:'f(x) = x^(α−1)(1−x)^(β−1) / B(α,β)',
    weibull:'f(x) = (k/λ)(x/λ)^(k−1) e^(−(x/λ)^k)',
    unif:'f(x) = 1/(b−a),  a ≤ x ≤ b',
    binom:'P(X=x) = C(n,x) p^x (1−p)^(n−x)',
    pois:'P(X=x) = λ^x e^(−λ) / x!',
    geom:'P(X=x) = p(1−p)^x',
    hyper:'P(X=x) = C(K,x)C(N−K,n−x)/C(N,n)',
    nbinom:'P(X=x) = C(x+r−1,x) p^r (1−p)^x'}[k]||'—';},
  rng(){
    const k=DistUI.cur,d=D[k],p=DistUI.pars(),n=gn('dtN',500);
    const r=PRNG(gv('dtSeed')||'ksb');
    const s=[];for(let i=0;i<n;i++)s.push(d.q(r(),...p));
    const ds=S.desc(s);
    set('dtRng',F.kv({'표본 평균':U.fmt(ds.mean,6),'이론 평균':U.fmt(d.mean(...p),6),
      '표본 SD':U.fmt(ds.sd,6),'이론 SD':U.fmt(Math.sqrt(d.var_(...p)),6),
      '시드':gv('dtSeed')||'ksb','n':n})+`<div id="dtRngH" style="margin-top:8px"></div>`);
    V.hist('dtRngH',s,null,{density:true,h:200,xlabel:'표본값',
      vlines:[{x:d.mean(...p),c:V.css('--warn'),label:'이론 평균'}]});
    const xs=U.seq(Math.min(...s),Math.max(...s),200);
    UI.msg('시드 '+(gv('dtSeed')||'ksb')+'로 '+n+'개 생성 — 동일 시드는 항상 동일 결과');}
};

const CalcUI={
  hist:[],vars:{},
  run(){
    const src=gv('exprIn');if(!src.trim())return;
    let out;
    try{
      const ast=EX.parse(src);
      const v=EX.evalAst(ast,CalcUI.vars);
      CalcUI.vars.ans=v;
      CalcUI.hist.unshift({src,v,t:new Date().toLocaleTimeString('ko-KR')});
      if(CalcUI.hist.length>40)CalcUI.hist.pop();
      const ang=gv('exprAng');
      out=F.concl(`<div class="big">${U.fmt(v,12)}</div>`)+
        F.card('여러 표기법으로 보기',F.kv({
          '십진':U.fmt(v,14),'과학표기':U.sci(v,8),'공학표기':Fmt.eng(v),

  frac(v){

    for(let d=1;d<=10000;d++){const n=Math.round(v*d),e=Math.abs(v-n/d);
      if(e<be){be=e;bn=n;bd=d;if(e<1e-12)break;}}

  tree(n,d){

    if(n.k==='bin')return pad+'연산 '+n.o+'\n'+CalcUI.tree(n.a,d+1)+'\n'+CalcUI.tree(n.b,d+1);
    if(n.k==='call')return pad+'함수 '+n.n+'()\n'+n.args.map(a=>CalcUI.tree(a,d+1)).join('\n');

  plot(){
    const f=gv('fnIn'),a=gn('fnA',-10),b=gn('fnB',10);
    try{
      const ast=EX.parse(f);
      const xs=U.seq(a,b,400);
      const data=xs.map(x=>{let y;try{y=EX.evalAst(ast,{...CalcUI.vars,x});}catch(e){y=NaN;}
        return [x,isFinite(y)?y:NaN];}).filter(p=>isFinite(p[1]));
      // 근·극값 탐색
      const roots=[],ext=[];
      for(let i=1;i<data.length;i++){
        if(data[i-1][1]*data[i][1]<0){
          let lo=data[i-1][0],hi=data[i][0];
          for(let k=0;k<60;k++){const m=(lo+hi)/2;
            const v=EX.evalAst(ast,{...CalcUI.vars,x:m});
            (EX.evalAst(ast,{...CalcUI.vars,x:lo})*v<=0?hi=m:lo=m);}
          roots.push((lo+hi)/2);}
        if(i>1&&((data[i-1][1]>data[i-2][1]&&data[i-1][1]>data[i][1])||
                 (data[i-1][1]<data[i-2][1]&&data[i-1][1]<data[i][1])))
          ext.push({x:data[i-1][0],y:data[i-1][1],
            type:data[i-1][1]>data[i][1]?'극대':'극소'});}
      // 수치 미적분
      const mid=(a+b)/2,h=1e-5;
      const d1=(EX.evalAst(ast,{...CalcUI.vars,x:mid+h})-EX.evalAst(ast,{...CalcUI.vars,x:mid-h}))/(2*h);
      let I=0;const nS=1000,hh=(b-a)/nS;
      for(let i=0;i<nS;i++){const x0=a+i*hh,x1=x0+hh,xm=(x0+x1)/2;
        try{I+=hh/6*(EX.evalAst(ast,{...CalcUI.vars,x:x0})+4*EX.evalAst(ast,{...CalcUI.vars,x:xm})+EX.evalAst(ast,{...CalcUI.vars,x:x1}));}catch(e){}}
      set('fnOut',
        F.concl(`<b>y = ${U.esc(f)}</b> · 구간 [${a}, ${b}]`)+
        F.card('해석 결과',F.kv({
          '근 (y=0)':roots.length?roots.map(r=>U.fmt(r,7)).join(', '):'구간 내 없음',
          '극값':ext.length?ext.slice(0,6).map(e=>`${e.type} (${U.fmt(e.x,5)}, ${U.fmt(e.y,5)})`).join(' / '):'없음',
          [`f'(${U.fmt(mid,4)}) 수치미분`]:U.fmt(d1,8),
          [`∫f dx over [${a},${b}]`]:U.fmt(I,8)+' (적응 Simpson, n=1000)',
          '최댓값':U.fmt(Math.max(...data.map(p=>p[1])),7),
          '최솟값':U.fmt(Math.min(...data.map(p=>p[1])),7)}))+
        F.card('그래프',`<div id="fnPlot"></div>`,'fnVis',true));
      V.plot('fnPlot',{h:320,series:[{name:'f(x)',data}],xlabel:'x',ylabel:'f(x)',
        hlines:[{y:0,c:V.css('--fg3')}],
        vlines:roots.slice(0,8).map(r=>({x:r,c:V.css('--ok'),label:'근'}))});
    }catch(e){set('fnOut',F.err(e.message));}},
  gum(){

          '포함인자 k':r.k,'확장불확도 U = k·u_c':U.fmt(r.U,8),

          '보고 형식':`${U.fmt(r.y,7)} ± ${U.fmt(r.U,5)} (k=${r.k})`})+
          F.steps([
            {lb:'① 모델 함수',fm:'y = f(x₁,…,xₙ) = '+f,rs:U.fmt(r.y,9)},
            {lb:'② 감도계수',fm:'cᵢ = ∂f/∂xᵢ  (전방차분 자동미분)',rs:r.terms.map(t=>t.name+':'+U.fmt(t.c,5)).join(', ')},
            {lb:'③ 합성 분산',fm:'u_c² = Σ(cᵢ·u(xᵢ))²',rs:U.sci(r.uc*r.uc,5)},

  matrix(){
    const rows=gv('mxIn').trim().split('\n').filter(l=>l.trim()).map(l=>U.parseNums(l));
    const n=rows.length;
    if(!n||rows.some(r=>r.length!==rows[0].length)){set('mxOut',F.err('직사각 행렬을 입력하세요.'));return;}
    const m=rows[0].length;
    let h=F.concl(`<b>${n} × ${m} 행렬</b>`);
    // 전치
    const T=[];for(let j=0;j<m;j++){T.push([]);for(let i=0;i<n;i++)T[j].push(rows[i][j]);}
    h+=F.card('전치 Aᵀ',F.tbl(Array.from({length:n},(_,i)=>'c'+(i+1)),T.map(r=>r.map(v=>U.fmt(v,5)))));
    if(n===m){
      // 행렬식 (LU)
      const A=rows.map(r=>r.slice());let det=1,sing=false;
      for(let k=0;k<n;k++){
        let p2=k;for(let i=k+1;i<n;i++)if(Math.abs(A[i][k])>Math.abs(A[p2][k]))p2=i;
        if(Math.abs(A[p2][k])<1e-14){sing=true;det=0;break;}
        if(p2!==k){[A[k],A[p2]]=[A[p2],A[k]];det=-det;}
        det*=A[k][k];
        for(let i=k+1;i<n;i++){const f=A[i][k]/A[k][k];
          for(let j=k;j<n;j++)A[i][j]-=f*A[k][j];}}
      let inv=null;
      if(!sing){
        const M=rows.map((r,i)=>r.concat(rows.map((_,j)=>i===j?1:0)));
        for(let k=0;k<n;k++){
          let p2=k;for(let i=k+1;i<n;i++)if(Math.abs(M[i][k])>Math.abs(M[p2][k]))p2=i;
          [M[k],M[p2]]=[M[p2],M[k]];
          const d=M[k][k];for(let j=0;j<2*n;j++)M[k][j]/=d;
          for(let i=0;i<n;i++)if(i!==k){const f=M[i][k];
            for(let j=0;j<2*n;j++)M[i][j]-=f*M[k][j];}}
        inv=M.map(r=>r.slice(n));}
      let tr=0;for(let i=0;i<n;i++)tr+=rows[i][i];
      h+=F.card('정방행렬 성질',F.kv({'행렬식 det(A)':U.fmt(det,8),
        '대각합 tr(A)':U.fmt(tr,8),'가역성':sing?'특이행렬 (역행렬 없음)':'가역',
        'Frobenius 노름':U.fmt(Math.sqrt(U.sum(rows.flat().map(v=>v*v))),7)}));
      if(inv)h+=F.card('역행렬 A⁻¹',F.tbl(Array.from({length:n},(_,i)=>'c'+(i+1)),
        inv.map(r=>r.map(v=>U.fmt(v,6)))));}
    set('mxOut',h);}
};

const UnitUI={
  calc(){
    const v=gn('uVal',1),f=gv('uFrom').trim(),t=gv('uTo').trim();
    if(!f||!t){set('uOut','');return;}
    const r=UN.convert(v,f,t);
    if(r.error){
      set('uOut',(r.forbidden?
        F.err(`<b>🚫 변환 금지 쌍 — ${f} → ${t}</b><br>${r.msg}`):
        F.err(`<b>차원 불일치</b><br>${r.msg}`))+
        (r.forbidden?F.card('왜 막았는가?',`
          <p>두 단위는 <b>SI 차원벡터가 동일</b>합니다. 순수한 차원 검사만으로는 변환이 허용되어 버립니다.
          그러나 물리적 의미가 달라 실무에서 심각한 오류를 낳으므로, 본 시스템은 차원 검사와 <b>별도로</b>
          「변환 금지 쌍 테이블」을 두어 커널 수준에서 차단합니다 (설계서 §18.3 · RISK-14 · 회귀테스트 T-015).</p>
          ${F.tbl(['금지 쌍','이유','올바른 방법'],[
            ['Gy ↔ Sv','흡수선량 vs 등가·유효선량','방사선가중계수 w_R 적용 → [방사선] 탭의 선량량 변환'],
            ['N·m ↔ J','토크 vs 에너지','물리량 자체가 다름'],
            ['Bq ↔ Gy/Sv','방사능 vs 선량','선량률상수 Γ 또는 선량계수 e(g) 필요']])}`):''));
      return;}
    // 관련 단위 동시 표시
    const F0=UN.parse(f);
    const rel=Object.keys(UN.db).filter(s=>{
      const u=UN.db[s];if(u.sym!==s)return false;
      try{return UN.sameDim(UN.parse(s).dim,F0.dim);}catch(e){return false;}}).slice(0,16);
    const note=UN.db[f]&&UN.db[f].note||UN.db[t]&&UN.db[t].note;
    set('uOut',
      F.concl(`<div class="big">${U.fmt(r.value,10)}<span class="unit">${U.esc(t)}</span></div>
        <div class="note" style="margin-top:4px">${U.fmt(v,8)} ${U.esc(f)} = ${U.fmt(r.value,10)} ${U.esc(t)}
        · 차원 [${r.dim}] · SI 값 ${U.sci(r.si,6)}</div>`)+
      (note?F.warn(note):'')+
      F.card('계산 과정',F.steps(r.steps)+
        `<div class="note">모든 단위는 <b>SI 7 기본차원 지수벡터</b>(m, kg, s, A, K, mol, cd)로 표현되어
        조합단위도 자동 해석됩니다. 온도만 오프셋 변환을 사용하며, 온도차(Δ°C)는 별도 단위로 분리되어 있습니다.</div>`)+
      F.card('같은 차원의 다른 단위로 동시 변환',F.tbl(['단위','값','계열','비고'],
        rel.map(s=>{const rr=UN.convert(v,f,s);
          return [`<span class="chip" onclick="g('uTo').value='${s}';UnitUI.calc()">${s}</span>`,
            rr.error?'—':U.fmt(rr.value,8),UN.db[s].sys,UN.db[s].name];})))+
      F.prov(`procedure=units.convert · dim=[${r.dim}] · ${U.now()}`));},
  cats(){
    set('uCats',Object.keys(UN.cat).map(c=>
      `<span class="chip" onclick="UnitUI.showCat('${c}')">${c} (${UN.cat[c].length})</span>`).join(''));},
  showCat(c){
    const list=UN.cat[c];
    set('uOut',F.card(`단위 카테고리 — ${c}`,F.tbl(['기호','이름','SI 배율','차원','계열','비고'],
      list.map(s=>{const u=UN.db[s];
        return [`<span class="chip" onclick="g('uFrom').value='${s}';UnitUI.calc()">${s}</span>`,

  lab(){
    const i=+gv('lbAn'),a=LAB.analytes[i],v=gn('lbVal',100);
    const to=v*a.f,back=to/a.f;

      F.concl(`<b>${a.n}</b><br>

      F.warn('임상검사 단위는 <b>분석물마다 분자량이 달라 단일 변환계수가 존재하지 않습니다.</b> ' +

      F.card('변환 근거',F.kv({'분석물':a.n,'분자량 (g/mol)':U.fmt(a.mw,7),
        '변환계수':U.fmt(a.f,8)+' ('+a.to+' per '+a.from+')',
        '역변환계수':U.fmt(1/a.f,8),'역검산':U.fmt(back,8)+' '+a.from})+
        F.steps([
          {lb:'① 분석물 확인',fm:a.n+' (M = '+a.mw+' g/mol)',rs:'계수 '+U.fmt(a.f,7)},
          {lb:'② 변환',fm:U.fmt(v,6)+' '+a.from+' × '+U.fmt(a.f,7),rs:U.fmt(to,8)+' '+a.to},
          {lb:'③ 왕복 검산',fm:U.fmt(to,7)+' ÷ '+U.fmt(a.f,7),rs:U.fmt(back,8)+' '+a.from+
            ' (상대오차 '+U.sci(Math.abs(back-v)/Math.max(1e-30,Math.abs(v)),2)+')'}]))+
      F.card('HbA1c 단위 변환 (별도 체계)',
        `${F.num('lbA1c','NGSP (%)',7.0,null,'%',0.1)}
         <div class="btns">${F.btn('변환','UnitUI.a1c()','sec sm')}</div>
         <div id="a1cOut" style="margin-top:8px"></div>`)+
      F.prov('procedure=units.clinical · 분석물 명시 선택 방식 · '+U.now()));
    UnitUI.a1c();},
  a1c(){
    const n=gn('lbA1c',7);
    set('a1cOut',F.kv({'NGSP (%)':U.fmt(n,4),
      'IFCC (mmol/mol)':U.fmt(LAB.hba1c(n),5),
      '추정평균혈당 eAG (mg/dL)':U.fmt(LAB.eag(n),5),
      '추정평균혈당 eAG (mmol/L)':U.fmt(LAB.eag(n)*0.0555,5)})+
      F.steps([
        {lb:'① 마스터 방정식',fm:'IFCC = (NGSP − 2.15) × 10.929',rs:U.fmt(LAB.hba1c(n),6)+' mmol/mol'},
        {lb:'② 추정평균혈당 (ADAG)',fm:'eAG = 28.7 × NGSP − 46.7',rs:U.fmt(LAB.eag(n),6)+' mg/dL'}]));},
  rad(){
    const v=gn('urVal',1),f=gv('urFrom'),t=gv('urTo');
    const r=UN.convert(v,f,t);
    let h;
    if(r.error)h=F.err(r.msg||r.error);
    else h=F.concl(`<div class="big">${U.fmt(r.value,10)}<span class="unit">${t}</span></div>`)+
      F.card('계산 과정',F.steps(r.steps));
    set('urOut',h+F.card('방사선 단위 대조표',F.tbl(['양','SI 단위','구 단위','환산','의미'],[
      ['방사능 (Activity)','Bq (베크렐)','Ci (퀴리)','1 Ci = 3.7×10¹⁰ Bq','초당 붕괴 수'],
      ['흡수선량 (Absorbed dose)','Gy (그레이)','rad','1 Gy = 100 rad','물질 1 kg이 흡수한 에너지 (J/kg)'],
      ['등가선량 (Equivalent dose)','Sv (시버트)','rem','1 Sv = 100 rem','흡수선량 × 방사선가중계수 w_R'],
      ['유효선량 (Effective dose)','Sv','rem','동상','등가선량 × 조직가중계수 w_T 합산'],
      ['조사선량 (Exposure)','C/kg','R (뢴트겐)','1 R = 2.58×10⁻⁴ C/kg','공기 이온화 능력'],
      ['계수율','cps / cpm','dpm','1 dpm = 1/60 dps','검출기 측정값 (효율 보정 전)']])+
      F.warn('<b>Gy와 Sv는 차원이 같습니다(J/kg).</b> 그러나 직접 변환은 물리적으로 잘못되었으므로 본 시스템은 이를 차단합니다. ' +

    // 잔액 추이
    const rows=[];let bal=solve==='pv'?-v:a.pv;
    const rr=solve==='rate'?v:a.rate,pm=solve==='pmt'?v:a.pmt,nn=solve==='n'?Math.round(v):a.n;
    for(let k=1;k<=Math.min(60,Math.round(nn));k++){
      const int=-bal*rr;bal=bal*(1+rr)+pm;
      rows.push({k,int,bal});}
    set('tvOut',
      F.concl(`<b>${lbl}</b> = <span class="big">${disp}</span>`)+
      F.card('입력 조건',F.kv({'현재가치 PV':solve==='pv'?'← 계산':U.fmt(a.pv,8),
        '미래가치 FV':solve==='fv'?'← 계산':U.fmt(a.fv,8),
        '주기 지급 PMT':solve==='pmt'?'← 계산':U.fmt(a.pmt,8),
        '기간 수 N':solve==='n'?'← 계산':U.fmt(a.n,6),
        '기간 이자율':solve==='rate'?'← 계산':U.fmt(a.rate*100,6)+' %',
        '지급 시점':a.type?'기초 (annuity due)':'기말 (ordinary)'})+
        F.steps([
          {lb:'① TVM 항등식',fm:'PV·(1+i)ⁿ + PMT·(1+i·type)·[(1+i)ⁿ−1]/i + FV = 0',rs:'현금흐름 부호 규약: 유출(−), 유입(+)'},
          {lb:'② 미지수',fm:solve+' 에 대해 풀이',rs:['rate','n'].includes(solve)?'이분법 수치해 (200~300회 반복)':'해석해'},
          {lb:'③ 결과',fm:lbl,rs:disp}]))+
      F.card('기간별 잔액 추이',`<div id="tvChart"></div>`+
        F.tbl(['기간','이자','잔액'],rows.slice(0,24).map(r=>[r.k,U.fmt(r.int,6),U.fmt(r.bal,8)])),'tvVis',true)+
      F.prov('procedure=fin.tvm.'+solve+' · '+U.now()));
    V.plot('tvChart',{h:200,series:[{name:'잔액',data:rows.map(r=>[r.k,r.bal])}],
      xlabel:'기간',ylabel:'잔액',hlines:[{y:0,c:V.css('--fg3')}]});},

      F.card('요약',F.kv({'대출원금':U.fmt(P,10)+' 원','연이율':U.fmt(gn('lnR',4.5),4)+' %',
        '월이율':U.fmt(r*100,6)+' %','기간':gn('lnY',30)+'년 ('+n+'회)',
        '첫 회 납입':U.fmt(rows[0].pay,9)+' 원','마지막 회 납입':U.fmt(rows[rows.length-1].pay,9)+' 원',
        '총 이자':U.fmt(a.totalInterest,10)+' 원','총 상환액':U.fmt(a.total,10)+' 원',

        F.steps([
          {lb:'① 월이율 환산',fm:'i = 연이율/12 = '+U.fmt(gn('lnR',4.5),4)+'%/12',rs:U.fmt(r*100,6)+' %'},
          {lb:'② 원리금균등 상환액',fm:'PMT = P·i/(1−(1+i)⁻ⁿ)',rs:U.fmt(a.pmt,9)+' 원'},
          {lb:'③ 회차별 이자',fm:'이자 = 잔액 × i',rs:'1회차 '+U.fmt(rows[0].int,8)+' 원'},
          {lb:'④ 회차별 원금',fm:m==='equalPrincipal'?'원금 = P/n (고정)':'원금 = PMT − 이자',rs:U.fmt(rows[0].pr,8)+' 원'}]))+
      F.card('상환 스케줄 그래프',`<div id="lnChart"></div>`,'lnVis',true)+

      F.prov('procedure=fin.amort · '+U.now()));
    V.plot('lnChart',{h:240,series:[
      {name:'이자',data:rows.map(x=>[x.k,x.int])},

      {name:'잔액 (우측 축 아님)',data:rows.map(x=>[x.k,x.bal/50]),color:V.css('--fg3'),dash:[4,3]}],
      xlabel:'회차',ylabel:'금액',ymin:0,tight:true,forceLegend:true});},
  invest(){
    const cf=U.parseNums(gv('ivCF')),r=gn('ivR',10)/100;
    if(cf.length<2){set('ivOut',F.err('현금흐름을 2개 이상 입력하세요 (첫 값은 보통 음수).'));return;}
    const npv=FIN.npv(r,cf),irr=FIN.irr(cf),mirr=FIN.mirr(cf,r,r);
    let cum=0,pb=null;
    cf.forEach((c,i)=>{cum+=c;if(pb===null&&cum>=0)pb=i;});
    let dcum=0,dpb=null;
    cf.forEach((c,i)=>{dcum+=c/Math.pow(1+r,i);if(dpb===null&&dcum>=0)dpb=i;});
    const curve=U.seq(0,Math.max(0.5,(isFinite(irr)?irr*2:0.5)),120).map(x=>[x*100,FIN.npv(x,cf)]);
    set('ivOut',
      F.concl(`<b>투자 평가</b> — 할인율 ${U.fmt(r*100,4)}%<br>
        NPV = <span class="big">${U.fmt(npv,9)}</span> ${npv>0?'<span class="badge ok">투자 타당</span>':'<span class="badge bad">투자 부적합</span>'}<br>
        IRR = <b>${isFinite(irr)?U.fmt(irr*100,5)+' %':'해 없음'}</b>`)+
      F.card('평가 지표',F.kv({'순현재가치 NPV':U.fmt(npv,10),
        '내부수익률 IRR':isFinite(irr)?U.fmt(irr*100,6)+' %':'부호 변화 없음 — 해 없음',
        '수정내부수익률 MIRR':isFinite(mirr)?U.fmt(mirr*100,6)+' %':'—',
        '회수기간':pb!==null?pb+'기':'미회수',
        '할인회수기간':dpb!==null?dpb+'기':'미회수',
        '수익성지수 PI':U.fmt((npv-cf[0])/(-cf[0]),5),
        '총 현금유입':U.fmt(U.sum(cf.filter(c=>c>0)),9),
        '총 현금유출':U.fmt(U.sum(cf.filter(c=>c<0)),9)})+
        F.steps([
          {lb:'① NPV',fm:'Σ CFₜ/(1+r)ᵗ',rs:U.fmt(npv,9)},
          {lb:'② IRR',fm:'NPV(r) = 0 을 만족하는 r (이분법 300회)',rs:isFinite(irr)?U.fmt(irr*100,6)+' %':'—'},
          {lb:'③ 판정',fm:'NPV > 0 및 IRR > 할인율이면 타당',rs:npv>0&&irr>r?'투자 타당':'재검토 필요'}]))+
      F.card('NPV 프로파일 (할인율 민감도)',`<div id="ivChart"></div>
        <div class="note">곡선이 0을 가로지르는 지점이 IRR입니다. 현금흐름 부호가 여러 번 바뀌면 IRR이 복수 존재할 수 있습니다.</div>`,'ivVis',true)+
      F.prov('procedure=fin.npv+irr · '+U.now()));
    V.plot('ivChart',{h:240,series:[{name:'NPV',data:curve}],
      xlabel:'할인율 (%)',ylabel:'NPV',hlines:[{y:0,c:V.css('--bad')}],
      vlines:isFinite(irr)?[{x:irr*100,c:V.css('--ok'),label:'IRR'}]:[]});},

const RadUI={
  stdBadge(){return `<div class="badges">
    ${F.badge('권고판본 '+K.std,'info')}${F.badge('핵종데이터 '+NUC.ver,'info')}
    ${F.badge('감쇠데이터 NIST XCOM 계열(근사)','info')}</div>`;},
  /* --- 핵종 탐색기 --- */
  nucList(){
    const q=(gv('nucSearch')||'').trim().toLowerCase();
    const list=NUC.list().filter(id=>{
      if(!q)return true;const n=NUC.get(id);
      return id.toLowerCase().includes(q)||(n.use||'').toLowerCase().includes(q)||
        (n.mode||'').toLowerCase().includes(q);});
    set('nucList',F.tbl(['핵종','반감기','붕괴','주요 감마 (keV)','Γ','용도'],
      list.map(id=>{const n=NUC.get(id);
        return [`<span class="chip ${id===RadUI._sel?'on':''}" onclick="RadUI.nucPick('${id}')">${id}</span>`,
          Fmt.time(n.T),n.mode,(n.g||[]).slice(0,2).map(x=>U.fmt(x[0],6)).join(', ')||'—',
          n.G?U.fmt(n.G,3):'—',(n.use||'').slice(0,22)];})));},
  nucSearch(){RadUI.nucList();},
  nucPick(id){
    RadUI._sel=id;RadUI.nucList();
    const n=NUC.get(id),l=Math.LN2/n.T;
    const sa=l*6.02214076e23/n.M;
    const gtot=U.sum((n.g||[]).map(x=>x[1]))/100;
    // 붕괴계열
    let chain='';
    if(n.ch){chain=F.card('붕괴 계열',
      `<div>${id} ${n.ch.map(c=>`→ <b class="hl">${c.id}</b> (분기비 ${U.fmt(c.branch*100,4)}%, T½ ${NUC.get(c.id)?Fmt.time(NUC.get(c.id).T):'—'})`).join(' ')}</div>

    set('nucOut',
      F.concl(`<b>${id}</b> — Z=${n.Z}, A=${n.A} · ${n.mode} 붕괴 · T½ = <b>${Fmt.time(n.T)}</b>`)+

          {lb:'② 비방사능',fm:'a = λ·N_A/M = '+U.sci(l,4)+' × 6.022e23 / '+n.M,rs:U.sci(sa,7)+' Bq/g'},

        F.tbl(['에너지 (keV)','방출률 (%)','1 MBq당 방출 (/s)','비고'],

        `<div id="nucSpec" style="margin-top:10px"></div>`,'nucSpecC',true):'')+
      (n.dc?F.card('내부피폭 선량계수 (ICRP 68/72 계열 대표값)',
        F.tbl(['경로','선량계수 (Sv/Bq)','1 MBq 섭취 시 예탁유효선량','비고'],[
          ...(n.dc.inh?[['흡입',U.sci(n.dc.inh,4),Fmt.sv(n.dc.inh*1e6),
            '흡수유형 '+(n.dc.type||'—')+', AMAD 5 µm 가정']]:[]),
          ...(n.dc.ing?[['경구',U.sci(n.dc.ing,4),Fmt.sv(n.dc.ing*1e6),'f₁ 기본값']]:[])])+
        F.warn('선량계수는 <b>흡수유형(F/M/S)·AMAD·화학형</b>에 따라 수 배 이상 달라집니다. 실제 평가는 [내부피폭] 탭에서 조건을 명시하십시오.')):'')+
      chain+
      F.card('이 핵종으로 바로 계산',
        `<span class="chip" onclick="UI.sub('rad','decay');g('dcNuc').value='${id}';RadUI.decay()">붕괴 계산</span>

  /* --- 붕괴 --- */
  decay(){
    const id=gv('dcNuc'),n=NUC.get(id);
    if(!n){set('dcOut',F.err('핵종을 선택하세요.'));return;}
    const A0=gn('dcA0',100)*({Bq:1,kBq:1e3,MBq:1e6,GBq:1e9,TBq:1e12,Ci:3.7e10,mCi:3.7e7,µCi:3.7e4}[gv('dcAU')]||1);
    const t=gn('dcT',30)*({s:1,min:60,h:3600,d:86400,yr:31557600}[gv('dcTU')]||1);
    const r=RAD.decayFull(id,A0,t);
    const useChain=gc('dcChain')&&n.ch;
    let chainHTML='';
    const ts=U.seq(0,Math.max(t,n.T*4),200);
    let ser=[{name:id,data:ts.map(x=>[x/({s:1,min:60,h:3600,d:86400,yr:31557600}[gv('dcTU')]||1),A0*Math.exp(-Math.LN2/n.T*x)])}];
    if(useChain){
      const ids=[id].concat(n.ch.map(c=>c.id)).filter(x=>NUC.get(x));
      const lams=ids.map(x=>Math.LN2/NUC.get(x).T);
      const N0=[A0/lams[0]].concat(ids.slice(1).map(()=>0));
      const ch=RAD.chain(ids,lams,N0,ts);
      ser=ids.map((x,i)=>({name:x,data:ch.series.map(s=>
        [s.t/({s:1,min:60,h:3600,d:86400,yr:31557600}[gv('dcTU')]||1),s.A[i]])}));
      const last=ch.series[ch.series.length-1];
      chainHTML=F.card('연쇄붕괴 (Bateman)',
        F.tbl(['핵종','λ (s⁻¹)','T½','t 시점 방사능','모핵종 대비'],
          ids.map((x,i)=>[x,U.sci(lams[i],4),Fmt.time(NUC.get(x).T),
            Fmt.bq(ch.series.find(s=>s.t>=t)?ch.series.find(s=>s.t>=t).A[i]:last.A[i]),
            i?U.fmt((ch.series.find(s=>s.t>=t)||last).A[i]/Math.max(1e-30,(ch.series.find(s=>s.t>=t)||last).A[0]),5):'1']))+
        F.kv({'해법':ch.method==='analytic'?'해석해 (Bateman)':'행렬지수 (자동 전환)',
          '평형 상태':(()=>{const rt=NUC.get(ids[1]).T/n.T;
            return rt<0.01?'영년평형 (T_모 ≫ T_딸)':rt<1?'과도평형':'비평형';})(),
          '평형 도달 시간 (약 7×T½_딸)':Fmt.time(NUC.get(ids[1]).T*7)})+
        (ch.warn.length?F.warn(ch.warn.join('<br>')):'')+
        F.steps([
          {lb:'① 붕괴상수',fm:ids.map((x,i)=>`λ_${i+1}(${x}) = ${U.sci(lams[i],4)}`).join(' , '),rs:'s⁻¹'},
          {lb:'② Bateman 해',fm:'N_k(t) = Σᵢ N_i(0)·(∏λ)·Σₘ e^(−λₘt)/∏_{j≠m}(λ_j−λ_m)',rs:ch.method},
          {lb:'③ 수치 안정성 검사',fm:'|λᵢ−λⱼ|/max(λ) < 10⁻⁶ 이면 행렬지수로 전환',rs:ch.method==='analytic'?'해석해 사용 (안정)':'전환됨'},
          {lb:'④ 방사능 환산',fm:'A_k = λ_k · N_k',rs:ids.map((x,i)=>Fmt.bq((ch.series.find(s=>s.t>=t)||last).A[i])).join(' / ')}]));}
    const halfTable=[];
    for(let k=0;k<=8;k++)halfTable.push([k+' 반감기',Fmt.time(n.T*k),
      U.fmt(100/Math.pow(2,k),6)+' %',Fmt.bq(A0/Math.pow(2,k))]);
    set('dcOut',
      F.concl(`<b>${id}</b> 방사성 붕괴 — ${Fmt.time(t)} 경과 후<br>
        <span class="big">${Fmt.bq(r.A)}</span> 잔존 (초기의 <b>${U.fmt(r.A/A0*100,5)} %</b>, ${U.fmt(r.halfLives,4)} 반감기 경과)`)+
      RadUI.stdBadge()+
      F.card('붕괴 계산 결과',F.kv({
        '초기 방사능 A₀':Fmt.bq(A0)+'  ('+U.sci(A0/3.7e10,5)+' Ci)',
        '경과 시간':Fmt.time(t),'경과 반감기 수':U.fmt(r.halfLives,6),
        '잔존 방사능 A(t)':Fmt.bq(r.A)+'  ('+U.sci(r.A/3.7e10,5)+' Ci)',
        '잔존율':U.fmt(r.A/A0*100,6)+' %',
        '붕괴상수 λ':U.sci(r.l,6)+' s⁻¹','평균수명 τ':Fmt.time(r.tau),
        '현재 원자수 N':U.sci(r.N,6)+' 개',
        '해당 핵종 질량':U.sci(r.mass,6)+' g',
        '비방사능':U.sci(r.sa,6)+' Bq/g'})+F.steps(r.steps))+
      chainHTML+
      F.card('붕괴 곡선',`<div class="row"><label>축</label>
        <select id="dcLog" onchange="RadUI.decay()"><option value="0">선형</option><option value="1" selected>반로그 (직선이 됨)</option></select></div>
        <div id="dcChart"></div>
        <div class="note">반로그 축에서 단일 핵종의 붕괴는 <b>직선</b>이 됩니다. 기울기가 −λ/ln10 입니다.</div>`,'dcVis',true)+
      F.card('반감기 조견표',F.tbl(['경과','시간','잔존율','방사능'],halfTable))+
      F.card('추가 계산',
        `<div class="grid2">
          <div>${F.num('dcTarget','목표 방사능 (Bq)',1000)}
            <div class="btns">${F.btn('도달 시간 역산','RadUI.decayTime()','sec sm')}</div>
            <div id="dcTimeOut"></div></div>
          <div>${F.num('dcTb','생물학적 반감기 (일)',70)}
            <div class="btns">${F.btn('유효반감기 계산','RadUI.effHalf()','sec sm')}</div>
            <div id="dcEffOut"></div></div>
        </div>`)+
      F.prov(`procedure=rad.decay${useChain?'.chain':''} · nuclideData=${NUC.ver} · ${U.now()}`));
    V.plot('dcChart',{h:280,series:ser,ylog:gv('dcLog')==='1',
      xlabel:'시간 ('+gv('dcTU')+')',ylabel:'방사능 (Bq)',forceLegend:ser.length>1,
      vlines:[{x:t/({s:1,min:60,h:3600,d:86400,yr:31557600}[gv('dcTU')]||1),c:V.css('--ok'),label:'평가 시점'}]});
    Session.rec('rad.decay',{nuclide:id,A0,t},{A:r.A});},
  decayTime(){
    const id=gv('dcNuc'),n=NUC.get(id);
    const A0=gn('dcA0',100)*({Bq:1,kBq:1e3,MBq:1e6,GBq:1e9,TBq:1e12,Ci:3.7e10,mCi:3.7e7,µCi:3.7e4}[gv('dcAU')]||1);
    const tgt=gn('dcTarget',1000);
    if(tgt>=A0){set('dcTimeOut',F.warn('목표가 초기값 이상입니다.'));return;}
    const l=Math.LN2/n.T,t=Math.log(A0/tgt)/l;
    set('dcTimeOut',F.kv({'도달 시간':Fmt.time(t),'반감기 수':U.fmt(t/n.T,5)})+
      F.steps([{lb:'역산',fm:'t = ln(A₀/A)/λ = ln('+U.sci(A0/tgt,4)+')/'+U.sci(l,4),rs:Fmt.time(t)}]));},
  effHalf(){
    const id=gv('dcNuc'),n=NUC.get(id);
    const Tp=n.T/86400,Tb=gn('dcTb',70);
    const Te=RAD.effHalf(Tp,Tb);
    set('dcEffOut',F.kv({'물리적 반감기 T_p':U.fmt(Tp,6)+' 일',
      '생물학적 반감기 T_b':U.fmt(Tb,6)+' 일','유효반감기 T_eff':U.fmt(Te,6)+' 일',
      '지배 인자':Tp<Tb?'물리적 붕괴':'생물학적 배설'})+
      F.steps([{lb:'유효반감기',fm:'1/T_eff = 1/T_p + 1/T_b = 1/'+U.fmt(Tp,5)+' + 1/'+Tb,rs:U.fmt(Te,6)+' 일'}]));},
  activation(){
    const flux=gn('acFlux',1e13),sig=gn('acSig',37),N=gn('acN',1e22);
    const id=gv('acNuc'),n=NUC.get(id);
    const ti=gn('acTi',24)*3600,tc=gn('acTc',0)*3600;
    const r=RAD.activation(flux,sig,N,n.T,ti,tc);
    const ts=U.seq(0,ti*1.5,200);
    set('acOut',
      F.concl(`<b>${id} 중성자 방사화</b><br>
        생성 방사능 <span class="big">${Fmt.bq(r.A)}</span> (포화값의 ${U.fmt(r.sat*100,5)}%)`)+
      F.card('결과',F.kv({'생성률 R = φσN':U.sci(r.R,6)+' /s',
        '포화 방사능 A_sat':Fmt.bq(r.Asat),'포화계수 (1−e^(−λt_irr))':U.fmt(r.sat,6),
        '조사 종료 시':Fmt.bq(r.Asat*r.sat),'냉각 후':Fmt.bq(r.A),
        '반감기':Fmt.time(n.T),'포화 도달 (7 T½)':Fmt.time(n.T*7)})+F.steps(r.steps))+
      F.card('방사화 성장 곡선',`<div id="acChart"></div>
        <div class="note">조사시간이 반감기의 약 7배면 포화(99% 이상)에 도달하며, 그 이상 조사해도 방사능이 늘지 않습니다.</div>`,'acVis',true)+
      F.prov('procedure=rad.activation · '+U.now()));
    V.plot('acChart',{h:250,series:[
      {name:'생성 방사능',data:ts.map(x=>[x/3600,r.Asat*(1-Math.exp(-r.l*x))])},
      {name:'포화값',data:[[0,r.Asat],[ti*1.5/3600,r.Asat]],color:V.css('--bad'),dash:[5,3]}],
      xlabel:'조사시간 (h)',ylabel:'방사능 (Bq)',ymin:0,tight:true,forceLegend:true,
      vlines:[{x:ti/3600,c:V.css('--ok'),label:'조사 종료'}]});},
  /* --- 계수통계 --- */
  counting(){
    const Ns=gn('ctNs',1250),ts=gn('ctTs',600),Nb=gn('ctNb',180),tb=gn('ctTb',600);
    const tau=gn('ctTau',5)*1e-6,model=gv('ctModel');
    const c=RAD.counting(Ns,ts,Nb,tb);
    const dt=RAD.deadtime(c.rs,tau,model);
    const eff=gn('ctEff',0.15),br=gn('ctBr',0.851),mass=gn('ctM',1);
    const act=RAD.activity(c.rn,eff,br,mass,1,1,1);
    set('ctOut',
      F.concl(`<b>계수 통계</b> — 순계수율 <span class="big">${U.fmt(c.rn,6)}</span> cps
        ± ${U.fmt(c.urn,4)} (${U.fmt(c.rel,4)} %)<br>
        방사능 농도 <b>${U.fmt(act.A,6)}</b> Bq/단위`)+
      F.card('계수율 분석',F.kv({
        '시료 총계수':Ns+' counts / '+ts+' s','시료 계수율':U.fmt(c.rs,7)+' ± '+U.fmt(c.urs,5)+' cps',
        '배경 총계수':Nb+' counts / '+tb+' s','배경 계수율':U.fmt(c.rb,7)+' ± '+U.fmt(c.urb,5)+' cps',
        '순계수율 r_n':U.fmt(c.rn,7)+' cps','순계수율 불확도':'± '+U.fmt(c.urn,6)+' cps',
        '상대 불확도':U.fmt(c.rel,5)+' %',
        '최적 시간분배 t_s:t_b':U.fmt(c.optRatio,5)+' : 1',
        '우수도 FOM (r_n²/r_b)':U.fmt(c.fom,5)})+F.steps(c.steps))+
      F.card('사시간 보정',F.kv({'모형':dt.model,'사시간 τ':U.fmt(tau*1e6,5)+' µs',
        '관측 계수율 m':U.fmt(c.rs,7)+' cps','진 계수율 n':U.fmt(dt.n,7)+' cps',
        '계수 손실':U.fmt(dt.loss,5)+' %','보정계수':U.fmt(dt.n/c.rs,6)})+
        (dt.warn&&dt.warn.length?F.warn(dt.warn.join('<br>')):'')+
        F.steps([
          {lb:'① 모형 선택',fm:model==='paralyzable'?'마비형: m = n·e^(−nτ)':'비마비형: n = m/(1−mτ)',rs:dt.model},
          {lb:'② 보정',fm:model==='paralyzable'?'Newton 반복으로 n 역산':U.fmt(c.rs,6)+'/(1−'+U.fmt(c.rs,5)+'×'+U.sci(tau,4)+')',rs:U.fmt(dt.n,7)+' cps'},
          {lb:'③ 손실률',fm:'(n−m)/n',rs:U.fmt(dt.loss,5)+' %'}])+
        `<div id="ctDT" style="margin-top:10px"></div>`)+
      F.card('방사능 환산',F.kv({'계수효율 ε':U.fmt(eff,5),'감마 방출률 p_γ':U.fmt(br,5),
        '시료량 m':U.fmt(mass,5),'분모 (ε·p_γ·m)':U.fmt(act.den,7),
        '방사능 농도':U.fmt(act.A,7)+' Bq/단위',
        '불확도 (계수만)':'± '+U.fmt(c.urn/act.den,6)})+
        F.steps([{lb:'환산',fm:'A = r_n/(ε·p_γ·m·f_decay·f_self·f_coin)',rs:U.fmt(act.A,7)}])+
        F.warn('위 불확도는 <b>계수 통계만</b> 반영한 것입니다. 효율·방출률·시료량의 불확도까지 합성하려면 [공학계산기 → 불확도(GUM)]를 사용하십시오.'))+
      F.card('계수 통계의 의미 (포아송)',`<div id="ctPois"></div>
        <div class="note">방사성 붕괴는 포아송 과정이므로 계수 N의 표준편차는 √N입니다.
        따라서 <b>계수를 4배로 늘리면 상대오차는 절반</b>이 됩니다.</div>`,'ctPoisC',true)+
      F.prov('procedure=rad.counting · '+U.now()));
    // 사시간 곡선
    const ms=U.seq(0,Math.min(1/tau*0.5,5e5),200);

        ['검출한계 L_D',U.fmt(r.currie.Ld,6)+' counts',U.fmt(r.currie.mdaRate,6)+' cps',

        ['계수율 (cps)',U.fmt(r.currie.mdaRate,7),U.fmt(r.iso.dlRate,7),

      F.card('적용 가정 (반드시 함께 보고)',F.kv({
        '유의수준 α':al+'  (k = '+U.fmt(r.ka,5)+')',

  dose(){

    if(!n||!n.G){set('rdsOut',F.err('감마 선량률상수가 정의된 핵종을 선택하세요 (Co-60, Cs-137, I-131, Ir-192 등).'));return;}

    const r0=RAD.pointDose(A,n.G,d);
    const sh=RAD.shield(r0,mat,E,th,gc('dsBU'));

      F.card('차폐 설계 (목표 선량률 역산)',
        `${F.num('dsTgt','목표 선량률 (µSv/h)',2.5)}

         <div id="tdcOut" style="margin-top:8px"></div>`)+
      F.prov(`procedure=dose.ext.point+shield · buildup=${gc('dsBU')?'Berger근사':'미적용'} · nuclideData=${NUC.ver} · ${U.now()}`));

      {name:'빌드업 포함',data:ths.map(x=>[x,RAD.shield(r0,mat,E,x,true).rate])},

  tdc(){
    const id=gv('dsNuc'),n=NUC.get(id);
    const A=gn('dsA',37)*({MBq:1,GBq:1e3,TBq:1e6,Ci:3.7e4,mCi:37}[gv('dsAU')]||1);
    const E=gn('dsE',0)||1,mat=gv('dsMat');
    const t=gn('tdcT',30)/60,d=gn('tdcD',0.5),th=gn('tdcTh',0);
    const r0=RAD.pointDose(A,n.G,d);
    const sh=RAD.shield(r0,mat,E,th,gc('dsBU'));
    const dose=sh.rate*t;
    const lim=20000; // 연간 20 mSv = 20000 µSv
    const opts=[
      {n:'현재 조건',t,d,th,dose},
      {n:'시간 절반',t:t/2,d,th,dose:dose/2},
      {n:'거리 2배',t,d:d*2,th,dose:RAD.shield(RAD.pointDose(A,n.G,d*2),mat,E,th,gc('dsBU')).rate*t},
      {n:'차폐 +1 HVL',t,d,th:th+sh.hvl,dose:RAD.shield(r0,mat,E,th+sh.hvl,gc('dsBU')).rate*t},
      {n:'거리 2배 + 시간 절반',t:t/2,d:d*2,th,dose:RAD.shield(RAD.pointDose(A,n.G,d*2),mat,E,th,gc('dsBU')).rate*t/2}];
    set('tdcOut',
      F.concl(`작업 누적선량 = <span class="big">${U.fmt(dose,6)}</span> µSv (${U.fmt(dose/1000,6)} mSv)<br>
        연간 관리목표 20 mSv 대비 <b>${U.fmt(dose/lim*100,5)} %</b>`)+
      F.tbl(['방호 조합','시간 (분)','거리 (m)','차폐 (cm)','누적선량 (µSv)','저감률'],
        opts.map(o=>[o.n,U.fmt(o.t*60,4),U.fmt(o.d,4),U.fmt(o.th,4),U.fmt(o.dose,6),
          o.dose===dose?'기준':U.fmt((1-o.dose/dose)*100,4)+' %']))+
      `<div class="note"><b>ALARA 3원칙</b>: 시간은 선형(½ → ½), 거리는 역제곱(2배 → ¼), 차폐는 지수(1 HVL → ½)로 작용합니다.
       거리 확보가 가장 비용 효율적인 경우가 많습니다.</div>`);}

  internal(){

      set('inOut',F.err('해당 핵종·경로의 선량계수가 데이터에 없습니다. Cs-137, Sr-90, I-131, Co-60, Pu-239, Am-241, H-3 등을 선택하세요.'));return;}

    const E=RAD.committed(I,coef);
    // 생체동역학 간이 모형

        F.steps([
          {lb:'① 선량계수 조회',fm:`e(g) [${route==='inh'?'흡입':'경구'}, ${id}]`,rs:U.sci(coef,6)+' Sv/Bq'},
          {lb:'② 예탁유효선량',fm:'E(50) = e(g) × I = '+U.sci(coef,5)+' × '+U.sci(I,5),rs:U.sci(E,6)+' Sv = '+Fmt.sv(E)},

      F.card('반감기 관계',F.kv({
        '물리적 반감기 T_p':Fmt.time(Tp),
        '생물학적 반감기 T_b':U.fmt(gn('inTb',70),5)+' 일',

      {name:'전신 잔류',data:rows.map(r=>[r.t/86400,r.body])},

      xlabel:'시간 (일)',ylabel:'방사능 (Bq)',ymin:0,tight:true,forceLegend:true});
    V.svg('inDiag',`

  bioassay(){
    const id=gv('inNuc'),n=NUC.get(id);
    const meas=gv('inBio').trim().split('\n').filter(l=>l.trim())
      .map(l=>{const p=U.parseNums(l);return {t:p[0],v:p[1]};}).filter(m=>isFinite(m.t)&&isFinite(m.v));
    if(meas.length<1){set('inBioOut',F.err('측정값을 입력하세요.'));return;}
    const Tb=gn('inTb',70),Te=RAD.effHalf(n.T/86400,Tb);
    const ret=t=>Math.exp(-Math.LN2/Te*t);
    const r=RAD.bioassayToIntake(meas,ret);
    const coef=n.dc?(n.dc.inh||n.dc.ing):null;
    set('inBioOut',
      F.concl(`추정 섭취량 I = <span class="big">${Fmt.bq(r.intake)}</span>
        ${coef?`<br>→ 예탁유효선량 ${Fmt.sv(r.intake*coef)}`:''}`)+
      F.tbl(['측정 시점 (일)','관측 잔류 (Bq)','모형 적합 (Bq)','잔차','잔차 %'],
        r.residuals.map(x=>[U.fmt(x.t,4),U.sci(x.obs,5),U.sci(x.fit,5),U.sci(x.resid,4),
          U.fmt(x.resid/x.obs*100,4)]))+
      F.kv({'추정 섭취량':Fmt.bq(r.intake),
        '표준오차':isFinite(r.se)?Fmt.bq(r.se):'—',
        '95% CI':isFinite(r.se)?`[${Fmt.bq(Math.max(0,r.ci[0]))}, ${Fmt.bq(r.ci[1])}]`:'—',
        '사용 잔류함수':'단일 지수 e^(−ln2·t/T_eff), T_eff = '+U.fmt(Te,5)+' 일'})+
      F.steps([
        {lb:'① 잔류함수 가정',fm:'m(t) = exp(−ln2·t/T_eff)',rs:'T_eff = '+U.fmt(Te,5)+' 일'},
        {lb:'② 최소제곱 역산',fm:'I = Σ[mᵢ·r(tᵢ)] / Σ[r(tᵢ)²]',rs:Fmt.bq(r.intake)},
        {lb:'③ 예탁선량',fm:coef?'E(50) = I × e(g)':'선량계수 없음',rs:coef?Fmt.sv(r.intake*coef):'—'}])+
      F.warn('실제 ICRP 잔류함수는 <b>다중 지수 합</b> 형태이며 섭취 경로·화학형에 따라 다릅니다. 본 계산은 단일 지수 근사입니다.'));},

        {x:300,c:V.css('--bad'),label:'300'}],

  plume(){
    const Q=gn('plQ',1e9),u=gn('plU',3),H=gn('plH',50),cls=gv('plCls');
    const id=gv('plNuc'),n=NUC.get(id);
    const lam=gc('plDecay')&&n?Math.LN2/n.T:0;
    const xs=U.seq(50,gn('plXmax',5000),150);
    const ground=xs.map(x=>[x,RAD.plume(Q,u,H,x,0,0,cls,lam).C]);
    const maxP=ground.reduce((a,b)=>b[1]>a[1]?b:a,ground[0]);
    // 2D 격자
    const nx=90,ny=50,xm=gn('plXmax',5000);
    const grid=[];
    for(let j=0;j<ny;j++){const row=[];const y=(j-ny/2)/(ny/2)*xm*0.3;
      for(let i=0;i<nx;i++){const x=50+(i/nx)*xm;
        row.push(RAD.plume(Q,u,H,x,y,0,cls,lam).C);}grid.push(row);}
    const sig=RAD.sigmas(maxP[0],cls);
    set('plOut',
      F.concl(`<b>가우시안 플룸 대기확산</b> — 안정도 ${cls}, 풍속 ${u} m/s, 유효고 ${H} m<br>
        지표 최대농도 <span class="big">${U.sci(maxP[1],5)}</span> Bq/m³ @ ${U.fmt(maxP[0],5)} m`)+
      F.card('결과',F.kv({'방출률 Q':U.sci(Q,6)+' Bq/s','풍속 u':U.fmt(u,4)+' m/s',
        '유효 방출고 H':U.fmt(H,5)+' m','대기안정도':cls+' ('+
          {A:'매우 불안정',B:'불안정',C:'약간 불안정',D:'중립',E:'약간 안정',F:'안정'}[cls]+')',
        '최대 지표농도':U.sci(maxP[1],6)+' Bq/m³','최대 지점 거리':U.fmt(maxP[0],6)+' m',
        '해당 지점 σ_y':U.fmt(sig.sy,5)+' m','해당 지점 σ_z':U.fmt(sig.sz,5)+' m',
        '방사성 붕괴 반영':lam?id+' (λ='+U.sci(lam,4)+' s⁻¹)':'미적용',
        '1000 m 지점 농도':U.sci(RAD.plume(Q,u,H,1000,0,0,cls,lam).C,5)+' Bq/m³'})+
        F.steps([
          {lb:'① 확산계수 (Briggs 개활지)',fm:'σ_y, σ_z = f(x, 안정도)',rs:'x='+U.fmt(maxP[0],5)+' m에서 '+U.fmt(sig.sy,4)+' / '+U.fmt(sig.sz,4)+' m'},
          {lb:'② 가우시안 플룸식',fm:'χ = Q/(2π·u·σ_y·σ_z)·exp(−y²/2σ_y²)·[exp(−(z−H)²/2σ_z²)+exp(−(z+H)²/2σ_z²)]',rs:'지표(z=0), 중심선(y=0)'},
          {lb:'③ 방사성 붕괴',fm:lam?'× exp(−λ·x/u)':'미적용',rs:lam?U.fmt(Math.exp(-lam*maxP[0]/u),6):'1'},
          {lb:'④ 최대 농도',fm:'수치 탐색',rs:U.sci(maxP[1],6)+' Bq/m³'}])+
        F.warn('σ 파라미터화(Briggs 개활지/도시, P–G 곡선)에 따라 결과가 <b>수 배</b> 달라집니다. 비교 시 동일 조건이 전제입니다 (설계서 §13.2).'))+
      F.card('지표 농도 분포 (중심선)',`<div id="plLine"></div>`,'plVis1',true)+
      F.card('평면 농도 분포 (로그 스케일)',`<div id="plHeat"></div>
        <div class="note">가로 = 풍하거리, 세로 = 횡방향. 안정도 F(안정)에서는 좁고 길게, A(불안정)에서는 넓고 짧게 퍼집니다.</div>`,'plVis2',true)+
      F.card('안정도별 비교',`<div id="plCmp"></div>`,'plVis3',true)+
      F.prov('procedure=env.plume.gauss · Briggs 개활지 σ · '+U.now()));
    V.plot('plLine',{h:230,series:[{name:'지표 농도',data:ground}],
      xlabel:'풍하 거리 (m)',ylabel:'농도 (Bq/m³)',ylog:true,
      vlines:[{x:maxP[0],c:V.css('--ok'),label:'최대'}]});
    V.heat('plHeat',grid,{h:280,log:true,xlabel:'풍하 거리 (m) →',
      xticks:[{p:0,l:'50'},{p:0.5,l:U.fmt(xm/2,4)},{p:1,l:U.fmt(xm,5)}],
      yticks:[{p:0,l:'+'+U.fmt(xm*0.3,4)+'m'},{p:0.5,l:'0'},{p:1,l:'−'+U.fmt(xm*0.3,4)+'m'}]});
    V.plot('plCmp',{h:230,series:['A','B','C','D','E','F'].map(c=>({
      name:c,data:xs.map(x=>[x,RAD.plume(Q,u,H,x,0,0,c,lam).C])})),
      xlabel:'풍하 거리 (m)',ylabel:'농도 (Bq/m³)',ylog:true,forceLegend:true});},

        ['자체처분 대상','0.04','0.4','규제해제 기준 참조']])+
        F.warn('구체적 수치는 시설 허가조건 및 원자력안전위원회 고시에 따릅니다. 위 표는 참고용입니다.')));},
  alara(){
    const ds=gn('alDose',0.5),cost=gn('alCost',20000000),alpha=gn('alAlpha',100000000);
    const r=RAD.alara(ds,cost,alpha);
    set('alOut',

        집단선량 저감 ${U.fmt(ds,5)} man·Sv, 대책 비용 ${U.fmt(cost,10)} 원<br>

        '선량 화폐가치 α':U.fmt(alpha,10)+' 원/man·Sv',

        F.steps([
          {lb:'① 편익 화폐 환산',fm:'저감선량 × α = '+U.fmt(ds,5)+' × '+U.sci(alpha,4),rs:U.fmt(r.benefit,9)+' 원'},

  pc(){
    const dose=gn('pcDose',0.1),err=gn('pcERR',0.5),B=gn('pcB',20000);
    const r=RAD.probCausation(dose,err,B,gv('pcSeed')||'pc',gn('pcGSD',1.8));
    const hist=(()=>{const b=40,mn=0,mx=Math.max(...r.dist),w=(mx-mn)/b,c=new Array(b).fill(0);
      r.dist.forEach(v=>{let i=Math.floor(v/w);if(i>=b)i=b-1;if(i<0)i=0;c[i]++;});
      return c.map((v,i)=>[w*(i+0.5)*100,v]);})();
    set('pcOut',
      F.concl(`<b>인과확률 (Probability of Causation)</b><br>
        점추정 PC = <span class="big">${U.fmt(r.PC*100,5)} %</span> (ERR = ${U.fmt(r.ERR,5)})<br>
        불확도 반영 상위 99% 신뢰상한 = <b>${U.fmt(r.p99*100,5)} %</b>`)+
      F.warn('<b>모형 가정이 결과를 지배합니다.</b> LNT 가정, DDREF 값, 전이모형(상대위험 vs 절대위험) 선택에 따라 PC가 크게 달라집니다. 본 시스템은 단일 값이 아니라 <b>불확도 분포와 백분위</b>를 함께 제시합니다 (설계서 §8.8 · RISK-13).')+
      F.card('결과',F.kv({'장기 선량 D':U.fmt(dose,5)+' Sv',
        '초과상대위험계수':U.fmt(err,5)+' /Sv','ERR = 계수 × D':U.fmt(r.ERR,6),
        'PC 점추정':U.fmt(r.PC*100,6)+' %',
        'PC 5 백분위':U.fmt(r.p05*100,5)+' %','PC 중앙값':U.fmt(r.p50*100,5)+' %',
        'PC 95 백분위':U.fmt(r.p95*100,5)+' %','PC 99 백분위 (보상 판정 관행)':U.fmt(r.p99*100,5)+' %',
        '몬테카를로 반복':B,'가정 GSD':gn('pcGSD',1.8),'시드':gv('pcSeed')||'pc'})+
        F.steps([
          {lb:'① 초과상대위험',fm:'ERR = β·D (성·피폭연령·발병연령 수정인자는 β에 반영 가정)',rs:U.fmt(r.ERR,6)},
          {lb:'② 인과확률',fm:'PC = ERR/(1+ERR)',rs:U.fmt(r.PC,6)+' = '+U.fmt(r.PC*100,5)+' %'},
          {lb:'③ 불확도 전파',fm:'β에 대수정규(GSD='+gn('pcGSD',1.8)+') 및 선량 불확도를 몬테카를로 '+B+'회 전파',rs:'분포 산출'},
          {lb:'④ 상위 백분위',fm:'보상 판정에서는 통상 상위 신뢰상한(예: 99%)을 사용',rs:U.fmt(r.p99*100,5)+' %'}]))+
      F.card('PC 불확도 분포',`<div id="pcChart"></div>
        <div class="note">세로선: 점추정(파랑), 99 백분위(빨강), 50% 판정 기준선(주황).</div>`,'pcVis',true)+
      F.card('선량–PC 관계',`<div id="pcCurve"></div>`,'pcVis2',true)+
      F.prov('procedure=rp.pc · model=ERR/(1+ERR) · seed='+(gv('pcSeed')||'pc')+' · '+U.now()));
    V.plot('pcChart',{h:230,series:[{name:'PC 분포',type:'bar',data:hist}],
      xlabel:'인과확률 PC (%)',ylabel:'빈도',ymin:0,tight:true,
      vlines:[{x:r.PC*100,c:V.css('--acc'),label:'점추정'},
        {x:r.p99*100,c:V.css('--bad'),label:'99%'},{x:50,c:V.css('--warn'),label:'50% 기준'}]});
    V.plot('pcCurve',{h:220,series:[
      {name:'PC (%)',data:U.seq(0.001,2,120).map(d=>[d,err*d/(1+err*d)*100])}],
      xlabel:'장기 선량 (Sv)',ylabel:'PC (%)',

const ElecUI={
  dc(){
    const o=EL.ohm({V:gv('dcV')===''?NaN:gn('dcV'),I:gv('dcI')===''?NaN:gn('dcI'),
      R:gv('dcR')===''?NaN:gn('dcR'),P:gv('dcP')===''?NaN:gn('dcP')});
    const rs=U.parseNums(gv('dcRs'));
    const ser=rs.length?EL.series(rs):null,par=rs.length?EL.parallel(rs):null;
    set('edcOut',
      F.concl(`<b>옴의 법칙</b> — V = ${U.fmt(o.V,7)} V, I = ${U.fmt(o.I,7)} A,
        R = ${U.fmt(o.R,7)} Ω, P = ${U.fmt(o.P,7)} W`)+
      F.card('4변수 상호계산',F.kv({'전압 V':U.fmt(o.V,8)+' V','전류 I':U.fmt(o.I,8)+' A',
        '저항 R':U.fmt(o.R,8)+' Ω','전력 P':U.fmt(o.P,8)+' W',
        '컨덕턴스 G':U.fmt(1/o.R,7)+' S','에너지 (1시간)':U.fmt(o.P/1000,7)+' kWh'})+
        F.steps([
          {lb:'① 옴의 법칙',fm:'V = I × R',rs:U.fmt(o.V,8)+' V'},
          {lb:'② 전력',fm:'P = V·I = I²R = V²/R',rs:U.fmt(o.P,8)+' W'},
          {lb:'③ 검산',fm:U.fmt(o.I,6)+'² × '+U.fmt(o.R,6),rs:U.fmt(o.I*o.I*o.R,8)+' W'}])+
        `<div id="dcVI" style="margin-top:8px"></div>`)+
      (rs.length?F.card('소자 합성',F.kv({
        '입력 소자':rs.map(v=>U.fmt(v,6)).join(', '),
        '직렬 합성':U.fmt(ser,8),'병렬 합성':U.fmt(par,8),
        '병렬/직렬 비':U.fmt(par/ser,6)})+
        F.steps([
          {lb:'직렬',fm:'R_s = ΣRᵢ = '+rs.map(v=>U.fmt(v,5)).join(' + '),rs:U.fmt(ser,8)},
          {lb:'병렬',fm:'1/R_p = Σ(1/Rᵢ)',rs:U.fmt(par,8)}])+
        `<div id="dcDiag" style="margin-top:8px"></div>`):'')+
      F.card('E-계열 최근접 표준값',(()=>{
        const t=EL.eSeries(o.R||1000,gv('dcE')||'E24');
        return F.kv({'계산 저항값':U.fmt(o.R,7)+' Ω',
          ['최근접 표준값 ('+(gv('dcE')||'E24')+')']:U.fmt(t.value,7)+' Ω',
          '오차':U.fmt(t.err,4)+' %'});})()+
        F.sel('dcE','계열',[['E6','E6 (±20%)'],['E12','E12 (±10%)'],['E24','E24 (±5%)',1]],null,'ElecUI.dc()'))+
      F.prov('procedure=elec.ohm · '+U.now()));
    V.plot('dcVI',{h:180,series:[{name:'I–V 특성',data:U.seq(0,o.V*1.5||10,60).map(v=>[v,v/o.R])}],
      xlabel:'전압 V (V)',ylabel:'전류 I (A)',
      vlines:[{x:o.V,c:V.css('--ok'),label:'동작점'}]});
    if(rs.length){
      const w=520/Math.max(3,rs.length);
      V.svg('dcDiag',
        `<text class="lb" x="20" y="24">직렬</text>`+
        rs.map((r,i)=>`<rect x="${60+i*w}" y="12" width="${w*0.6}" height="22" fill="var(--bg3)" stroke="var(--elec)"/>
          <text x="${60+i*w+w*0.3}" y="27" text-anchor="middle">${U.fmt(r,4)}Ω</text>
          ${i<rs.length-1?`<line x1="${60+i*w+w*0.6}" y1="23" x2="${60+(i+1)*w}" y2="23" stroke="var(--elec)" stroke-width="2"/>`:''}`).join('')+
        `<text x="600" y="27" class="lb">= ${U.fmt(ser,5)}Ω</text>
         <text class="lb" x="20" y="80">병렬</text>`+
        rs.map((r,i)=>`<rect x="${200}" y="${58+i*26}" width="90" height="20" fill="var(--bg3)" stroke="var(--elec)"/>
          <text x="245" y="${72+i*26}" text-anchor="middle">${U.fmt(r,4)}Ω</text>
          <line x1="150" y1="${68+i*26}" x2="200" y2="${68+i*26}" stroke="var(--elec)"/>
          <line x1="290" y1="${68+i*26}" x2="340" y2="${68+i*26}" stroke="var(--elec)"/>`).join('')+
        `<line x1="150" y1="68" x2="150" y2="${68+(rs.length-1)*26}" stroke="var(--elec)" stroke-width="2"/>
         <line x1="340" y1="68" x2="340" y2="${68+(rs.length-1)*26}" stroke="var(--elec)" stroke-width="2"/>
         <text x="420" y="${72+(rs.length-1)*13}" class="lb">= ${U.fmt(par,5)}Ω</text>`,
        `0 0 700 ${100+rs.length*26}`);}},
  ac(){
    const R=gn('acR',100),L=gn('acL',10)/1000,Cc=gn('acC',10)/1e6,f=gn('acF',60);
    const z=EL.Z(R,L,Cc,f);
    const res=EL.resonance(L,Cc,R);
    const V0=gn('acV',220);
    const I=V0/z.mag,phi=-z.phase*Math.PI/180;
    const pw=EL.power(V0,I,-phi);
    const fs=U.seq(Math.max(1,res.f0/100),res.f0*100,300);
    set('eacOut',
      F.concl(`<b>RLC 직렬 회로</b> @ ${f} Hz — 임피던스 Z = ${C.str(z.z,5)} Ω<br>
        |Z| = <span class="big">${U.fmt(z.mag,6)}</span> Ω, 위상 ${U.fmt(z.phase,5)}° (<b>${z.type}</b>)`)+
      F.card('임피던스',F.kv({'저항 R':U.fmt(R,6)+' Ω',
        '유도리액턴스 X_L = 2πfL':U.fmt(z.XL,7)+' Ω',
        '용량리액턴스 X_C = 1/(2πfC)':U.fmt(z.XC,7)+' Ω',
        '순 리액턴스 X':U.fmt(z.XL-z.XC,7)+' Ω',
        '임피던스 Z':C.str(z.z,6)+' Ω','크기 |Z|':U.fmt(z.mag,7)+' Ω',
        '위상각 θ':U.fmt(z.phase,6)+'°','회로 성격':z.type})+
        F.steps([
          {lb:'① 각주파수',fm:'ω = 2πf = 2π×'+f,rs:U.fmt(z.w,7)+' rad/s'},
          {lb:'② 유도리액턴스',fm:'X_L = ωL = '+U.fmt(z.w,5)+'×'+U.sci(L,4),rs:U.fmt(z.XL,7)+' Ω'},
          {lb:'③ 용량리액턴스',fm:'X_C = 1/(ωC) = 1/('+U.fmt(z.w,5)+'×'+U.sci(Cc,4)+')',rs:U.fmt(z.XC,7)+' Ω'},
          {lb:'④ 복소 임피던스',fm:'Z = R + j(X_L − X_C)',rs:C.str(z.z,6)+' Ω'},
          {lb:'⑤ 크기·위상',fm:'|Z| = √(R²+X²), θ = atan(X/R)',rs:U.fmt(z.mag,6)+' Ω ∠ '+U.fmt(z.phase,5)+'°'}]))+
      F.card('전력',F.kv({'인가전압 V':U.fmt(V0,6)+' V','전류 I = V/|Z|':U.fmt(I,7)+' A',
        '유효전력 P':U.fmt(pw.P,7)+' W','무효전력 Q':U.fmt(pw.Q,7)+' var',
        '피상전력 S':U.fmt(pw.S,7)+' VA','역률 cos θ':U.fmt(pw.pf,6),
        '역률 성격':z.XL>z.XC?'지상 (유도성)':'진상 (용량성)'})+
        `<div id="acPh" style="margin-top:8px"></div>`)+
      F.card('공진',F.kv({'공진주파수 f₀':U.fmt(res.f0,7)+' Hz',
        '특성 임피던스 √(L/C)':U.fmt(res.Z0,7)+' Ω',
        '선택도 Q (직렬)':U.fmt(res.Qseries,6),'대역폭 BW = f₀/Q':U.fmt(res.BW,7)+' Hz',
        '현재 주파수/f₀':U.fmt(f/res.f0,6)})+
        F.steps([
          {lb:'공진 조건',fm:'X_L = X_C → ωL = 1/(ωC)',rs:'f₀ = 1/(2π√(LC)) = '+U.fmt(res.f0,7)+' Hz'},
          {lb:'선택도',fm:'Q = ωL/R = 2πf₀L/R',rs:U.fmt(res.Qseries,6)}])+
        `<div id="acRes" style="margin-top:8px"></div>`)+
      F.card('역률 개선',
        `${F.num('acPf','목표 역률',0.95,'pf',null,0.01)}
         <div class="btns">${F.btn('콘덴서 용량 계산','ElecUI.pf()','sec sm')}</div>
         <div id="acPfOut" style="margin-top:8px"></div>`)+
      F.prov('procedure=elec.ac · '+U.now()));
    V.phasor('acPh',[{name:'R',re:R,im:0,color:V.css('--elec')},
      {name:'X_L',re:0,im:z.XL,color:V.css('--acc')},
      {name:'X_C',re:0,im:-z.XC,color:V.css('--fin')},
      {name:'Z',re:z.z.re,im:z.z.im,color:V.css('--warn')}],{h:260});
    V.plot('acRes',{h:220,series:[
      {name:'|Z| (Ω)',data:fs.map(x=>[x,EL.Z(R,L,Cc,x).mag])},
      {name:'전류 (A)×100',data:fs.map(x=>[x,V0/EL.Z(R,L,Cc,x).mag*100])}],
      xlog:true,ylog:true,xlabel:'주파수 (Hz)',ylabel:'값',forceLegend:true,
      vlines:[{x:res.f0,c:V.css('--ok'),label:'f₀'},{x:f,c:V.css('--warn'),label:'현재'}]});},
  pf(){
    const R=gn('acR',100),L=gn('acL',10)/1000,Cc=gn('acC',10)/1e6,f=gn('acF',60),V0=gn('acV',220);
    const z=EL.Z(R,L,Cc,f),I=V0/z.mag;
    const pf1=Math.cos(-z.phase*Math.PI/180),pf2=gn('acPf',0.95);

    const pt=gn('rfPt',20),gt=gn('rfGt',6),gr=gn('rfGr',6),ls=gn('rfLs',2);
    const fspl=EL.fspl(d,f);
    const rx=EL.linkBudget(pt,gt,gr,ls,fspl);
    const vswr=gn('rfVswr',1.5),gam=EL.gammaFromVswr(vswr);
    set('rfOut',
      F.concl(`<b>링크 버짓</b> — 수신 전력 <span class="big">${U.fmt(rx,5)}</span> dBm
        (${U.sci(EL.dB.dBmToW(rx),4)} W)<br>자유공간 손실 ${U.fmt(fspl,5)} dB @ ${U.fmt(f/1e9,4)} GHz, ${U.fmt(d,6)} m`)+
      F.card('링크 버짓',F.kv({'송신출력 P_t':U.fmt(pt,5)+' dBm ('+U.fmt(EL.dB.dBmToW(pt)*1000,5)+' mW)',
        '송신 안테나 이득':U.fmt(gt,4)+' dBi','수신 안테나 이득':U.fmt(gr,4)+' dBi',
        '급전·기타 손실':U.fmt(ls,4)+' dB','자유공간 손실 FSPL':U.fmt(fspl,6)+' dB',
        '수신 전력 P_r':U.fmt(rx,6)+' dBm','수신 전력 (W)':U.sci(EL.dB.dBmToW(rx),5)+' W',
        '수신 전압 (50Ω)':U.sci(EL.dB.dBmToV(rx,50),5)+' V',
        'dBµV 환산':U.fmt(EL.dB.dBuV(EL.dB.dBmToV(rx,50)),5)+' dBµV'})+
        F.steps([
          {lb:'① 자유공간 손실',fm:'FSPL = 20log₁₀(d) + 20log₁₀(f) − 147.55',rs:U.fmt(fspl,6)+' dB'},
          {lb:'② 링크 버짓',fm:'P_r = P_t + G_t + G_r − L − FSPL',rs:U.fmt(rx,6)+' dBm'},
          {lb:'③ 전력 환산',fm:'P(W) = 10^(dBm/10)/1000',rs:U.sci(EL.dB.dBmToW(rx),5)+' W'}]))+
      F.card('정재파비 (VSWR)',F.kv({'VSWR':U.fmt(vswr,5),
        '반사계수 |Γ| = (S−1)/(S+1)':U.fmt(gam,6),
        '반사손실 RL':U.fmt(EL.returnLoss(gam),5)+' dB',
        '반사 전력 비율':U.fmt(gam*gam*100,5)+' %',
        '전송 전력 비율':U.fmt((1-gam*gam)*100,5)+' %',
        '정합 손실':U.fmt(-10*Math.log10(1-gam*gam),5)+' dB'}))+
      F.card('dB 단위 환산표',F.tbl(['dB 값','전력비','전압비','의미'],
        [0,1,3,6,10,20,30,-3,-10,-20].map(x=>[x+' dB',U.fmt(Math.pow(10,x/10),6),
          U.fmt(Math.pow(10,x/20),6),
          x===3?'2배 (전력)':x===0?'변화 없음':x===-3?'절반 (전력)':x===10?'10배':x===20?'100배':''])))+
      F.card('거리에 따른 수신 전력',`<div id="rfChart"></div>`,'rfVis',true)+
      F.prov('procedure=elec.rf · '+U.now()));
    V.plot('rfChart',{h:230,series:[
      {name:'수신 전력 (dBm)',data:U.seq(1,10000,200).map(x=>
        [x,EL.linkBudget(pt,gt,gr,ls,EL.fspl(x,f))])}],
      xlog:true,xlabel:'거리 (m)',ylabel:'수신 전력 (dBm)',
      vlines:[{x:d,c:V.css('--ok'),label:'현재'}],
      hlines:[{y:-90,c:V.css('--bad'),label:'수신 감도 예시 −90 dBm'}]});}
};

const LearnUI={
  cur:'invsq',
  sims:{
    invsq:{n:'역제곱 법칙',ic:'📉',d:'거리가 2배가 되면 왜 선량이 1/4이 될까?',
      html:()=>`${F.rng('lsD','거리 (m)',2,0.5,10,0.1)}${F.rng('lsA','선원 세기 (상대)',100,10,200,1)}`,
      run(){
        const d=gn('lsD',2),A=gn('lsA',100);
        const I=A/(d*d);
        set('lnOut2',
          F.concl(`거리 ${U.fmt(d,4)} m에서의 세기 = <span class="big">${U.fmt(I,5)}</span> (상대값)<br>
            거리를 2배(${U.fmt(d*2,4)} m)로 하면 ${U.fmt(A/(4*d*d),5)} — <b>1/4</b>로 감소`)+
          F.card('왜 그럴까? — 직관적 설명',`
            <p>선원에서 나온 방사선은 <b>구 표면 전체로 퍼집니다.</b> 구의 표면적은 4πr²이므로,
            거리가 2배가 되면 같은 양의 방사선이 <b>4배 넓은 면적</b>에 퍼지게 됩니다.
            따라서 단위면적당 세기는 1/4이 됩니다.</p>
            <div id="lsSVG"></div>
            <div class="note">이것이 방사선 방호 3원칙 중 <b>"거리"</b>가 가장 효과적인 이유입니다.
            차폐물 없이 뒤로 몇 걸음만 물러나도 선량이 급격히 줄어듭니다.</div>`)+
          F.card('거리–세기 곡선',`<div id="lsChart"></div>`,'lsVis',true)+
          F.card('실무 적용',F.tbl(['거리 배수','세기','예: 100 µSv/h 선원'],
            [1,2,3,5,10].map(k=>[k+' 배',`1/${k*k}`,U.fmt(100/(k*k),5)+' µSv/h']))));
        const cols=[V.css('--rad'),V.css('--acc'),V.css('--ok')];
        V.svg('lsSVG',[1,2,3].map((k,i)=>`
          <circle cx="30" cy="100" r="${k*52}" fill="none" stroke="${cols[i]}"
            stroke-width="1.5" stroke-dasharray="4,3"/>
          <text x="${30+k*52-10}" y="${100+18}" fill="${cols[i]}" font-size="11">${k}r</text>
          <rect x="${230+i*90}" y="${76}" width="46" height="46" rx="4"
            fill="${cols[i]}" opacity="${1/(k*k)}" stroke="${cols[i]}" stroke-width="1"/>
          <text x="${253+i*90}" y="${68}" text-anchor="middle" font-size="11" fill="${cols[i]}">${k}r 거리</text>
          <text x="${253+i*90}" y="${140}" text-anchor="middle" font-size="12">1/${k*k}</text>
          <text x="${253+i*90}" y="${157}" text-anchor="middle" font-size="10">${U.fmt(100/(k*k),4)}%</text>`).join('')+
          `<circle cx="30" cy="100" r="8" fill="var(--rad)"/>
           <text class="lb" x="46" y="34" text-anchor="start">선원</text>
           <text x="290" y="182" text-anchor="middle">같은 방사선이 넓은 면적에 퍼짐 → 단위면적당 세기 감소</text>`,
          '0 20 530 175');
        V.plot('lsChart',{h:230,series:[
          {name:'세기 ∝ 1/d²',data:U.seq(0.3,10,200).map(x=>[x,A/(x*x)])}],
          xlabel:'거리 (m)',ylabel:'상대 세기',ylog:true,
          vlines:[{x:d,c:V.css('--ok'),label:'현재'},{x:d*2,c:V.css('--warn'),label:'2배 거리'}]});}},
    decay:{n:'방사성 붕괴',ic:'☢️',d:'반감기란 무엇인가? 절반씩 줄어드는 과정 시각화',
      html:()=>`${F.rng('lgT','반감기 (일)',10,1,60,1)}${F.rng('lgD','경과 일수',30,0,180,1)}
        ${F.rng('lgN','초기 원자 수 (×1000)',1000,10,5000,10)}`,
      run(){
        const T=gn('lgT',10),t=gn('lgD',30),N0=gn('lgN',1000)*1000;
        const N=N0*Math.exp(-Math.LN2/T*t);
        const hl=t/T;
        set('lnOut2',
          F.concl(`반감기 ${T}일 · ${t}일 경과 = <b>${U.fmt(hl,4)} 반감기</b><br>
            남은 원자 수 <span class="big">${U.sci(N,5)}</span> (${U.fmt(N/N0*100,5)} %)`)+
          F.card('직관적 이해',`
            <p>방사성 원자는 <b>언제 붕괴할지 개별적으로는 알 수 없지만</b>, 많은 수가 모이면
            일정한 비율로 줄어듭니다. 반감기는 "절반이 되는 데 걸리는 시간"입니다.</p>
            <p>중요한 것은 <b>절반이 된 뒤에도 같은 반감기가 다시 적용된다</b>는 점입니다.
            즉 2번의 반감기가 지나면 0이 아니라 1/4이 남습니다.</p>
            <div id="lgSVG"></div>`)+
          F.card('붕괴 곡선 (선형 vs 반로그)',`<div id="lgChart"></div><div id="lgChart2" style="margin-top:6px"></div>
            <div class="note">반로그 축에서 <b>직선</b>이 되는 것이 지수붕괴의 특징입니다.</div>`,'lgVis',true)+
          F.card('반감기 표',F.tbl(['반감기 수','경과 시간 (일)','잔존율','남은 원자 수'],
            Array.from({length:9},(_,k)=>[k,U.fmt(k*T,5),U.fmt(100/Math.pow(2,k),6)+' %',U.sci(N0/Math.pow(2,k),5)]))));
        const boxes=[];
        for(let k=0;k<=4;k++){
          const frac=1/Math.pow(2,k);
          boxes.push(`<rect x="${20+k*110}" y="40" width="90" height="${Math.max(3,80*frac)}"
            y2="0" fill="var(--rad)" opacity="0.8"/>
            <rect x="${20+k*110}" y="40" width="90" height="80" fill="none" stroke="var(--line2)"/>
            <text class="lb" x="${65+k*110}" y="32" text-anchor="middle">${k}T½</text>
            <text x="${65+k*110}" y="138" text-anchor="middle">${U.fmt(frac*100,4)}%</text>`);}
        V.svg('lgSVG',boxes.join(''),'0 10 570 150');
        const ts=U.seq(0,Math.max(t*1.5,T*6),200);
        V.plot('lgChart',{h:200,series:[{name:'남은 원자 수',data:ts.map(x=>[x,N0*Math.exp(-Math.LN2/T*x)])}],
          xlabel:'경과 일수',ylabel:'원자 수',ymin:0,tight:true,
          vlines:[{x:t,c:V.css('--ok'),label:'현재'},{x:T,c:V.css('--warn'),label:'1 반감기'}]});
        V.plot('lgChart2',{h:180,series:[{name:'반로그',data:ts.map(x=>[x,N0*Math.exp(-Math.LN2/T*x)])}],
          xlabel:'경과 일수',ylabel:'원자 수 (로그)',ylog:true,
          vlines:[{x:t,c:V.css('--ok'),label:'현재'}]});}},
    clt:{n:'중심극한정리',ic:'🎲',d:'왜 무엇을 평균내면 종 모양이 될까?',
      html:()=>`${F.sel('clD','원 분포',[['unif','균등분포 (주사위 같은)',1],['exp','지수분포 (한쪽으로 치우침)'],['bimod','이봉분포 (봉우리 2개)']],null,'LearnUI.run()')}
        ${F.rng('clN','표본 크기 n (몇 개씩 평균?)',1,1,50,1)}
        ${F.rng('clK','반복 횟수',2000,200,10000,100)}`,
      run(){
        const type=gv('clD'),n=gn('clN',1),K=gn('clK',2000);
        const r=PRNG('clt-'+type);
        const draw=()=>{
          if(type==='unif')return r();
          if(type==='exp')return -Math.log(1-r());
          return r()<0.5?r()*0.3:0.7+r()*0.3;};
        const means=[];
        for(let i=0;i<K;i++){let s=0;for(let j=0;j<n;j++)s+=draw();means.push(s/n);}
        const d=S.desc(means);
        const one=[];for(let i=0;i<K;i++)one.push(draw());
        const nt=S.dagostino(means);
        set('lnOut2',
          F.concl(`원 분포: <b>${{unif:'균등',exp:'지수',bimod:'이봉'}[type]}</b> · 표본크기 n = <b>${n}</b><br>
            표본평균의 분포: 평균 ${U.fmt(d.mean,5)}, 표준편차 ${U.fmt(d.sd,5)},
            정규성 p ${U.p(nt.p)} ${nt.p>0.05?'<span class="badge ok">종 모양에 가까움</span>':'<span class="badge warn">아직 치우침</span>'}`)+
          F.card('직관적 이해',`
            <p>왼쪽은 <b>원래 분포</b>(개별 값 하나하나), 오른쪽은 <b>n개씩 뽑아 평균낸 값</b>의 분포입니다.
            슬라이더로 n을 늘려보세요.</p>
            <p>원 분포가 아무리 이상하게 생겼어도, <b>n이 커지면 평균의 분포는 정규분포에 가까워집니다.</b>
            이것이 중심극한정리이고, 많은 통계 검정이 정규분포를 전제할 수 있는 이유입니다.</p>
            <div class="grid2">
              <div><b class="note">① 원 분포 (n=1)</b><div id="clH1"></div></div>
              <div><b class="note">② 표본평균의 분포 (n=${n})</b><div id="clH2"></div></div></div>`,'clVis',true)+
          F.card('표준오차의 감소',F.kv({
            '원 분포 표준편차 σ':U.fmt(S.desc(one).sd,6),
            '표본평균 표준편차 (실측)':U.fmt(d.sd,6),
            '이론값 σ/√n':U.fmt(S.desc(one).sd/Math.sqrt(n),6),

    pval:{n:'p-값의 의미',ic:'❓',d:'p-값은 무엇이고 무엇이 아닌가',
      html:()=>`${F.rng('pvD','실제 효과크기 d',0,0,2,0.05)}${F.rng('pvN','표본크기 (군당)',20,5,200,5)}
        ${F.rng('pvK','실험 반복 횟수',1000,100,5000,100)}`,
      run(){
        const d=gn('pvD',0),n=gn('pvN',20),K=gn('pvK',1000);
        const r=PRNG('pval');
        const ps=[];
        for(let i=0;i<K;i++){
          const a=[],b=[];
          for(let j=0;j<n;j++){a.push(r.norm(0,1));b.push(r.norm(d,1));}
          ps.push(S.ttest2(a,b,false,'two').p);}
        const sig=ps.filter(p=>p<0.05).length;
        const power=sig/K;
        set('lnOut2',
          F.concl(`실제 효과 d = <b>${U.fmt(d,4)}</b>, 군당 n = <b>${n}</b>, 실험 ${K}회 반복<br>
            p < 0.05가 나온 비율 = <span class="big">${U.fmt(power*100,4)} %</span>
            ${d===0?' ← <b>실제 차이가 없는데도</b> 이만큼 "유의"가 나옵니다 (제1종 오류)':' ← 이것이 <b>검정력</b>입니다'}`)+
          F.card('무엇을 보여주는가',`
            <p>같은 실험을 ${K}번 반복하면 p-값이 어떻게 분포하는지 보여줍니다.</p>
            <ul>
              <li><b>d = 0 (효과 없음)</b>으로 두면 p-값이 <b>0~1에 균등하게</b> 퍼집니다.
                그래도 약 5%는 0.05 미만이 됩니다 — 이것이 "우연히 유의해지는" 경우입니다.</li>
              <li><b>d를 키우면</b> p-값이 0 쪽으로 몰립니다.</li>
              <li><b>n을 키우면</b> 같은 d라도 p-값이 더 작아집니다. 즉 <b>p-값은 효과크기와 표본크기를 섞은 값</b>이라
                크기 정보를 담지 않습니다.</li>
            </ul>
            <div class="warnbox">p-값은 <b>"가설이 참일 확률"이 아닙니다.</b>
            "귀무가설이 참일 때 이런 결과가 나올 확률"입니다. 반드시 효과크기·신뢰구간과 함께 해석하십시오.</div>
            <div id="pvHist"></div>`,'pvVis',true)+
          F.card('표본크기와 검정력',`<div id="pvPower"></div>
            <div class="note">같은 효과크기라도 표본이 작으면 놓치고(제2종 오류), 표본이 크면 사소한 차이도 유의해집니다.</div>`,'pvVis2',true)+
          F.card('결과 요약',F.kv({'실험 반복':K,'유의(p<0.05) 횟수':sig,
            '유의 비율':U.fmt(power*100,5)+' %',
            [d===0?'제1종 오류율 (기대 5%)':'검정력']:U.fmt(power*100,5)+' %',
            'p-값 중앙값':U.fmt(S.q([...ps].sort((a,b)=>a-b),0.5,7),5),
            '이론 검정력':U.fmt(S.power2t(d,n,n,0.05)*100,5)+' %'})));
        V.hist('pvHist',ps,25,{h:220,xlabel:'p-값',
          vlines:[{x:0.05,c:V.css('--bad'),label:'0.05'}]});
        V.plot('pvPower',{h:210,series:[
          {name:'d=0.2 (작음)',data:U.seq(5,200,40).map(nn=>[nn,S.power2t(0.2,Math.round(nn),Math.round(nn),0.05)*100])},
          {name:'d=0.5 (중간)',data:U.seq(5,200,40).map(nn=>[nn,S.power2t(0.5,Math.round(nn),Math.round(nn),0.05)*100])},
          {name:'d=0.8 (큼)',data:U.seq(5,200,40).map(nn=>[nn,S.power2t(0.8,Math.round(nn),Math.round(nn),0.05)*100])}],
          xlabel:'군당 표본크기',ylabel:'검정력 (%)',ymin:0,ymax:100,forceLegend:true,
          hlines:[{y:80,c:V.css('--warn'),label:'80%'}],vlines:[{x:n,c:V.css('--ok'),label:'현재'}]});}},

    mdasim:{n:'검출한계의 의미',ic:'🔬',d:'"검출되지 않음"은 "없음"이 아니다',

  run(){
    const res=QA.tests.map(t=>{
      let r,ok,err=null;
      try{r=t.f();
        const diff=r.rel?Math.abs(r.got-r.exp)/Math.abs(r.exp):Math.abs(r.got-r.exp);
        ok=diff<=r.tol||(r.tol===0&&r.got===r.exp);
        return {...t,...r,diff,ok};}
      catch(e){return {...t,ok:false,err:e.message,got:'오류',exp:'—',diff:NaN};}});
    const pass=res.filter(r=>r.ok).length;
    const cats=[...new Set(res.map(r=>r.cat))];
    set('qaOut',
      F.concl(`<b>골든 앵커 자체 검증</b> — ${pass} / ${res.length} 통과
        ${pass===res.length?'<span class="badge ok">✔ 전체 통과</span>':'<span class="badge bad">✖ '+(res.length-pass)+'건 실패</span>'}`)+
      `<div class="badges">${cats.map(c=>{
        const sub=res.filter(r=>r.cat===c),p=sub.filter(r=>r.ok).length;
        return F.badge(c+' '+p+'/'+sub.length,p===sub.length?'ok':'bad');}).join('')}</div>`+
      F.card('검증 결과',F.tbl(['ID','분류','검증 항목','기댓값','산출값','오차','허용','판정'],
        res.map(r=>[r.id,r.cat,r.n+(r.note?`<br><span class="note">${r.note}</span>`:''),
          typeof r.exp==='number'?U.fmt(r.exp,10):r.exp,
          typeof r.got==='number'?U.fmt(r.got,10):r.got,
          isFinite(r.diff)?U.sci(r.diff,3):(r.err||'—'),
          r.rel?U.sci(r.tol,2)+' (상대)':U.sci(r.tol,2),
          r.ok?'<span class="badge ok">통과</span>':'<span class="badge bad">실패</span>'])))+
      F.card('검증 정책 (설계서 §13.2)',F.tbl(['계산 유형','허용 상대오차','근거'],[
        ['해석해 존재','≤ 1e-12','배정밀도 한계 근방'],
        ['특수함수 (CDF·분위수)','≤ 1e-10','라이브러리 구현 정확도'],
        ['선형대수 (QR/SVD)','≤ 1e-9','조건수 보정'],
        ['반복 추정 (GLM·NLS)','≤ 1e-6','최적화 수렴 기준 차이'],
        ['방사선 해석해','≤ 1e-12','폐형식'],
        ['차폐·빌드업','≤ 2%','계수표 보간·판본 차이가 지배'],
        ['재표본 기반','몬테카를로 SE의 3배','확률적 특성']])+
        `<div class="note">본 자체 검증은 <b>필요조건</b>이지 충분조건이 아닙니다.
        설계서 §13.1의 완전한 골든 앵커 체계(NIST StRD, ICRP 간행물 예제, 상호비교 문제)는
        CI 단계에서 별도로 수행되어야 합니다.</div>`)+
      F.card('내보내기',`<div class="btns">
        ${F.btn('검증 결과 CSV',`Session.csv(['ID','분류','항목','기댓값','산출값','판정'],${JSON.stringify(res.map(r=>[r.id,r.cat,r.n.replace(/<[^>]+>/g,''),String(r.exp),String(r.got),r.ok?'통과':'실패']))},'ksb_verification')`,'sec')}
        ${F.btn('재현 매니페스트','Session.exportAll()','sec')}</div>`)+

};
